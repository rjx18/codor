# harn:assume github-ci-pages-deploys-and-relay-worker-isolated ref=github-actions-verify-and-deploy
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every workspace project
        run: pnpm -r build

      - name: Run workspace tests serially
        run: pnpm -r --workspace-concurrency=1 test

      - name: Install the Playwright browser
        run: pnpm --filter @codor/web-next exec playwright install --with-deps chromium

      - name: Run the complete browser suite
        run: pnpm --filter @codor/web-next e2e

      - name: Run release and license audits
        run: |
          pnpm audit:license
          pnpm audit:release

      - name: Test relay Worker deployment decision
        run: pnpm test:relay-deploy-decision

  # harn:assume verified-commit-installers-are-sha-addressed-and-ephemeral ref=ci-commit-installer-artifacts
  commit-installers:
    name: Package verified commit installers
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build commit installers
        run: scripts/package-release-artifacts.sh "$RUNNER_TEMP/codor-installers-${GITHUB_SHA}"

      - name: Upload temporary commit installers
        uses: actions/upload-artifact@v7
        with:
          name: codor-installers-${{ github.sha }}
          path: ${{ runner.temp }}/codor-installers-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
  # harn:end verified-commit-installers-are-sha-addressed-and-ephemeral

  deploy-production:
    name: Deploy codor.app and conditionally relay
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, commit-installers, relay_decision]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://codor.app
    concurrency:
      group: codor-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy the blind relay Worker when selected
        if: needs.relay_decision.outputs.deploy == 'true'
        run: pnpm --filter @codor/relay-worker run deploy

      - name: Record skipped blind relay Worker
        if: needs.relay_decision.outputs.deploy != 'true'
        env:
          RELAY_DECISION_REASON: ${{ needs.relay_decision.outputs.reason }}
        run: echo "Skipping blind relay Worker - $RELAY_DECISION_REASON"

      - name: Build, verify, and deploy codor.app
        run: pnpm deploy:app

      - name: Smoke production endpoints
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors https://relay.codor.app/healthz >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors https://codor.app/ >/dev/null
  relay_decision:
    name: Decide relay Worker deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Check out the complete pushed history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate the full pushed range
        id: decision
        env:
          RELAY_COMPARE_BEFORE: ${{ github.event.before }}
          RELAY_COMPARE_AFTER: ${{ github.sha }}
        run: |
          decision="$(node scripts/relay-deploy-decision.mjs --before "$RELAY_COMPARE_BEFORE" --after "$RELAY_COMPARE_AFTER")"
          printf '%s\n' "$decision"
          deploy="$(printf '%s\n' "$decision" | sed -n 's/^deploy=//p')"
          reason="$(printf '%s\n' "$decision" | sed -n 's/^reason=//p')"
          test "$deploy" = true -o "$deploy" = false
          test -n "$reason"
          {
            echo "deploy=$deploy"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
# harn:end github-ci-pages-deploys-and-relay-worker-isolated
