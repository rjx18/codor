id: composer-acknowledgement-preserves-owned-raw-drafts
hash: a-2889ca74ce6a
title: Composer acknowledgement separates raw draft ownership from canonical echo
state: active
statement: Each composer dispatch captures its exact raw draft and canonical
  submitted payload. An opted-in send settles only on its correlated
  authoritative acceptance or refusal; a legacy send observes only its own new
  canonical message echo in the destination. Acceptance clears the originating
  draft only while its complete body, reply and attachment selection still
  matches the captured snapshot, preserving edits and other rooms or computers.
depends_on:
  - pending-composer-echo-is-destination-and-self-bound
  - exact-trailing-mentions-send-before-owned-result
  - composer-enter-uses-live-draft-state
created_by: relay-polish-p6-idempotent-posts
