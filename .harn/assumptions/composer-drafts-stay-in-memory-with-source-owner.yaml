id: composer-drafts-stay-in-memory-with-source-owner
hash: a-a479b020d0a1
title: Drafts retain their source owner in memory
state: active
statement: Draft body, reply, uploaded attachment selections and pending
  submission settlement are retained only in page memory under their originating
  connection and room across view changes and reconnect. Correlated success and
  refusal update only that owner; newer edits survive and rejected voice
  transcripts remain editable without retranscribing or reuploading. Closing the
  page ends automatic recovery.
depends_on:
  - composer-acknowledgement-preserves-owned-raw-drafts
  - pending-submission-retries-only-through-ready-owner
created_by: relay-polish-p6-idempotent-posts
