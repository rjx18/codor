id: create-channel-roster-choice-preserves-starting-agent-draft
hash: a-219f3b1a725e
title: Create Channel selects one default roster without mutating Starting agent
state: active
statement: Normal and paired first-channel creation must show the current
  default roster as one readable ordered group choice, keep legacy Starting
  agent usable while roster data loads or fails, and when selected hide but not
  reconcile or mutate the complete Starting agent draft, ignore that hidden
  draft's validity, and send only default_roster true; deselection must restore
  the exact draft and a failed create must preserve both the choice and draft
  for retry in direct and hosted modes, because choosing a reusable team is
  exclusive with but must never destroy the operator's separately prepared
  single-agent alternative.
