id: grouped-deliveries-retain-single-handoff-briefings
hash: a-3419c1be2897
title: Grouped deliveries retain roster and single-handoff briefings
state: active
statement: >
  Delivery-time composition for grouped work must append the active roster when
  the recipient roster is stale and the adapter-independent single-handoff
  conventions when their persisted gate is re-armed by first delivery,
  misaddress, or successful automatic/manual compaction, then clear each flag
  only after appending its block, while the immutable group root and result
  bundle remains unchanged.
