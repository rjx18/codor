title: Hosted computer customization remains viewport-safe and accessible
state: active
statement: >
  The browser-local computer customization dialog stays within the viewport,
  exposes a bounded internal scroll region for long icon/color content, keeps
  keyboard focus and Escape/outside-close behavior valid, preserves at least
  44px control targets, and remains Axe-clean on desktop and phone widths.
