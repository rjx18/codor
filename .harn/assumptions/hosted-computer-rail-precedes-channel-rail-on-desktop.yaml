title: Hosted computer rail precedes the channel rail on desktop
state: active
statement: >
  In managed hosted desktop mode the computer rail is the first navigation rail,
  immediately before the channel rail, while the existing mobile single-surface
  composition keeps its current channel-rail placement and phone behavior
  unchanged.
