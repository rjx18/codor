title: Browser preset selection still fills one editable ordinary spawn draft
state: active
statement: Browser Add agent must show authorized individual presets beside its
  built-in shortcuts, resolve a freshly read valid preset through the accepted
  REST ingress into the same editable handle, display-name, harness, model,
  thinking, policy, and ACP controls, preserve room cwd and per-add purpose, and
  submit exactly one ordinary spawn act with concrete values and no
  preset/roster reference; malformed, deleted, or catalog-invalid presets must
  leave the draft unchanged, and later edit or deletion cannot mutate a selected
  draft or member, because the new CLI ingress does not turn browser preset
  selection into live state or a second creation lifecycle.
