title: The single-handoff live collaboration contract is public
state: active
statement: >
  Public docs must describe member-attributed interim and blocking posts,
  direct-reply wait mechanics, consuming inbox hooks, transient wait visibility,
  member status, bounded redacted run-evidence search, and the exact
  adapter-independent single-handoff conventions briefing agents receive, while
  clearly distinguishing separately available observability tools from briefing
  guidance that forbids polling delegated channel work.
