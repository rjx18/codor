id: loading-messages-use-one-floating-pill-without-tail-skeleton
hash: a-00537dcee43a
title: Room loading uses one floating pill without a bottom synchronization skeleton
state: retired
statement: >
  The room UI exposes at most one accessible loading surface for the existing
  prioritized readiness signals: the high-contrast floating spinner pill with
  one “Loading messages…” label, its existing entrance and reduced-motion
  behavior, and no bottom synchronization skeleton during initialized head
  refresh. Initial hydration keeps its existing empty-chat placeholder,
  older-page loads keep their floating state and reader anchoring, and no new
  loading state machine, request, or scroll owner is introduced.
depends_on:
