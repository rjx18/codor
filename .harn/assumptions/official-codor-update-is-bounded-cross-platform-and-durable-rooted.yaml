id: official-codor-update-is-bounded-cross-platform-and-durable-rooted
hash: a-b3d2ebc5bc8e
title: Codor update selects one bounded official candidate for an existing
  durable runtime
state: active
statement: >
  When the selected data root contains a durable Codor runtime, `codor update`
  may be invoked by its launcher, a source-linked CLI, or the official npx
  candidate without mutating the invoking checkout; it must resolve
  @richhardry/codor latest and acquire the resulting exact stable non-prerelease
  version only through https://registry.npmjs.org, never downgrade a newer
  installed semantic version, invoke npm without a shell (using Node plus npm's
  JavaScript entrypoint on Windows), bound registry lookup, acquisition, and
  candidate-child execution with direct timeout diagnostics, and execute only
  the acquired candidate against the exact selected data root. If no durable
  runtime exists, a source invocation gives Git/build guidance and a packaged
  invocation gives install guidance; arbitrary sources, prereleases, background
  updates, onboarding, and pairing minting remain forbidden. The first release
  that introduces update must be invokable once as `npx --yes
  --package=@richhardry/codor@latest codor update`, after which the durable
  launcher provides plain `codor update`.
depends_on:
  - github-tags-publish-one-immutable-alpha-or-stable-release
  - setup-resolves-complete-invoking-runtime
  - public-package-bundles-complete-codor-runtime
