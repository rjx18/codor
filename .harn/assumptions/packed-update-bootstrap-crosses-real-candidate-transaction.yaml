id: packed-update-bootstrap-crosses-real-candidate-transaction
hash: a-6ae9cf361f70
title: Packed npx proof performs a previous-runtime official update transaction
state: retired
statement: >
  The clean local-TGZ release proof must invoke the real public `npx --yes
  --package=<packed-candidate> codor update` command against a controlled
  previous durable runtime, exercise official-registry lookup/acquisition, the
  acquired package's private updater, runtime swap, rendered service generation,
  and authenticated readiness, and prove the selected version commits without
  touching a real host. Help-only dispatch is not an update proof.
