id: pending-submission-retries-only-through-ready-owner-v2
hash: a-9008612430d1
title: Independent submissions retry only through their ready owner
state: active
statement: Each computer retains independently identified immutable dispatched
  submissions in page memory. Automatic recovery retries each original ID and
  payload at most once per ready socket generation on its own authenticated
  room, only with verified acknowledgement support. Explicit same-ID Resend
  admits only one in-flight attempt per row. Correlated results never settle
  another submission. No offline admission, timers, persistent outbox or
  reconnect loop is added.
depends_on:
  - hosted-app-streams-follow-tunnel-generations
  - hosted-computer-sessions-keep-state-isolated
  - post-acknowledgements-are-optional-and-correlated
created_by: optimistic-send-message-owned-status
