id: post-capability-recovery-is-owned-and-bounded-v2
hash: a-be6778b893bd
title: Unknown post capability retries through its ready owner
state: active
statement: Timeouts, transport errors and failed compatibility responses leave
  post capability unknown, distinct from verified supported or unsupported. One
  bounded abortable compatibility check per owning socket generation uses that
  session's credential renewal, coalesces concurrent intent, and retries unknown
  results with bounded backoff while the connection is healthy. Generation
  retirement and auth/manual/upgrade/disposal parks cancel the checks. Only
  verified support permits replay of the original immutable pending ID;
  verification never replaces a healthy connection or sends legacy retries.
depends_on:
  - pending-submission-retries-only-through-ready-owner-v2
  - relay-read-renewal-retains-original-owner
  - hosted-app-streams-follow-tunnel-generations
