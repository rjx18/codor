id: preset-derived-members-are-isolated-durable-snapshots
hash: a-c2304bb35c68
title: Preset-derived members remain isolated durable snapshots across restart
state: active
statement: Reusing the same individual presets through ordinary Add agent and
  repeated default-roster channel creation must produce fresh member ids,
  in-memory Sessions, native session references, room/member-bound credentials,
  and member-scoped runtime state for every concrete agent; later preset edits,
  roster replacement, source deletion, and switchboard restart must preserve
  each member's copied configuration, private runtime data, established native
  reference, tasks, runs, and room isolation, while lazy reconstruction resumes
  only that member's reference in a new Session and rotates its credential,
  because reusable configuration is never shared membership, authority, or
  runtime identity.
