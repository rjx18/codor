id: prioritized-room-loading-pill-uses-existing-readiness-with-grace
hash: a-c7f27e74d003
title: One room loading pill projects existing readiness in fixed priority
  (source-owned grace)
state: active
statement: Outside the source-owned five-second transient grace, the existing
  reconnect/channel/head/older priority selects at most one floating loading
  pill. During grace, reconnect-only and reconnect-room-readiness feedback is
  withheld while genuine requested history/older work retains the existing
  loading presentation. Actual readiness and mutation guards stay truthful; no
  history request or second scroll owner is introduced.
