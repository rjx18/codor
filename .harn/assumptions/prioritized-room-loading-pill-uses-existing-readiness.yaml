id: prioritized-room-loading-pill-uses-existing-readiness
hash: a-b8f779035222
title: One room loading pill projects existing readiness in fixed priority
state: active
statement: >
  The web client exposes at most one top floating room-status pill whose visible
  state is derived without new local loading state or requests: Reconnecting has
  priority whenever the current connection is not online and the retained room
  is in the existing readable reconnect boundary; otherwise an unhydrated or
  not-currently-ready active room reports Loading channel, an existing
  transcript-history loadingHead reports Syncing messages, and an existing
  loadingCursor reports Loading older messages. The first true state wins,
  lower-priority work never flashes concurrently, the pill remains accessible
  and compact, and direct/hosted store isolation plus existing recovery and
  mutation admission semantics remain unchanged.
