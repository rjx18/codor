id: qualified-execution-requires-usable-checkout
hash: a-74cab09035ab
title: Qualified execution requires one usable registered checkout
state: active
statement: A persisted qualified delivery may start, recover, retry, or
  redeliver only while its stable repository, worktree, conversation, and member
  identities still match an active registration whose last reconciled
  availability is available or locked; missing, prunable, unregistered, removed,
  cross-repository, or removed-member targets must settle visibly in the origin
  without adapter execution, local fallback, evidence loss, or resurrection
  across restart.
depends_on:
  - qualified-member-target-identity-is-durable
  - invalid-qualified-targets-never-fallback
  - registered-worktree-identities-are-durable
  - delivery-attempt-wal-reconcile
created_by: native-worktrees-phase5-integration-hardening
