id: relay-pairing-host
hash: a-e0c15d50f348
title: Relay pairing terminates in the existing PairingService enrollment
state: retired
statement: packages/switchboard/src/relay/pairing-host.ts must drive the host
  side of relay pairing - reserve a room, connect the pairing-room WS as host,
  run a fresh PakeHost per claimant with attempt and reset handling, and over
  the pairing AEAD channel send hello (carrying a pairing_token minted by the
  existing PairingService.issue and the host static key + session id), verify
  the echoed token, call PairingService.complete to enroll the device into the
  existing PairingResult, persist {device_id, kid, client_static_pub} to the
  relay store, deliver the enrolled result, and signal success to burn the room.
depends_on:
  - tunnel-pake-cpace
  - tunnel-pairing-channel-payloads
  - relay-store-persistence
created_by: relay-p5-switchboard
retired_by: relay-ux-p1-universal-code
