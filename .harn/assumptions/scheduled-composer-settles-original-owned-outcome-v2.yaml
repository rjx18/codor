id: scheduled-composer-settles-original-owned-outcome-v2
hash: a-132679df3826
title: Scheduled composer acknowledgement preserves exact raw draft ownership
state: active
statement: Scheduled composer submissions retain the raw draft, immutable
  canonical directive, originating room and computer. An opted-in request
  settles on its correlated original schedule outcome, including its original
  due instant; legacy mode continues to match a newly observed schedule by
  destination, authenticated author and clean body. Refusals keep editable text
  and acceptance never clears a newer draft.
