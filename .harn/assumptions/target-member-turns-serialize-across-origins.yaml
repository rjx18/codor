id: target-member-turns-serialize-across-origins
hash: a-1133d2e370ee
title: One target member serializes durable work across origin conversations
state: retired
statement: All queued deliveries for one stable member must be admitted in a
  deterministic durable order across origin conversations with at most one
  adapter turn in flight; batching and active steering may combine only
  compatible deliveries from the same origin/routing context, and settling or
  recovering one origin must drain the next without loss, duplication,
  cross-origin steering, or collaboration resurrection.
