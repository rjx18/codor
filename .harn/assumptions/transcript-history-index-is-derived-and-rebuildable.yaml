id: transcript-history-index-is-derived-and-rebuildable
hash: a-a15b0f86b9c7
title: Transcript history index metadata is derived, atomic, and rebuildable
state: active
statement: >
  SQLite may persist only versioned transcript ordering, unit identity, charge,
  message-reference, and JSONL byte-span metadata derived from authoritative
  message rows and run journals. The first request for an unindexed room builds
  that metadata from one complete established-order scan and installs it
  atomically; failure leaves no complete marker. Message mutations
  transactionally mark affected identities dirty, later requests replace only
  those ordinary rows or terminal run families, and deletion removes their
  derived units. The index may always be discarded and rebuilt without changing
  transcript truth.
