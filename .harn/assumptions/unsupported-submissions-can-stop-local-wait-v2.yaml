id: unsupported-submissions-can-stop-local-wait-v2
hash: a-cc30cd4b5a35
title: Unsupported submissions preserve uncertainty without automatic replay
state: active
statement: A verified unsupported replacement never automatically replays a
  retained submission. Legacy acknowledgement-only composition retains the
  guarded Stop waiting control; optimistic records retain their captured content
  and explicit uncertainty until local retry, edit or discard. Discard stops
  local recovery without claiming server cancellation. Neither a late result nor
  a capability change clears a newer draft or transfers content to another
  computer.
depends_on:
  - post-capability-recovery-is-owned-and-bounded-v2
  - composer-acknowledgement-preserves-owned-raw-drafts-v2
created_by: optimistic-send-message-owned-status
