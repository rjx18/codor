id: visible-transcript-grouping-ignores-hidden-boundaries
hash: a-f7132a29635d
title: Transcript grouping follows visible turns and resets at visible boundaries
state: active
statement: >
  The browser transcript derives same-author header suppression from the
  previous genuinely rendered visible turn, not from raw message or output-row
  adjacency. Evidence-free continuation rows remain under the existing CSS
  hiding contract and do not alter that previous-visible-turn state. A rendered
  compaction marker, system row, or terminal status resets grouping, while
  consecutive visible same-author turns inside the grouping window continue to
  collapse their repeated header in both live and finalized combined-history
  presentation.
