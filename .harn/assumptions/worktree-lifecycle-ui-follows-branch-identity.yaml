id: worktree-lifecycle-ui-follows-branch-identity
hash: a-c94d821461a4
title: Worktree lifecycle UI uses the Git branch as its only name
state: active
statement: >
  Only an authorized human may see lifecycle controls; Find must discover on
  explicit open and adopt one selected branch without a second name, Create must
  collect only the new branch, missing absolute target, and optional roster, and
  Manage must identify the child by exact branch and offer only distinct
  unregister and preview-gated filesystem removal acts. Errors preserve drafts
  and selection, removal keeps its fresh safety checks and confirmations, and
  every surface remains keyboard-, focus-, phone-, direct-, and relay-transport
  accessible.
depends_on:
