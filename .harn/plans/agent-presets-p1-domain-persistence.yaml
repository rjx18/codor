  - packages/web-next/src/runtime/api.ts
  - packages/web-next/src/runtime/api.spec.ts
verification: Run pnpm --filter @codor/protocol test; pnpm --filter
  @codor/switchboard exec vitest run src/agent-presets.spec.ts; pnpm --filter
  @codor/web-next exec vitest run src/runtime/api.spec.ts; pnpm --filter
  @codor/protocol build; pnpm --filter @codor/switchboard build; pnpm --filter
  @codor/web-next build; harn find --plan agent-presets-p1-domain-persistence;
  harn check agent-presets-p1-domain-persistence; and the staged Harn gate
  before the one implementation commit. The focused suites must cover schemas,
  pre-feature migration, CRUD, stable identity/version/timestamps, exact roster
  order, duplicate/missing references, RESTRICT deletion, reopen/restart,
  catalog and ACP validation with no spawn, global authorization for every
  principal class, direct daemon behavior, direct native-fetch client behavior,
  and routed HTTP helper usage. Do not run web e2e because this phase adds no
  UI.
