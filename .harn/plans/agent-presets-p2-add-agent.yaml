verification: Run pnpm --filter @codor/protocol test; pnpm --filter
  @codor/switchboard exec vitest run src/agent-presets.spec.ts
  src/server.spec.ts; pnpm --filter @codor/web-next exec vitest run
  src/runtime/api.spec.ts src/room/agent-spec.spec.ts; pnpm --filter
  @codor/protocol build; pnpm --filter @codor/switchboard build; pnpm --filter
  @codor/web-next build; and pnpm --filter @codor/web-next exec playwright test
  tests/room37-agent-presets.e2e.spec.ts tests/room10-dialogs.e2e.spec.ts with
  isolated harness ports after the required workspace build. The focused browser
  run must cover exact one-act native/named/custom mapping with no preset id,
  display-name snapshot and editable overrides, fresh detail reads, deletion
  before selection, deletion after selection, invalid schema and stale catalog
  behavior without partial draft changes, loading/error recovery,
  selected-preset spawn pending/failure preservation, unchanged manual and
  built-in role shortcuts, owner visibility plus underprivileged absence/no
  request, keyboard operation, axe-clean focus/error states, and 390px
  no-overflow/44px tiles. Rerun harn find --plan agent-presets-p2-add-agent,
  harn check agent-presets-p2-add-agent, and the staged Harn gate before the one
  implementation commit. Do not exercise or change Settings, default-roster
  expansion, or Create Channel roster UI.
