id: agent-presets-p2-add-agent
title: Phase 2 - resolve individual agent presets into one ordinary Add agent spawn
notes: >-
  This is only Phase 2 of .codor/PHASED-PLAN.md, based on clean commit
  864f159b5adc97cca88c64e1a248d4eac50a375a after Phase 1 and its two review
  fixes passed independent review. It integrates reusable individual agent
  presets into the existing Add agent dialog. It does not read or expand the
  default roster, change channel creation, add a Settings surface, mutate preset
  persistence, create a new member-creation endpoint or act, add CLI or relay
  records, or begin Phases 3 through 5.

  Add agent loads the authorized individual-preset list through the existing
  relayFetch-backed runtime API each time the dialog opens. The built-in Coder,
  Reviewer, Planner, Writer, and Tester shortcuts remain immediately visible and
  usable while the custom list is loading or has failed. Custom tiles appear in
  the same Preset group and use the server label plus stable id for identity.
  Clicking a custom tile performs one addressed GET before changing the draft,
  so an edit is picked up and a preset deleted between listing and selection
  yields the existing 404 diagnostic. Both list and addressed responses are
  parsed with AgentPresetSchema at the runtime boundary. A malformed response,
  unavailable native harness, missing named ACP selector, unavailable generic
  custom-ACP transport, model absent from a nonempty current catalog, or
  thinking level no longer supported by the selected registration leaves every
  current form value untouched and reports a recoverable preset error. These
  client checks consume the same live adapter catalog and shared thinking
  helpers; the daemon remains authoritative and still revalidates availability
  and custom ACP executable resolution at the ordinary spawn boundary.

  A successful selection copies only reusable preset-owned configuration into
  the existing draft: native harness id or named acp:<provider> selector or the
  generic acp selector, handle made unique against current live members,
  optional display name, model, thinking, canonical policy, and structured ACP
  launch mapped to executable plus one literal argv entry per line. Omitted
  model, thinking, display name, and ACP fields clear stale values; omitted
  policy becomes the existing safe read-only spawn default. The room-derived cwd
  and the operator's per-add purpose stay untouched because neither belongs to a
  reusable preset. After selection, every supported field remains editable
  through the current identity/AgentControls form. Selection is then a detached
  value snapshot: later preset edits or deletion do not update the draft or the
  created member.

  Submission continues to call buildSpawnSpec and sends exactly one existing
  WebSocket spawn act containing concrete values and no preset id, roster id, or
  storage reference. The act additively accepts the preset's optional bounded
  display_name and the WebSocket dispatcher passes it to the existing
  Daemon.spawnMember option, which already persists display_name atomically with
  the member and defaults it to the handle when absent. No follow-up rename act
  is allowed. Existing handle/cwd/policy/thinking/model/ACP validation, handle
  suffixing, pending correlation, timeout, server-error preservation, and retry
  behavior remain the one spawn path for manual, built-in, and custom-preset
  adds.

  The Add agent trigger is rendered only for the already-authorized owner/admin
  role that can perform spawn/manage_agents. Phase 1's server matrix remains the
  security boundary: owner, paired-browser owner, and admin may list/read
  presets; member, observer, anonymous, and agent credentials cannot retrieve
  custom launch material; and the existing spawn act remains admin-gated.
  Browser coverage proves an underprivileged member has no trigger and makes no
  preset request, while the existing switchboard matrix is rerun. The focused
  browser fixture seeds individual presets only; it does not seed or use the
  default roster.

  web-next is intentionally .harnignore'd, so its runtime parsing, pure mapping,
  dialog state, styling, fixture, and Playwright evidence are named in files and
  verification but do not gain source anchors. Harn-tracked anchors cover the
  sole additive protocol/server contract. Focused pure and browser regressions
  must prove native, named ACP, and custom ACP mapping; exact one-act payload
  and display-name snapshot; fresh addressed selection; deletion before
  selection; deletion after selection; malformed and catalog-stale failure
  without partial draft mutation; list/select pending and error recovery;
  selected-preset spawn failure preserving edits; built-in/manual Add agent;
  role authorization; keyboard operation; accessible dialog state; and 390px
  no-overflow/minimum-hit geometry.
assumptions:
  create:
    - id: individual-agent-preset-selection-snapshots-one-ordinary-spawn
      title: Selecting an individual preset fills one editable ordinary spawn draft
      statement: Add agent must show authorized individual agent presets beside its
        built-in role shortcuts, resolve a freshly read valid preset into the
        same editable handle, display-name, harness, model, thinking, policy,
        and ACP controls used by manual creation, preserve room-derived cwd and
        per-add purpose, and submit exactly one ordinary spawn act containing
        concrete snapshotted values and no preset or roster reference;
        malformed, deleted, or currently catalog-invalid presets must leave the
        draft unchanged with a recoverable error, while later preset edit or
        deletion cannot mutate an already selected draft or created member,
        because a reusable preset is an input shortcut rather than live
        membership state or a second creation lifecycle.
      reason: Phase 2 must make individual presets useful in Add agent without
        coupling members to local configuration, bypassing canonical controls,
        or breaking the existing manual and role-shortcut path.
      depends_on:
        - individual-agent-presets-are-bounded-catalog-validated-configurations
        - individual-agent-presets-are-versioned-local-state
        - agent-preset-management-is-authorized-and-transport-neutral
        - web-spawn-dialog-exposes-canonical-agent-controls
        - agent-controls-shared-by-both-dialogs
        - one-control-chooses-an-agent-everywhere
        - agent-selection-shows-detected-acp-and-advanced-custom
        - new-agent-requests-require-available-native-or-detected-acp
  reviewed:
    - id: individual-agent-presets-are-bounded-catalog-validated-configurations
      outcome: unchanged
      reason: Selection consumes the strict Phase 1 schema and copies only its
        reusable fields; cwd, purpose, credentials, sessions, runtime state,
        membership, and unknown data remain outside the preset contract.
    - id: individual-agent-presets-are-versioned-local-state
      outcome: unchanged
      reason: Add agent reads a preset but never mutates it or stores its id on a
        member; selection detaches concrete values from the stable persistence
        identity.
    - id: default-roster-is-one-versioned-ordered-preset-reference-group
      outcome: unchanged
      reason: Phase 2 neither reads nor renders the default roster and creates only
        one member from one individual preset.
    - id: default-roster-references-block-preset-deletion
      outcome: unchanged
      reason: Add agent does not change reference integrity; its test presets are not
        roster members, and deletion after selection affects only storage, not
        the detached draft.
    - id: agent-preset-management-is-authorized-and-transport-neutral
      outcome: unchanged
      reason: Listing and fresh addressed reads use the existing manage_agents REST
        helpers through relayFetch; no WebSocket preset operation, cache, relay
        record, or alternate authorization path is added.
    - id: web-spawn-dialog-exposes-canonical-agent-controls
      outcome: unchanged
      reason: Presets fill the current draft and existing AgentControls rather than
        adding a parallel form or spawn lifecycle; manual presets, errors,
        suffixing, cwd, purpose, pending, and retry behavior remain.
    - id: agent-controls-shared-by-both-dialogs
      outcome: unchanged
      reason: Add agent maps the selected values into AgentConfig and continues to
        render the sole shared harness/model/thinking/policy controls; Create
        Channel and Configure are not changed.
    - id: one-control-chooses-an-agent-everywhere
      outcome: unchanged
      reason: A preset prefill is input to the one shared control, never a second
        policy, model, or thinking implementation.
    - id: agent-selection-shows-detected-acp-and-advanced-custom
      outcome: unchanged
      reason: Named presets map only to acp:<provider> selector identity and custom
        presets map to the existing Advanced generic ACP fields; selector
        rendering and safe wire compilation remain shared.
    - id: canonical-spawn-controls-enforced
      outcome: unchanged
      reason: The concrete snapshotted values travel through buildSpawnSpec and the
        existing daemon validation; presets do not add a validation bypass.
    - id: new-agent-requests-require-available-native-or-detected-acp
      outcome: unchanged
      reason: Client catalog checks provide recoverable early feedback, while the
        daemon still rejects stale native, named, or custom ACP values before
        member persistence.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: Add agent visibility follows the existing owner/admin role and its
        normal spawn act remains admin-gated; no role or capability rank
        changes.
    - id: agent-network-authority-is-narrow
      outcome: unchanged
      reason: Agent credentials remain unable to read global preset data or send a
        spawn act, and no agent-facing route is added.
    - id: acp-launch-is-structured-authorized-and-bounded
      outcome: unchanged
      reason: A custom preset maps the already-authorized structured executable and
        literal argv into the existing form/wire shape; server resolution and
        shell-free bounds remain authoritative.
    - id: named-acp-provider-selection-resolves-to-private-structured-launch
      outcome: unchanged
      reason: A named preset sends only the safe provider id through the ordinary
        spawn act and never learns or exposes its private resolved command.
    - id: spawn-default-cwd-is-absolute-or-empty
      outcome: unchanged
      reason: Preset selection deliberately leaves the existing room-derived cwd draft
        untouched, and the same required cwd is submitted.
    - id: controls-fit-the-surface-they-sit-on
      outcome: unchanged
      reason: The preset row remains wrapping inside the structured dialog and
        receives an explicit narrow-width overflow regression.
    - id: web-room-targets-meet-minimum-hit-size
      outcome: unchanged
      reason: Custom preset tiles use the established minimum-height control and
        focused phone coverage measures their real hit boxes.
    - id: modal-dialogs-layer-above-room-chrome
      outcome: unchanged
      reason: Add agent keeps the existing shared Modal portal, focus trap, Escape,
        and stacking behavior.
    - id: unix-socket-same-protocol
      outcome: unchanged
      reason: The shared WebSocket dispatcher additively forwards one optional
        display_name field over both listeners; framing, authentication, and
        listener behavior are unchanged.
    - id: browser-protocol-epoch-blocks-only-stale-browser-ui
      outcome: unchanged
      reason: Optional display_name is additive and omission retains the existing
        handle-derived display name, so no incompatible browser epoch is needed.
anchors:
  individual-agent-preset-selection-snapshots-one-ordinary-spawn:
    agent-preset-spawn-display-name-contract:
      action: change
      reason: Add one bounded optional display_name to the existing spawn act so a
        selected preset can create the intended member in one atomic act.
    agent-preset-spawn-display-name-regression:
      action: change
      reason: Prove the protocol accepts a bounded optional display name, rejects
        empty/oversized values, and keeps omission compatible.
    agent-preset-spawn-display-name-dispatch:
      action: change
      reason: Forward optional display_name from the ordinary WebSocket spawn act to
        the existing Daemon.spawnMember option without a follow-up rename.
    agent-preset-spawn-server-regression:
      action: change
      reason: Prove one authorized spawn act atomically creates the member with the
        supplied display name, omission defaults to handle, and an
        underprivileged human cannot spawn.
  unix-socket-same-protocol:
    unix-websocket-listener:
      action: change
      reason: "Mechanical nesting: the common listener dispatcher forwards the new
        additive optional spawn field identically for TCP and local sockets."
