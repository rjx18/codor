id: agent-presets-p3-default-roster-create
title: Phase 3 - expand the default roster into detached channel members
notes: >-
  This is only Phase 3 of .codor/PHASED-PLAN.md, based on clean commit
  a3a69d9be1c4d0f6cb3ce7f2315cbda2e5bd74f9 after Phase 2 and its review-fix
  passed independent review. It extends the authenticated channel-creation
  domain and runtime path. It does not add the Phase 4 Settings editor or Create
  Channel UI, change Add agent, change preset/roster management CRUD, add a CLI
  command, synchronize configuration through accounts/cloud/relay, or begin
  Phase 4/5 hardening.

  The additive public request field is `default_roster: true`. Omission is the
  complete legacy contract; literal false is not a second spelling for omission.
  The field and `starting_agent` are mutually exclusive, while omitting both
  remains valid. A selected empty default roster is valid and creates the same
  owner/system-only channel, without inventing an agent. Existing direct and
  hosted runtime helpers pass the typed request through the same POST /api/rooms
  boundary. The existing owner-only manage_rooms gate is unchanged and already
  implies manage_agents; paired-browser owners may create the roster channel,
  while admin/member/observer/anonymous/agent principals gain no new authority
  and no custom launch material is returned.

  Before committing anything, Daemon.createRoom must synchronously read the one
  current default roster in stored ordinal order, resolve every reference to its
  current strict individual preset, and convert each to concrete initial member
  configuration. Preset omission rules match Add agent: display name falls back
  to handle, model/thinking/ACP fields remain absent, and absent policy becomes
  the safe read-only default. Presets never supply cwd or purpose; one
  request/channel cwd is normalized exactly once and is copied to every expanded
  member. The complete expansion rejects a missing/stale or malformed reference,
  a reserved handle, owner/system collision, duplicate handles across distinct
  presets, unavailable native/configurable/named ACP, nonresolving custom ACP
  executable, stale nonempty model catalog, unsupported thinking, or invalid
  policy before any adapter.spawn call, room/member row, system message,
  encryption key, or other mutation. Validation reuses the existing preset,
  adapter, ACP-resolution, and spawn-option authorities; it must not create a
  process or session as a probe.

  Once the complete snapshot is valid, Store.createRoom atomically inserts the
  room, owner, system member, and every concrete initial agent row in roster
  order. Each agent has a fresh member id, the copied public configuration, the
  privately resolved ACP launch where applicable, and a fail-closed dead state
  until its runtime activation succeeds. No preset id, roster id, ordinal
  reference, credential, or native session is copied from configuration. A
  roster-created room does not set RoomConfig.starting_agent_handle: selecting
  the group is not secretly selecting its first member as Starting agent. The
  existing default-recipient chain therefore makes a fresh multi-agent roster
  message room commentary, uses a sole live roster agent when there is exactly
  one, and still prefers a later finalized agent normally. Legacy starting_agent
  requests continue to set their requested starting handle and share the same
  atomic initial-member seed/activation machinery.

  After the transaction, activate each seeded initial agent separately and in
  input/roster order. Each successful activation calls adapter.spawn exactly
  once with its concrete snapshot, receives its own Session object and newly
  issued credential, persists any session/runtime fields through the existing
  private mechanisms, and moves only that member to idle. If an adapter spawn
  throws, the already-valid channel and all member snapshots remain durable;
  that member stays visible and dead, gets one safe actionable system
  diagnostic, and activation continues with every later roster member. A failure
  must not roll back or rewrite successful peers, share a session or credential,
  or erase the failed identity. Updating presets or replacing the default roster
  after creation cannot mutate the room or members because only concrete values
  were seeded.

  Focused protocol, Store, daemon, REST, and hosted-runtime regressions must
  prove the exclusive additive request and legacy omission; empty roster; atomic
  ordered seed and rollback on an invalid seed; native, named ACP, and custom
  ACP snapshots; no stored source references or leaked private launch;
  duplicate/owner/reserved handles; stale/malformed references and catalog drift
  before any room/spawn; distinct member/session/credential identity; partial
  runtime failure with later activation and a dead visible member; unchanged
  default-recipient behavior; paired-owner authorization; legacy no-agent and
  Starting agent clients; and relay/direct request parity. This phase has no
  browser UI or Playwright work.
assumptions:
  create:
    - id: default-roster-channel-selection-is-exclusive-and-preflighted
      title: Default-roster channel selection expands completely before creation
      statement: An authenticated channel-create request may add the literal
        default_roster true or the existing starting_agent but never both; when
        the roster is selected, the daemon must synchronously expand the one
        current ordered group into concrete safe-defaulted configurations and
        validate every reference, handle, catalog field, policy, thinking level,
        and named/custom ACP resolution before any adapter spawn, room/member
        persistence, room-key creation, or other mutation, while an empty group
        and legacy omission remain valid, because an invalid complete roster
        must never create a partial channel and a singleton local group does not
        need a caller-supplied id or alternate lifecycle.
      reason: Phase 3 adds one group choice to the existing authenticated create
        contract without allowing stale local configuration, partial preflight,
        or a parallel validation authority.
      depends_on:
        - default-roster-is-one-versioned-ordered-preset-reference-group
        - individual-agent-presets-are-bounded-catalog-validated-configurations
        - channel-create-request-contract
        - channel-creation-derived-and-seeded
        - new-agent-requests-require-available-native-or-detected-acp
        - canonical-spawn-controls-enforced
        - spawn-default-cwd-is-absolute-or-empty
    - id: default-roster-channel-members-are-detached-ordered-snapshots
      title: A roster selection seeds concrete ordered members without source
        references
      statement: After complete preflight, channel creation must atomically seed the
        room, owner, system member, and each expanded roster agent in stored
        order with a fresh member id, one normalized channel cwd, concrete
        public configuration, and any resolved private runtime launch, while
        persisting no preset/roster reference and no starting_agent_handle for
        the group; later preset or roster edits cannot mutate those members,
        because the ordered group is a creation input snapshot rather than live
        membership state or a hidden first Starting agent.
      reason: The default roster must create the complete ordered team while
        preserving the product distinction between reusable configuration and
        durable members.
      depends_on:
        - default-roster-channel-selection-is-exclusive-and-preflighted
        - owner-and-system-members-seeded
        - individual-agent-presets-are-versioned-local-state
        - durable-agent-runtime-configuration
        - named-acp-provider-selection-resolves-to-private-structured-launch
    - id: initial-roster-runtime-failures-are-member-local-and-actionable
      title: Initial roster runtime failures preserve every durable member snapshot
      statement: After the initial room/member transaction, the daemon must activate
        each seeded roster member separately in roster order with a fresh
        session and credential; success moves only that member to idle, while a
        thrown runtime spawn leaves only that member visible and dead, records
        one safe actionable system diagnostic, and continues activating later
        members without rolling back the room, deleting identities, or sharing
        runtime state, because an external harness failure after valid
        configuration is a member lifecycle event rather than a channel-create
        transaction failure.
      reason: A complete valid team must remain inspectable and recoverable even when
        one external runtime cannot initialize.
      depends_on:
        - default-roster-channel-members-are-detached-ordered-snapshots
        - agent-member-credentials-stay-secret
        - durable-agent-runtime-configuration
        - canonical-spawn-controls-enforced
  reviewed:
    - id: default-roster-is-one-versioned-ordered-preset-reference-group
      outcome: unchanged
      reason: Phase 3 reads the existing singleton and its exact ordinal order; it
        does not change roster identity, replacement, persistence, or bounds.
    - id: default-roster-references-block-preset-deletion
      outcome: unchanged
      reason: Reference integrity before creation remains unchanged; expansion
        additionally fails closed if persisted state is stale or malformed.
    - id: individual-agent-presets-are-bounded-catalog-validated-configurations
      outcome: unchanged
      reason: The same strict reusable fields and current daemon catalog authority are
        consumed without adding cwd, purpose, membership, or runtime fields to
        presets.
    - id: individual-agent-presets-are-versioned-local-state
      outcome: unchanged
      reason: Presets remain local CRUD records; channel creation copies values and
        stores no source id or live relationship.
    - id: channel-create-request-contract
      outcome: unchanged
      reason: The request remains additive and legacy-compatible; a separate
        assumption owns the new optional mutually exclusive roster literal.
    - id: channel-creation-derived-and-seeded
      outcome: unchanged
      reason: Server id derivation, collision suffixing, metadata, durable room, and
        system failure diagnostics remain the one creation path for legacy and
        roster initial members.
    - id: owner-and-system-members-seeded
      outcome: unchanged
      reason: Owner and system are still atomically seeded; the same transaction may
        now include already-preflighted concrete initial agents.
    - id: empty-database-desk-seeds-tutorial-atomically
      outcome: unchanged
      reason: The optional tutorial bootstrap remains in the same Store transaction
        and is not selected by normal or roster channel creation.
    - id: channel-starting-agent-handle-persisted
      outcome: unchanged
      reason: Legacy Starting agent still persists its requested default handle; the
        distinct roster group deliberately does not invent one.
    - id: default-recipient-fallback-chain
      outcome: unchanged
      reason: No routing rule changes; with no roster starting handle multiple live
        agents remain commentary and a sole live agent remains the fallback.
    - id: spawn-default-cwd-is-absolute-or-empty
      outcome: unchanged
      reason: Legacy Starting agent and Add agent cwd behavior remains; roster
        expansion applies the same normalization once for every concrete member.
    - id: new-agent-requests-require-available-native-or-detected-acp
      outcome: unchanged
      reason: Roster preflight reuses native/configurable/provider availability and
        performs no spawn before persistence is permitted.
    - id: canonical-spawn-controls-enforced
      outcome: unchanged
      reason: Every concrete initial member continues through the existing
        policy/thinking spawn validator before its adapter is invoked.
    - id: named-acp-provider-selection-resolves-to-private-structured-launch
      outcome: unchanged
      reason: Named ids resolve privately and custom launches remain bounded; members
        expose only safe provider identity and private Store runtime state
        retains the resolved launch.
    - id: durable-agent-runtime-configuration
      outcome: unchanged
      reason: Model, thinking, policy, cwd, and ACP launch stay durable member runtime
        configuration after snapshot activation and restart.
    - id: agent-member-credentials-stay-secret
      outcome: unchanged
      reason: Each successful seeded member receives a newly generated private
        credential through the existing session environment mechanism; failures
        expose none.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: POST /api/rooms keeps its owner-only manage_rooms boundary and no lower
        human role or agent gains configuration or creation authority.
    - id: agent-network-authority-is-narrow
      outcome: unchanged
      reason: Agent credentials remain unable to create rooms or read the global
        default roster.
    - id: browser-created-channel-delivers-its-room-key
      outcome: unchanged
      reason: A paired owner receives the key only after successful daemon room
        creation; failed preflight creates neither room nor key.
anchors:
  default-roster-channel-selection-is-exclusive-and-preflighted:
    default-roster-create-request-contract:
      action: change
      reason: Add the optional literal roster selector and its at-most-one rule with
        Starting agent.
    default-roster-create-request-regression:
      action: change
      reason: Prove selection, mutual exclusion, false rejection, empty/omitted
        compatibility, and unchanged legacy Starting agent parsing.
    default-roster-expansion-preflight:
      action: change
      reason: Resolve and validate the complete ordered current roster before any
        Store or adapter mutation.
    default-roster-expansion-regression:
      action: change
      reason: Prove valid native/named/custom expansion plus duplicate, owner,
        reserved, stale-reference, and catalog-invalid all-or-nothing failures.
    default-roster-create-rest-regression:
      action: change
      reason: Exercise owner/browser success, lower-principal refusal, legacy
        requests, invalid selection, safe response projection, and no-room
        failure.
  default-roster-channel-members-are-detached-ordered-snapshots:
    default-roster-room-seed:
      action: change
      reason: Atomically insert all preflighted concrete initial members with
        owner/system and retain their ordered result for activation.
    default-roster-room-seed-regression:
      action: change
      reason: Prove ordered fresh ids/private runtime values and total Store rollback
        when any initial member seed is invalid.
    default-roster-snapshot-regression:
      action: change
      reason: Prove concrete field mapping, no source references or roster starting
        handle, and detachment from later preset/roster edits.
  initial-roster-runtime-failures-are-member-local-and-actionable:
    initial-agent-runtime-activation:
      action: change
      reason: Activate each already-seeded initial member once, issue isolated runtime
        authority, and settle success/failure per member in order.
    initial-agent-runtime-failure-regression:
      action: change
      reason: Prove one thrown spawn leaves a dead visible member and diagnostic while
        successful peers and later activation remain intact and isolated.
  channel-create-request-contract:
    channel-create-request-schema:
      action: change
      reason: Mechanical additive nesting of the roster selector in the existing
        create request contract.
  channel-creation-derived-and-seeded:
    derived-channel-creation:
      action: change
      reason: Generalize the one creation path from zero/one Starting agent to
        zero/one Starting agent or the expanded roster without changing id or
        metadata derivation.
  starting-agent-name-derives-one-valid-identity-v6:
    starting-agent-create-validation:
      action: change
      reason: Keep legacy owner collision and identity validation inside the
        generalized complete initial-member preflight.
  new-agent-requests-require-available-native-or-detected-acp:
    new-agent-provider-availability-preflight:
      action: change
      reason: Apply the existing no-persistence availability boundary to every
        expanded roster entry without using adapter.spawn as a probe.
  spawn-default-cwd-is-absolute-or-empty:
    implicit-starting-agent-cwd:
      action: change
      reason: Resolve one implicit absolute channel cwd when either kind of
        initial-agent selection needs it.
  channel-starting-agent-handle-persisted:
    starting-agent-creation-record:
      action: change
      reason: Preserve the field only for legacy Starting agent and omit it for the
        separate roster group.
    starting-agent-config-regression:
      action: change
      reason: Update the existing genuine runtime-failure assertion to retain a dead
        visible seeded Starting agent under the shared lifecycle.
  owner-and-system-members-seeded:
    room-seeding:
      action: change
      reason: Extend the atomic room seed with prevalidated initial agents while
        preserving owner/system creation.
  empty-database-desk-seeds-tutorial-atomically:
    bootstrap-welcome-transaction:
      action: change
      reason: "Mechanical nesting: initial agents join the same Store transaction that
        already optionally owns tutorial bootstrap; tutorial semantics stay
        unchanged."
files:
  - packages/protocol/src/room.ts
  - packages/protocol/src/schemas.spec.ts
  - packages/switchboard/src/store.ts
  - packages/switchboard/src/store.spec.ts
  - packages/switchboard/src/daemon.ts
  - packages/switchboard/src/daemon.spec.ts
  - packages/switchboard/src/agent-presets.spec.ts
  - packages/web-next/src/runtime/api.spec.ts
verification: Run pnpm --filter @codor/protocol test; pnpm --filter
  @codor/switchboard exec vitest run src/agent-presets.spec.ts src/store.spec.ts
  src/daemon.spec.ts src/server.spec.ts; pnpm --filter @codor/web-next exec
  vitest run src/runtime/api.spec.ts; pnpm --filter @codor/protocol build; pnpm
  --filter @codor/switchboard build; pnpm --filter @codor/web-next build; harn
  find --plan agent-presets-p3-default-roster-create; harn plan check
  agent-presets-p3-default-roster-create; harn check
  agent-presets-p3-default-roster-create; and the staged Harn check/apply gate
  before one implementation commit. Do not run Playwright or change Add agent,
  Create Channel UI, Settings, preset/roster CRUD, CLI, relay records, cloud,
  account synchronization, or Phase 4/5 behavior.
