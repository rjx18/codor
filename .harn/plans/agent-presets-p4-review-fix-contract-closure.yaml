id: agent-presets-p4-review-fix-contract-closure
title: Phase 4 review closure - correlate update responses and make explicit
  roster reload authoritative without browser fieldset chrome
notes: >-
  This is a second, smaller review-fix for Phase 4, based on clean commit
  1175b15f55e2ac6cd8d7a36ea6c6838c499556ec. Independent review verified the
  first review-fix's exact parent/scope/applied Harn log, web 451/451 tests, web
  build, and room38 13/13 browser suite. Its fresh reads, response schemas,
  pending guards, custom argv preservation, selected-roster recovery, visible
  roster preflight errors, focus, and admin evidence are otherwise correct.
  Three narrow closure defects remain. Correct only these defects; do not reopen
  or expand Phase 4 and do not begin Phase 5.

  updateAgentPreset currently parses AgentPresetSchema but, unlike
  fetchAgentPreset, does not assert that a schema-valid response id equals the
  addressed URL id. AgentPresetSettings adds a local check, so this particular
  consumer remains open and retryable, but the transport-neutral runtime
  contract can still report a different preset to any other caller. Correlate
  the parsed update response inside updateAgentPreset itself with the
  established `did not match requested preset` diagnostic. Add native and
  active-relay unit regressions using a fully schema-valid mismatched response;
  retain the UI guard as harmless defense in depth or remove only exact
  redundancy if its focused behavior remains covered. Do not change routes,
  methods, request bodies, bearer/origin handling, schemas, or non-2xx errors.

  DefaultRosterEditor now tracks the last roster by serialized value to avoid
  resetting a dirty draft when `saving` toggles. That also defeats an explicit
  Reload whenever the server returns the same id/version/timestamp/order as the
  last read: React receives a fresh authoritative object, but the serialized
  guard discards it, leaving unsaved local additions/removals/order visible even
  though Reload promised to replace them. Make an explicit successful parent
  roster response reset the draft even when its values and timestamp are
  unchanged, while a failed save with no new roster response still preserves the
  dirty draft. Prefer response/object or explicit refresh-generation semantics
  rather than value equality. Keep writes frozen while pending, reconcile a
  successful save, and retain missing-reference/error behavior.

  The pending-state fix also introduced bare fieldsets around the preset editor
  and roster draft without resetting the browser's default fieldset border,
  padding, margin, and min-inline-size. Chromium therefore paints extra native
  chrome and spacing inside the established soft-editorial cards/dialog even
  though the overflow test happens to pass. Give both fieldsets scoped classes
  and reset only their structural browser defaults in room.css while retaining
  native disabled semantics. A rendered regression must inspect the relevant
  computed border/padding/margin/min-inline-size at 390px in addition to the
  existing overflow and action visibility checks.

  No protocol, Store, daemon, server, authorization, catalog, Add agent,
  first-channel source, room/member lifecycle, persistence, harness fixture,
  relay/cloud state, CLI, or other style work is permitted. The existing active
  hosted and five-spec browser matrix must remain green.
assumptions:
  reviewed:
    - id: agent-preset-management-is-authorized-and-transport-neutral
      outcome: unchanged
      reason: Update success correlation closes the same strict runtime boundary
        without changing REST transport, bearer handling, or authorization.
    - id: settings-manages-individual-agent-presets-through-canonical-controls
      outcome: unchanged
      reason: Preset CRUD and pending-draft behavior remain correct; the disabled
        fieldset keeps its semantics without unintended browser-native chrome.
    - id: settings-manages-one-separate-ordered-default-roster
      outcome: unchanged
      reason: Explicit Reload once again replaces a dirty draft from every successful
        authoritative response, while failed writes continue to preserve it.
    - id: controls-fit-the-surface-they-sit-on
      outcome: unchanged
      reason: Resetting fieldset min-inline-size and spacing preserves the established
        390px card/dialog bounds and is verified from rendered computed styles.
    - id: web-theme-accessible-modes
      outcome: unchanged
      reason: Removing user-agent fieldset chrome restores semantic product tokens;
        disabled controls, focus, contrast, and axe behavior otherwise stay
        unchanged.
anchors:
  agent-preset-management-is-authorized-and-transport-neutral:
    agent-preset-rest-boundary:
      action: change
      reason: Correlate the strict update response id with its addressed preset in
        native and active relay modes.
  settings-manages-one-separate-ordered-default-roster:
    settings-default-roster-management-surface:
      action: change
      reason: Replace serialized-value suppression with semantics that distinguish a
        successful authoritative reload from a local saving-state transition.
    settings-default-roster-management-regression:
      action: change
      reason: Prove Reload discards a dirty local draft even when the server roster
        object is value-identical to the prior authoritative read, while failed
        save still preserves it.
  settings-manages-individual-agent-presets-through-canonical-controls:
    settings-agent-preset-management-surface:
      action: change
      reason: Scope the pending fieldset for a browser-default style reset without
        changing its disabled transaction semantics.
    settings-agent-preset-management-regression:
      action: change
      reason: Measure reset fieldset chrome together with the existing 390px editor
        geometry.
