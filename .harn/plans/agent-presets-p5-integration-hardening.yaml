id: agent-presets-p5-integration-hardening
title: Phase 5 - prove restart, runtime, credential, and hosted-computer isolation
notes: >-
  This is only Phase 5 of .codor/PHASED-PLAN.md, based on clean commit
  e68c81dd981214cb90a08df5ec2362436ec0fe5d after Phase 4 and both bounded
  review-fixes passed independent review. Current source inspection shows no
  production change to authorize: versioned preset/default-roster rows already
  reopen from the switchboard SQLite database; Add agent submits one detached
  ordinary spawn; roster creation seeds detached members and activates each with
  its own session and credential; lazy restart reconstruction uses the durable
  member/runtime rows; and every web management/create call already uses the
  active relay transport or unchanged native fetch. Phase 5 adds integration
  evidence only. If any required regression exposes a production defect, stop
  and tag Sol with the exact failure; do not modify production code under this
  plan.

  Extend the focused switchboard preset regression with one isolated on-disk
  daemon lifecycle using two valid native presets. Consume the same source
  configurations by spawning each preset through the ordinary concrete path used
  by Add agent and through two separate default-roster channel creations. Before
  restart, prove every resulting agent has a fresh member id, a distinct Session
  object, a distinct established native session_ref, and a distinct raw member
  credential whose environment and authentication resolve to exactly its own
  room/member. Drive ordinary addressed turns so session references and
  per-member task/run state are real daemon results rather than test-written
  member rows; prove each room sees only its own messages, tasks, usage/runtime
  state, and credentials. Never log, persist, snapshot, or expose a raw token in
  a public projection.

  Edit both source presets and replace the default roster only after all three
  creation journeys have completed. Existing Add-agent and roster-created
  members must retain every configured display name, handle, harness, policy,
  model/thinking/provider field, private runtime configuration, roster order,
  native session references, and task/run state. Close the daemon and reopen the
  same database with a fresh adapter. Prove the edited preset rows and current
  roster order survived independently, while every previously created member
  remains the old snapshot. Address every restored agent through normal daemon
  routing: each lazy reconstruction must attach only its own prior native
  session reference, create a distinct new in-memory Session, rotate to a fresh
  pairwise-distinct room/member-bound credential, invalidate the corresponding
  old credential, and leave every peer's durable/runtime state unchanged. After
  restart, removing the roster references and deleting the source presets must
  still leave all concrete members intact. Do not add a preset id, roster id, or
  shared runtime registry to members.

  Extend the existing isolated browser harness only with an on-demand Phase 5
  fixture/control seam that creates deliberately disjoint native preset lists
  and ordered default rosters on computer A and computer B. The two switchboards
  keep separate databases, vaults, room keys, adapter catalogs, servers, relay
  sessions, and owner credentials. The fixture may return safe ids, labels,
  handles, roster order, and room/member summaries for assertions, but never a
  bearer, member token, credential hash, private launch, room key, or direct
  mutable Store handle. It must not seed cloud/account/relay records or change
  production authorization. Keep the existing harness behavior unchanged until
  the explicit Phase 5 control action is invoked, so unrelated browser specs do
  not inherit a default roster.

  Add one focused Playwright file. Its direct journey must use the
  switchboard-served SPA with the existing owner bearer, show only computer A's
  presets/ordered roster in Settings, show only A's saved presets beside the
  existing Add-agent shortcuts, create one ordinary Add-agent member from an A
  preset, and create one roster channel containing only A's configured members;
  the hosted computer switcher must remain absent and native behavior must not
  depend on pairing or relay state. Its hosted journey must pair A and B through
  the existing browser ceremony, keep both live, and prove that Settings, Add
  agent, the roster summary, roster-channel creation, room/member results, and
  subsequent reads follow only the active computer. Computer B must never show
  or create from A's presets and vice versa, switching must reveal the other
  switchboard's unchanged truth without a page reload or a direct /api escape,
  and mutations/channel creation on one host must not appear on the other.
  Inspect safe fixture summaries after the UI journeys to prove the negative
  store boundary as well as the visible one. No product UI, runtime helper,
  connector, protocol, Store, daemon, server, authorization, adapter, relay, or
  CLI source may change.

  This phase must finish with release-proportionate verification: the focused
  switchboard integration, all web unit tests and web production/PWA build, the
  new browser file plus the affected multi-computer/Add-agent/Settings browser
  files in isolated harnesses, then the complete workspace test and build
  commands. Generated workspace dependency links may be temporarily pointed at
  this worktree for verification only and must be restored byte-for-byte before
  staging. One failing production assertion is a stop condition for this
  tests-only plan, not permission to repair it.
assumptions:
  create:
    - id: preset-derived-members-are-isolated-durable-snapshots
      title: Preset-derived members remain isolated durable snapshots across restart
      statement: Reusing the same individual presets through ordinary Add agent and
        repeated default-roster channel creation must produce fresh member ids,
        in-memory Sessions, native session references, room/member-bound
        credentials, and member-scoped runtime state for every concrete agent;
        later preset edits, roster replacement, source deletion, and switchboard
        restart must preserve each member's copied configuration, private
        runtime data, established native reference, tasks, runs, and room
        isolation, while lazy reconstruction resumes only that member's
        reference in a new Session and rotates its credential, because reusable
        configuration is never shared membership, authority, or runtime
        identity.
      reason: Phase 5 joins the already-correct Add-agent, roster, persistence, and
        restart paths and makes their cross-entry isolation a release-level
        invariant.
      depends_on:
        - individual-agent-preset-selection-snapshots-one-ordinary-spawn
        - default-roster-channel-members-are-detached-ordered-snapshots
        - initial-roster-runtime-failures-are-member-local-and-actionable
        - individual-agent-presets-are-versioned-local-state
        - default-roster-is-one-versioned-ordered-preset-reference-group
        - durable-agent-runtime-configuration
        - agent-member-credentials-stay-secret
    - id: hosted-preset-state-follows-only-the-active-computer
      title: Hosted preset and roster state follows only the active computer
      statement: In a hosted tab with several live paired computers, every preset
        list/detail/mutation, default-roster read/replacement, Add-agent
        selection, and roster-channel creation must traverse only the active
        computer's bearer, tunnel, adapter catalog, and local switchboard
        database, so switching computers reveals that host's independent
        configuration and created members without copying, merging, caching, or
        leaking another host's presets or roster; a switchboard-served direct
        tab must retain the same native behavior with no computer switcher or
        relay dependency, because presets and the one default roster are
        machine-local configuration rather than hosted account or relay state.
      reason: Phase 5 makes the roadmap's local-only multi-computer boundary explicit
        and proves both the active hosted path and unchanged direct path end to
        end.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
        - hosted-app-keeps-all-paired-computers-live
        - agent-preset-management-is-authorized-and-transport-neutral
        - individual-agent-preset-selection-snapshots-one-ordinary-spawn
        - settings-manages-individual-agent-presets-through-canonical-controls
        - settings-manages-one-separate-ordered-default-roster
        - create-channel-roster-choice-preserves-starting-agent-draft
  reviewed:
    - id: individual-agent-presets-are-versioned-local-state
      outcome: unchanged
      reason: The integration reopens the same local SQLite database and adds no
        changelog, relay, account, cloud, member, or runtime copy of preset
        rows.
    - id: default-roster-is-one-versioned-ordered-preset-reference-group
      outcome: unchanged
      reason: Restart evidence reads the existing singleton id and exact persisted
        order; no second group, denormalized configuration, or alternate
        ordering store is added.
    - id: individual-agent-preset-selection-snapshots-one-ordinary-spawn
      outcome: unchanged
      reason: The test consumes a freshly read preset as concrete values through the
        existing ordinary spawn path and browser Add-agent act, with no new
        creation lifecycle or stored source reference.
    - id: default-roster-channel-members-are-detached-ordered-snapshots
      outcome: unchanged
      reason: Two channels expand the same current roster independently and retain
        concrete old values after source edit, deletion, and restart.
    - id: initial-roster-runtime-failures-are-member-local-and-actionable
      outcome: unchanged
      reason: No activation behavior changes; successful repeated activations gain
        cross-room session and credential isolation evidence.
    - id: durable-agent-runtime-configuration
      outcome: unchanged
      reason: Existing member/runtime rows rebuild their own model, thinking, policy,
        cwd, native reference, and private launch data without a preset lookup.
    - id: agent-member-credentials-stay-secret
      outcome: unchanged
      reason: Tests retain raw tokens only in local Session variables, verify exact
        room/member binding and restart rotation, and never expose them through
        public projections or fixture responses.
    - id: agent-preset-management-is-authorized-and-transport-neutral
      outcome: unchanged
      reason: Browser evidence uses the existing owner bearer and relayFetch/native
        split; no route, capability, principal, WebSocket act, CLI, or sync
        record is added.
    - id: settings-manages-individual-agent-presets-through-canonical-controls
      outcome: unchanged
      reason: Settings remains the existing management surface; the focused journey
        proves its list and mutation truth changes with the active switchboard
        only.
    - id: settings-manages-one-separate-ordered-default-roster
      outcome: unchanged
      reason: Each switchboard keeps its own singleton ordered references and the
        browser never combines or client-persists their drafts.
    - id: create-channel-roster-choice-preserves-starting-agent-draft
      outcome: unchanged
      reason: The existing group choice sends default_roster true to the active host;
        this phase changes neither the hidden Starting-agent draft nor request
        shape.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: The existing per-computer token, tunnel, connector, archive namespace,
        and store boundary gains preset/roster and created-member evidence.
    - id: hosted-app-keeps-all-paired-computers-live
      outcome: unchanged
      reason: Both switchboards remain concurrently paired through their existing warm
        sessions; the phase adds no connection or switching implementation.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: The fixture uses existing owners and the server remains authoritative;
        no role rank, manage_agents, or manage_rooms capability changes.
    - id: individual-agent-presets-are-bounded-catalog-validated-configurations
      outcome: unchanged
      reason: Fixture presets contain only strict reusable native fields and are
        created through each daemon's existing live catalog validator.
anchors:
  preset-derived-members-are-isolated-durable-snapshots:
    preset-derived-runtime-isolation-regression:
      action: change
      reason: Add the on-disk Add-agent plus two-roster-channel lifecycle that proves
        detached fields, sessions, native refs, credentials, runtime state,
        source mutation, reopen, lazy reconstruction, rotation, and deletion
        isolation.
  hosted-preset-state-follows-only-the-active-computer:
    hosted-preset-active-computer-regression:
      action: change
      reason: Add the on-demand disjoint two-switchboard fixture and direct/hosted
        browser journey proving active-host-only Settings, Add agent, roster
        creation, safe store results, and unchanged direct mode.
files:
  - packages/switchboard/src/agent-presets.spec.ts
  - packages/web-next/tests/harness.mjs
  - packages/web-next/tests/room39-agent-preset-hardening.e2e.spec.ts
verification: Run pnpm --filter @codor/switchboard exec vitest run
  src/agent-presets.spec.ts; pnpm --filter @codor/web-next test; pnpm --filter
  @codor/web-next build; and pnpm --filter @codor/web-next exec playwright test
  tests/room39-agent-preset-hardening.e2e.spec.ts, then independently run
  tests/room34-multi-computer.e2e.spec.ts,
  tests/room37-agent-presets.e2e.spec.ts, and
  tests/room38-agent-preset-settings.e2e.spec.ts with a fresh isolated harness
  and non-overlapping API/API-B/control/SPA ports for every invocation. Then run
  pnpm test and pnpm build from the workspace root. All commands must resolve
  this worktree's built protocol, switchboard, adapter-acp, tunnel, and web
  packages; restore every generated dependency link to its exact prior target
  afterward. Run git diff --check; harn find --plan
  agent-presets-p5-integration-hardening; harn plan check
  agent-presets-p5-integration-hardening; harn check
  agent-presets-p5-integration-hardening; and the explicit plan-id staged Harn
  check/apply gate before exactly one tests-and-fixture-only implementation
  commit. Because packages/web-next is ignored by Harn's repository-wide
  classifier, if the shared no-id pre-commit hook misclassifies the applied
  mixed test plan after the explicit plan-id staged gate passed, bypass only
  that incompatible hook invocation. Do not modify .harnignore. Do not change
  protocol, Store, daemon, server, authorization, adapters, runtime helpers,
  product UI/styles, relay/cloud/account state, CLI, package scripts, or any
  file outside this plan; stop and tag Sol if a required production behavior
  fails.
