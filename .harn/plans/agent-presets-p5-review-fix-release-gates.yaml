verification: Run pnpm --filter @codor/adapter-acp exec vitest run
  src/adapter.spec.ts at least twice; pnpm --filter @codor/web-next exec
  playwright test tests/room39-agent-preset-hardening.e2e.spec.ts with a fresh
  isolated harness and non-overlapping API/API-B/control/SPA ports; pnpm test;
  and pnpm build from the workspace root. The exact root test and build must
  resolve this worktree's built workspace packages and pass; temporarily pinning
  generated dependency links for the command duration is permitted, but every
  original target must be restored before staging. Run git diff --check; harn
  find --plan agent-presets-p5-review-fix-release-gates; harn plan check
  agent-presets-p5-review-fix-release-gates; harn check
  agent-presets-p5-review-fix-release-gates; and the explicit plan-id staged
  Harn check/apply gate before exactly one tests-only commit. Because the web
  file is ignored by Harn's repository-wide classifier, if the shared no-id hook
  misclassifies the already-applied mixed test plan after the explicit plan-id
  staged gate passed, bypass only that incompatible hook invocation. Do not
  modify .harnignore, the ACP fake agent, production adapter/web code, harness,
  protocol, Store, daemon, server, authorization, relay/cloud/account state,
  CLI, package scripts, or any file outside this plan.
