id: cached-offline-local-send-admission
title: Known cached rooms admit local intent without inventing readiness
notes: Correction only from 033535e3. Existing stable composition owner and
  32-record never-sent buffer; source store eligibility is page-memory only, not
  cached authorization/readiness. Terminal parks withdraw eligibility. Cached
  post still refuses; live drain still requires exact room readiness and both
  capabilities. No backend, persistent outbox, retry loop, cache schema, P2
  skeleton behavior or shared hook changes. Reproduce cached reload red, then
  waiting row/input/zero-wire/readiness/grace, handover same ID, B isolation,
  unknown/capability/terminal exclusions. Full web units and build before
  isolated Rooms 36/49/34/33. Ordinary Harn hook; stop on blocker.
assumptions:
  retire:
    - id: readable-reconnecting-room-never-admits-mutation-with-grace
      reason: Replace the cold-local-admission exclusion and relink active dependency
        closure.
    - id: floating-room-loading-pill-uses-existing-priority-with-grace
