anchors:
  management-frames-correlate-one-result:
    management-correlation-protocol:
      action: change
      reason: Add bounded optional refs to legacy list/act and result/error frames,
        plus one correlated create-room request.
    management-correlation-server:
      action: change
      reason: Echo the exact request ref on authoritative projected success or failure
        for both network and local listeners.
    management-correlation-client:
      action: change
      reason: Generate one ref, ignore unrelated frames/errors, and accept only the
        matching result or failure.
    management-correlation-protocol-regression:
      action: change
      reason: Prove additive old-frame parsing and bounded correlated management
        shapes.
    management-correlation-server-regression:
      action: change
      reason: Prove correlated success, synchronous/async refusal, and unrelated live
        room events on authenticated sockets.
    management-correlation-cli-regression:
      action: change
      reason: Feed unrelated results and differently referenced errors before the
        matching success/error and prove exact completion.
  channel-archive-is-durable-soft-state:
    channel-archive-protocol:
      action: change
      reason: Add optional archive timestamp room metadata and rename/archive acts
        without a delete or restore act.
    channel-archive-storage:
      action: change
      reason: Persist rename/archive transactionally in room state with one changelog
        append and no row or file deletion.
    channel-archive-daemon:
      action: change
      reason: Expose authoritative daemon transitions and projected room fanout while
        leaving agent lifecycle untouched.
    channel-archive-server:
      action: change
      reason: Filter archived rooms from default discovery, include them explicitly,
        and dispatch owner-authorized rename/archive.
    channel-archive-protocol-regression:
      action: change
      reason: Pin archive metadata and the absence of hard-delete management shapes.
    channel-archive-store-regression:
      action: change
      reason: Prove persistence across reopen, one seq per transition, preserved room
        data, and repeat/rename refusal after archive.
    channel-archive-server-regression:
      action: change
      reason: Prove active/default versus all listing, showability, authorization, and
        no destructive side effects through the real server.
  structured-channel-cli-preserves-flat-listing:
    structured-channel-command-surface:
      action: change
      reason: Register exactly the five Phase 1 subcommands and their bounded options,
        with no agent, preset, roster, worktree, delete, or restore command.
    structured-channel-rendering:
      action: change
      reason: Render stable active/archive projections and reuse the authenticated
        correlated client rather than importing Store or SQLite.
    structured-channel-cli-regression:
      action: change
      reason: Exercise all five commands locally and over explicit URL/token while
        proving the flat channels output and unrelated commands remain
        compatible.
    structured-channel-packed-smoke:
      action: change
      reason: Exercise the installed family and legacy listing against the packaged
        daemon without expanding to the later full workflow phase.
  management-output-is-json-pure-and-safe:
    management-safe-output:
      action: change
      reason: Centralize fixed human ordering and one-value JSON projection limited to
        safe channel fields.
    management-output-regression:
      action: change
      reason: Capture stdout and stderr separately and prove parseable single-value
        JSON, deterministic text, and absence of token/private field names and
        values.
  management-failures-have-stable-redacted-exits:
    management-error-contract:
      action: change
      reason: Define typed management failure classes, stable exit codes, and shared
        argv/environment/bearer redaction without reclassifying legacy errors.
    source-cli-failure-entrypoint:
      action: change
      reason: Print the shared safe message and propagate a typed code from the source
        binary.
    public-cli-failure-entrypoint:
      action: change
      reason: Make the generated installed wrapper use the same safe formatter and
        typed code.
    management-error-regression:
      action: change
      reason: Prove each exit class, empty stdout, one-line stderr, token-bearing URL
        redaction, and uncategorized legacy exit 1.
    public-cli-failure-regression:
      action: change
      reason: Pin generated-wrapper imports, dynamic exit propagation, concise
        diagnostics, and no raw secrets.
    packed-management-failure-regression:
      action: change
      reason: Run a missing-channel failure through the installed binary and assert
        its exact status, stderr-only output, and stack/secret absence.
  channel-archive-requires-explicit-confirmation:
    management-confirmation-helper:
      action: change
      reason: Share injectable TTY prompting, strict affirmative parsing, unattended
        refusal, and yes bypass with all prompt text directed to stderr.
    channel-archive-command-confirmation:
      action: change
      reason: Gate the sole Phase 1 destructive command before sending any act and
        force yes in JSON mode.
    channel-archive-confirmation-regression:
      action: change
      reason: Prove interactive accept/decline, non-TTY and JSON refusal, --yes,
        prompt placement, and zero mutation when consent is absent.
  brakes-default-off:
    room-config-brakes:
      action: change
      reason: Add optional archive metadata without altering any existing config
        default or brake semantics.
  list-rooms-reply-carries-per-room-seq:
    rooms-reply-seq-schema:
      action: change
      reason: Carry an optional correlation ref while retaining the exact included
        room seq map.
    rooms-reply-seq-populate:
      action: change
      reason: Populate seq values for the active or explicitly all room selection and
        echo the request ref.
  roles-gate-human-acts-not-agents:
    role-matrix-source:
      action: change
      reason: Account for owner-only rename_room and archive_room acts while list/show
        remain read capabilities.
    role-matrix-integration:
      action: change
      reason: Keep exhaustive act accounting and prove owner/admin/member/observer
        outcomes for the new operations.
  agent-network-authority-is-narrow:
    agent-room-authorization:
      action: change
      reason: Apply the existing room-scoped visibility to correlated listing while
        rejecting create and both channel-management acts.
    agent-authz-regression:
      action: change
      reason: Prove a valid agent credential cannot create, rename, archive, or list
        another channel through the new frames.
  unix-socket-same-protocol:
    unix-websocket-listener:
      action: change
      reason: Dispatch the additive correlated frames once for both authenticated
        network and protected local transports.
  human-facing-surfaces-call-rooms-channels:
    cli-channel-terminology:
      action: change
      reason: Add the singular structured channel family without exposing protocol
        room terminology.
    cli-channel-regression:
      action: change
      reason: Update exhaustive command registration and assert no room-named CLI
        option or command appears.
  public-cli-delegation-reports-concise-failures:
    public-wrapper-delegation:
      action: change
      reason: Retain exported runCli delegation while sharing redacted formatting and
        propagating typed management exits.
  source-cli-installers-remain-idempotent-fallback:
    per-user-cli-install-script:
      action: change
      reason: Change only the built source entrypoint's rejection handling; installer
        and shim contracts remain unchanged.
  packed-release-proof-runs-install-runtime:
    packed-install-script:
      action: change
      reason: Add a bounded installed channel-family and failure-code smoke inside the
        existing clean packed runtime proof.
verification: Run `pnpm --filter @codor/protocol test`, `pnpm --filter
  @codor/switchboard test`, `pnpm --filter @codor/cli test`, `pnpm --filter
  '@codor/cli...' build`, `pnpm build`, and `scripts/packed-install-test.sh`.
  The focused suites must cover protected local socket and explicit URL/token
  transports; owner, admin, member, observer, and agent authorization; additive
  legacy frame parsing; exact success/error ref correlation after unrelated
  events; deterministic human output; one-value JSON stdout with empty stderr;
  bearer, URL-token, ACP launch, and session-ref absence; all archive
  confirmation modes; persisted archive/rename changelog state without deletion;
  exact legacy `channels` output and flat command registration; source and
  packaged exit propagation; and installed artifact execution. Before the one
  implementation commit run `harn find --plan cli-management-phase1-channels`,
  `harn check cli-management-phase1-channels`, stage only the declared files and
  generated Harn state, and let the pre-commit hook run staged
  check/apply/staged check.
