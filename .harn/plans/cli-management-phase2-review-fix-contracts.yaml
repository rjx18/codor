id: cli-management-phase2-review-fix-contracts
title: Correct Phase 2 pause, refusal exits, and Harn anchor coverage
notes: >-
  This is the bounded review fix for applied Phase 2 plan
  cli-management-phase2-agent-lifecycle at commit
  cdad5db82946ee60602cebe1888874cd03a8975b. Independent review confirmed the
  one-commit boundary, correlation and authorization paths, safe projection,
  command compatibility, package suites, builds, and packed runtime, but found
  three Phase 2 contract defects.

  First, pause currently accepts an idle or queued member even while an
  interactive attach lease is active or being acquired. That can relabel a
  native session which another process still controls as paused, and attach
  completion can then overwrite the pause. Refuse pause before any state write
  when the member has a durable attach lease or a pending attach acquisition.
  Keep pause a queue hold: do not interrupt a turn or terminal, do not alter the
  attach lifecycle, and preserve the approved idle, queued, and unreachable
  transitions when no attach is active. Keep structured revive and every flat
  lifecycle command unchanged.

  Second, the shared management error classifier does not recognize two existing
  state/custody refusals used by structured commands: configuring a mirrored
  member and reviving a dead member without a resumable session or adapter
  capability. These currently fall through to transport/protocol exit 7.
  Classify those bounded messages as conflict/refusal exit 6. Preserve exit 2
  for malformed or unsupported configuration, 3 authentication, 4 authorization,
  5 missing channel/agent, and 7 genuine transport/protocol failure. Continue
  emitting empty stdout and one stack-free redacted stderr line without
  credentials, bearer values, token-bearing URLs, private ACP launch material,
  host identity, or native session references.

  Third, the Phase 2 commit left the three new daemon regression anchors
  unclosed and closed the nested CLI command anchors out of LIFO order. Harn
  therefore does not associate the daemon lifecycle regression with
  agent-add-selects-one-public-adapter, agent-pause-refuses-active-turn, or
  agent-management-does-not-invent-work, and does not associate the `agent`
  implementation with structured-agent-cli-preserves-flat-lifecycle. Repair only
  those marker boundaries, preserving code ownership and behavior, and prove
  with `harn find` that all intended refs resolve to the exact test and command
  regions.

  Add focused regression coverage for active attach refusal without mutation,
  mirrored configure and non-resumable revive exit 6, admin correlated mutation
  success, and the structured agent family through explicit URL/token. Preserve
  local socket behavior, the remote local-credential boundary, JSON purity,
  secret redaction, and every flat command. Do not implement presets, default
  roster, worktrees, qualified posting, new agent operations, custom ACP input,
  hard deletion, SQLite access, cloud/account/relay/token work, or any Phase 3
  behavior. Implement this locked review fix in exactly one commit.
