  refusal, focused switchboard server tests for correlated owner/admin success
  and member/observer/agent denial, focused CLI tests for mirrored configure and
  non-resumable revive exit 6, explicit URL/token agent listing, command
  registration, output safety, and flat lifecycle compatibility; then run `pnpm
  --filter @codor/switchboard test`, `pnpm --filter @codor/cli test`, `pnpm
  --filter '@codor/cli...' build`, `pnpm build`, and
