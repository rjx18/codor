        queued, or unreachable transitions.
    - id: attach-custody-lease-tracks-child-pid
      outcome: unchanged
      reason: Pause observes the existing pending/durable attach boundary but does not
        alter lease acquisition, process identity, heartbeat, or completion
        semantics.
    - id: management-failures-have-stable-redacted-exits
      outcome: unchanged
      reason: Existing custody and resumability refusals are normalized to the
        already-approved conflict exit while the shared formatter and redaction
        boundary remain unchanged.
    - id: member-config-is-changed-not-respawned
      outcome: unchanged
      reason: Mirrored configuration remains refused by the daemon; only its
        structured CLI exit classification gains the correct conflict class.
    - id: copilot-vscode-revive-requires-exact-live-cache
      outcome: unchanged
      reason: Non-resumable and missing-session revive paths continue failing closed;
        only their structured CLI exit classification is corrected.
    - id: structured-agent-cli-preserves-flat-lifecycle
      outcome: unchanged
      reason: Repair the command-region anchor and add remote transport proof without
        changing the seven structured commands or any flat command.
    - id: agent-add-selects-one-public-adapter
      outcome: unchanged
      reason: Close the intended daemon regression anchor around the existing
        canonical selector proof without changing adapter resolution.
    - id: agent-management-does-not-invent-work
      outcome: unchanged
      reason: Close the intended daemon regression anchor around the existing
        no-delivery/no-run proof without changing lifecycle behavior.
    - id: human-facing-surfaces-call-rooms-channels
      outcome: unchanged
      reason: Correct nested marker order around the existing channel-scoped agent
        command family without changing user terminology.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: Add an explicit admin correlated mutation success assertion while
        retaining member, observer, and agent denial behavior.
    - id: agent-management-correlates-safe-member-results
      outcome: unchanged
      reason: Explicit URL/token coverage continues to consume exactly one matching
        safe result through the same shared management client.
    - id: member-env-selects-narrow-cli-identity
      outcome: unchanged
      reason: The focused remote proof supplies its token explicitly and does not
        change local socket or credential selection.
  retire: []
