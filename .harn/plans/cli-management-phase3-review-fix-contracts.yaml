id: cli-management-phase3-review-fix-contracts
title: Correct Phase 3 safe projection, prompt, exit, and verification contracts
notes: >-
  This is the bounded review fix for applied Phase 3 commit
  de642a25073b1a2efd6bcb5a78fe74796b5e9a40. Independent review confirmed the
  exact one-commit boundary, clean applied Harn state, additive protocol and
  command families, local/URL transports, daemon-side detached preset spawn,
  REST/browser compatibility, package suites, and dependency build. It found
  three runtime contract defects plus incomplete focused evidence/anchor
  ownership from the locked plan. Fix only those issues; do not rewrite or
  expand the applied plan.

  First, AgentPresetPublicSchema currently bounds the public `adapter` selector
  with AGENT_PRESET_MAX_HARNESS_LENGTH (64). AcpProviderIdSchema validly accepts
  a 64-character provider id, whose public selector is four characters longer
  after the `acp:` prefix, so a valid named-ACP preset can be stored but its
  launch-free CLI result frame is rejected. Bound the public selector for every
  valid harness/provider spelling (without relaxing the stored harness or
  provider schemas), and add boundary tests for a maximum named provider plus
  rejection beyond the real selector bound. Continue returning only the safe
  provider id; no executable or argv field/value may appear.

  Second, `agent-preset delete` interpolates the preset label directly into its
  stderr confirmation. Preset labels may contain tabs, newlines, escapes,
  backslashes, and other control characters, so an authorized stored label can
  create multiple prompt lines or terminal control sequences. Escape the label
  through the same printable human-cell encoding used by preset output before
  constructing the prompt. Keep the exact stable id visible, keep ordinary safe
  labels byte-compatible, emit one stderr prompt line, and retain TTY,
  JSON/unattended --yes, decline, reference conflict, and zero-mutation
  behavior. Do not reject or rewrite stored labels.

  Third, the shared classifier maps the daemon's stale catalog message `model
  '<id>' is not currently offered by harness '<id>'` to transport exit 7.
  Classify this bounded catalog refusal as conflict exit 6, while retaining exit
  2 for malformed schema/options and unsupported thinking, 3 auth, 4
  authorization, 5 missing targets, and 7 genuine transport/protocol failures.
  Preserve one redacted stack-free stderr line, empty stdout, and private
  executable/argv/token redaction.

  Fourth, add the focused tests and source-anchor closures that the locked Phase
  3 plan declared but the implementation commit did not establish. Harn find
  currently cannot resolve agent-preset-management-authorization-regression,
  agent-preset-management-client, agent-preset-management-client-regression,
  agent-preset-command-surface, preset-delete-confirmation,
  agent-add-protocol-regression, or the intended safe prompt implementation
  ownership. Close every opened marker in LIFO order and make each named ref
  resolve to the exact implementation or regression it claims; do not create
  substitute assumptions or edit generated assumption truth directly.

  Focused protocol coverage must parse all six strict correlated preset/roster
  requests, all four safe result shapes, exact adapter-or-preset selection,
  conditional manual handle, legacy manual compatibility, bounded refs/ids, and
  rejection of launch/unknown fields in safe results and add-agent frames.
  Focused WebSocket coverage must exercise owner/admin preset CRUD and ordered
  roster success, member/observer/agent denial, one matching correlated result
  or error after unrelated traffic, atomic missing/reference failures, and a
  custom-ACP result containing only adapter `acp` plus custom_acp true. Retain
  the complete accepted REST matrix unchanged.

  Focused daemon/CLI coverage must prove fresh native, named ACP, and custom ACP
  preset add snapshots; per-add cwd/purpose and explicit override behavior;
  missing/deleted/stale refusal before member persistence; no stored preset id,
  private launch output, message, delivery, run, or paid turn; multiple preset
  label/id ordering; full replacement optional-field clearing; exact roster
  order, empty/duplicate/missing/reference behavior and restart persistence;
  channel omission, empty/default roster, and manual native/named/custom
  Starting agent mutual exclusion; complete no-room preflight failure; detached
  members after preset/roster changes; and member-local runtime spawn failure
  leaving the failed member dead while later members continue. These tests may
  reuse the already-accepted Store/daemon fixtures and must not change domain
  behavior merely to simplify a fixture.

  Add unit coverage for preset management correlation after unrelated preset,
  room/member, and differently referenced error frames; deterministic
  locale-independent label-then-id ordering; fixed escaped human rows; one
  compact JSON value; maximum named/custom safe projection; private
  launch/credential/session/host absence; and the hostile-label one-line prompt.
  Existing source/packed command compatibility and the installed Phase 3 smoke
  remain mandatory. The packed script already exercises installed CRUD, roster,
  channel creation, preset-backed add, reference conflict, redaction, legacy
  lifecycle, browser/API, and teardown; retain it unchanged unless a source fix
  genuinely requires a bounded regression there.

  Explicitly excluded: new commands/options/result fields, partial update,
  changed preset/roster persistence, changed REST/browser responses, alternate
  authorization, direct SQLite, worktrees, qualified posting, documentation,
  hard deletion, cloud/account/relay/token work, Phase 4/5, and unrelated
  cleanup. Produce exactly one review-fix implementation commit.
