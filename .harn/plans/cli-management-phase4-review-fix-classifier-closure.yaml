id: cli-management-phase4-review-fix-classifier-closure
title: Close the accepted worktree lifecycle refusal classifier matrix
notes: >-
  This is the second and final bounded review fix for Phase 4, based on clean
  commit fececb2129dccff309808a93e214a4a2e2715531. Independent review confirmed
  that the first review-fix correctly implements UTF-8 byte ordering, fresh
  preview identity validation and prompting, credential locality, fixed safe
  projections, repaired LIFO production anchors, installed 2/5/6 proof, and
  qualified wait compatibility. Its CLI dependency build passes and Harn shows
  the review plan applied with the expected production refs.

  The first review-fix replaced the old broad worktree conflict fallback with
  explicit invocation and conflict matchers, but its regression enumerated only
  a subset of the accepted runtime vocabulary. A fresh built audit against the
  exact errors emitted by WorktreeManager and Store reproducibly returns
  transport 7 for four lifecycle refusals: `registered worktree identity does
  not match Git`, `could not verify local branch: <branch>`, `no active
  worktree: <id>`, and `only an active secondary worktree can be unregistered:
  <id>`. These are not HTTP, socket, framing, or protocol failures. The first
  two are final Git identity/ref verification refusals; the latter two are
  stable-id lifecycle races possible after the CLI list/selection and consent
  steps. All four must be conflict exit 6 with empty stdout and the existing
  one-line redacted stderr behavior.

  Add those exact bounded phrases to the worktree conflict classifier and to the
  readable table-driven management regression. Audit every current worktree
  lifecycle error literal in packages/switchboard/src/worktrees.ts, the worktree
  lifecycle methods in Store, and the daemon's worktree delegation boundary; the
  table must contain every public invocation or lifecycle phrase reachable from
  `worktree list/add/remove`, including the already-covered final-removal dirty
  race. Retain invocation 2 for schema/absolute-path/parent-
  shape/invalid-new-branch/invalid-cwd inputs, authentication 3, authorization
  4, missing channel or initial CLI selector 5, conflict 6 for lifecycle/race/
  Git refusal, and transport 7 only for actual HTTP/socket/protocol/invalid-
  response failures. Preserve not-found precedence for auth-like ids and every
  Phase 1-4 management classification.

  Do not change worktree commands, projections, confirmation, REST, protocol,
  daemon, Store, Git, routing, credentials, packed scripts, UI, docs, or Phase
  5. Do not reformat or refactor unrelated management code. Produce exactly one
  review-fix implementation commit touching only the two declared CLI files and
  this applied plan.
