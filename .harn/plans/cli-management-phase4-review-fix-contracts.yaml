id: cli-management-phase4-review-fix-contracts
title: Correct Phase 4 ordering, fresh confirmation, exit, anchor, and evidence
  contracts
notes: >-
  This is the bounded review fix for applied Phase 4 commit
  ee66c53a03930e072dbdd6f74ca18743fa899647. Independent review confirmed the
  exact one-commit boundary, clean applied Harn state, singular list/add/remove
  command family, accepted REST-only lifecycle delegation, safe fixed-field
  projections, no direct Git or SQLite access, qualified foreign-peer wait
  behavior, disposable real-Git lifecycle behavior, full CLI tests, and CLI
  dependency build. It found three reproducible runtime contract defects plus
  missing production anchor ownership and focused evidence from the locked plan.
  Fix only these issues; do not rewrite or expand the applied plan and do not
  begin Phase 5.

  First, the helper named compareBytes uses JavaScript string comparison. That
  is UTF-16 code-unit order, not byte order, and reverses valid Unicode path
  pairs such as U+10000 and U+E000 relative to their UTF-8 bytes. Replace it
  with an explicit stable UTF-8 byte comparison and use it for every promised
  bytewise key. Keep main/primary-first behavior and alias/id/path tie-breakers
  unchanged. Add a regression whose supplementary-plane and BMP paths fail under
  UTF-16 ordering, plus stable tie-breaker, safe-field, human-control, and
  compact-JSON assertions. Do not use locale-sensitive comparison.

  Second, filesystem removal lists and selects a worktree, obtains the accepted
  fresh removal preview, but prompts with the stale list snapshot. If an alias
  or canonical path changes between those reads, the prompt does not name the
  exact fresh safe alias/path it is about to remove. For --filesystem, retain
  the stable selected id and route, require the preview worktree id to match it,
  and source the one-line escaped confirmation alias/path from that fresh
  preview. Treat a mismatched preview identity as an invalid protocol response
  with transport exit 7 and no prompt or mutation. DB-only unregister continues
  to prompt from the immediately selected active registration because it has no
  preview endpoint. The server remains final authority and repeats every check
  after consent; no force, prune, branch delete, direct filesystem, or direct
  Git path is added.

  Third, the shared classifier applies broad invocation phrases such as `must
  be` before worktree lifecycle phrases. The accepted final-removal race
  `worktree must be clean before removal` therefore exits 2 instead of conflict
  6, while `room has no existing repository cwd`, `cwd is not inside a Git
  worktree`, `created worktree belongs to a different repository`, `created
  worktree could not be rediscovered`, `registered worktree is missing or
  mismatched`, and `the main alias is reserved` fall through to transport 7.
  Classify the complete accepted worktree error vocabulary by semantics, not by
  incidental broad words: request/schema/absolute-path/parent-shape/invalid-new-
  branch errors are 2; authentication is 3; authorization is 4; missing channel
  or selector is 5; existing targets or branches, main/duplicate/ambiguous
  aliases, repository/discovery/availability/lock/dirty/missing/mismatch/live-
  runtime/unresolved-work/race and other daemon/Git lifecycle refusals are 6;
  and only actual HTTP/transport/protocol failures are 7. Preserve not-found
  precedence for auth-like ids, one stack-free redacted stderr line, empty
  stdout, and selected token/token-bearing URL redaction. Pin every literal
  refusal currently emitted by the accepted worktree manager/daemon so future
  wording precedence cannot silently regress.

  Fourth, repair the Phase 4 source markers. The applied commit repeatedly opens
  worktree-management-rendering and worktree-management-client without closing
  them, leaves worktree-command-surface and its nested removal marker open, and
  closes the outer post-wait assumption while the qualified-post-wait marker is
  still open. Harn therefore finds the test/packed anchors but no Phase 4
  production anchors in worktree-management.ts or program.ts. Consolidate each
  production region into one exact LIFO-balanced span, give the command's
  removal wiring its own unambiguous ref, and make every plan-declared Phase 4
  production and regression ref resolve. Do not edit generated assumption truth
  directly or move unrelated legacy anchors merely to satisfy line mapping.

  Finally, close the focused verification gaps that allowed the defects through.
  Add source CLI evidence for fresh-preview prompt identity and mismatch
  refusal; owner/admin lifecycle success; member/observer mutation and real
  agent read/ mutation refusal as authorized by the accepted role matrix; local
  installed operator-token fallback; explicit loopback URL/token; non-loopback
  URL with no automatic installed credential; exact JSON purity/redaction;
  explicit --default-roster forwarding; and no mutation on all refusals. Reuse
  the existing mkdtemp Git/server fixtures and argument-array helpers. Extend
  the installed packed proof with one valid-mode no-repository lifecycle refusal
  that exits 6, leaves stdout empty, emits exactly one redacted stderr line, and
  retains the existing malformed-mode exit 2 and unknown-selector exit 5 checks.
  Preserve every existing Phase 1-4 unit, packed, browser, REST, flat command,
  Windows shim, Unix socket, and explicit URL/token contract.

  Explicitly excluded: new commands or options, changed JSON fields or human
  columns, worktree show/rename/alias commands, protocol/server/daemon/store/Git
  behavior, WebSocket worktree frames, force removal, prune, branch deletion,
  hard channel deletion, UI changes, routing grammar changes, credentials,
  cloud/account/relay work, documentation/release metadata, Phase 5, and
  unrelated cleanup. Produce exactly one review-fix implementation commit.
