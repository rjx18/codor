verification: "Capture and hash normalized `git worktree list --porcelain`
  before implementation and after every real-Git gate; only the expected branch
  HEAD may change at the one commit. Use TDD: first add focused failing
  regressions for supplementary-plane versus BMP byte ordering, fresh-preview
  prompt data, mismatched preview id, every accepted worktree input/lifecycle
  error class, credential/role/default-roster wiring, and installed valid-mode
  conflict. Then run `pnpm --filter @codor/cli test`, `pnpm --filter
  @codor/protocol test`, the focused accepted switchboard
  worktree/router/collaboration/daemon/server tests, `pnpm --filter
  @codor/switchboard test`, `pnpm --filter @codor/web-next test`, `pnpm --filter
  '@codor/cli...' build`, `pnpm build`, root `pnpm test`, and
  `scripts/packed-install-test.sh`. All existing Phase 1-4 flat/structured
  commands, Windows argument tests, Unix socket behavior, explicit URL/token
  behavior, browser/REST contracts, qualified local/foreign wait behavior,
  packed runtime, and secret redaction must remain green. Run `harn find` for
  structured-worktree-cli-uses-accepted-lifecycle,
  worktree-cli-removal-requires-previewed-consent,
  qualified-cli-wait-preserves-scoped-peer-identity, and every ref declared by
  this plan; production refs in worktree-management.ts and program.ts must be
  present and LIFO-balanced. Run `harn find --plan
  cli-management-phase4-review-fix-contracts`, `harn plan check
  cli-management-phase4-review-fix-contracts`, and `harn check
  cli-management-phase4-review-fix-contracts`; stage only this plan and the
  seven declared files, run `harn check --staged`, let the commit hook apply the
  plan without bypass, and create exactly one review-fix commit."
