        digest-pinned Git-capable glibc Node 22 container with networking off
        and isolated data and repository roots; use both the default local
        socket and an explicit loopback URL/token to create presets, an ordered
        roster, a roster-backed channel, a roster-backed secondary worktree, and
        additional agents; complete one qualified child-agent turn into the
        origin; archive the channel; gracefully restart the same daemon; and
        prove durable safe channel, roster, agent, worktree, branch, and
        origin-only history state without printing credentials, private
        launches, native sessions, Git administrative identity, keys, or
        mutating any real checkout.
      reason: Phase 5 must prove the separately accepted management domains compose in
        the exact installed, offline, restartable runtime operators receive.
