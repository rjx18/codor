id: cli-management-phase5-packaging-integration
title: Finish CLI management help, upgrade guidance, and packed recovery integration
notes: |-
  Implement only Phase 5 of .codor/PHASED-PLAN.md on the independently accepted, clean Phase 4 tip f141553e7c5130169c597d491e4443f02ee7e18f. This is the final packaging and integration phase. It documents and proves the already accepted Phase 1-4 command families; it must not introduce another command, wire frame, REST route, database transition, authorization rule, lifecycle, selector, output field, or recovery mechanism.
  Make the accepted management surface discoverable through Commander metadata. Root help must name channel, agent, agent-preset, default-roster, and worktree as separate families and point at family help. Family help must enumerate only the accepted subcommands and explain their important distinctions: channel archive is soft retention and there is no hard-delete or restore command; agent add selects exactly one adapter or preset; agent-preset is individual reusable CRUD; default-roster is a separate ordered full replacement; and worktree add explicitly creates or adopts while remove defaults to DB-only unregister and requires --filesystem for the guarded checkout removal. Include compact safe examples without a bearer value, private ACP launch, native session reference, Git administrative id, or promise of a cloud service. Apply the metadata in one new LIFO Harn block after all five families have been constructed; do not edit or move their accepted registration blocks or historical markers. Preserve the exact current command names, order, aliases, options, parser routing, exit behavior, and every flat command including channels.
  Add an explicitly anchored README management section after the existing Everyday CLI compatibility examples. It must show valid human and --json examples for all five families, ordinary local-switchboard use, optional explicit loopback URL/token use without a literal credential, confirmation/ --yes behavior, archive-only retention, ordered roster replacement, and the create/adopt versus unregister/filesystem worktree boundary. The upgrade note must say existing flat commands remain compatible and that rerunning `npx @richhardry/codor install` refreshes the installed service/runtime. Add a separate Unreleased changelog entry describing the same operator-visible addition without rewriting the existing nine-finding release-candidate record. The README copied into the public package must retain this section.
  Extend scripts/packed-install-test.sh in place rather than creating a second release proof. Keep the existing pinned slim build/install image and all current checks. Add a separately named, digest-pinned Git-capable glibc Node 22 runtime image, node:22-bookworm@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a, for the existing --network none runtime container; the accepted artifact is still built and installed only once by the original image. Inside the bound /proof temporary root, initialize and commit one disposable primary Git checkout with argument-array Git commands and no shell interpolation of operator-controlled paths. Do not inspect, register, dirty, remove, or change any real user checkout or branch.
  Through the installed CLI and packaged daemon, execute one coherent workflow: verify installed root/family help and packaged README; create at least one safe housecat preset and set the ordered default roster; create a new channel at the disposable primary cwd with that roster through the default Unix socket; create one named secondary worktree and snapshot the default roster through an explicit loopback --url plus --token; add another agent explicitly; send a qualified ~child:@handle message from the root conversation; wait boundedly until the fixture adapter's result appears only in the origin transcript; and archive the root channel with unattended --yes. Prove root and child public agent projections carry their respective canonical cwd, the child worktree and branch exist, the target transcript did not receive a copied qualified result, stdout is JSON-pure where requested, and neither success nor failure output contains the proof bearer, private ACP launch, native session, repository administrative identity, room key, or sealed key.
  Then gracefully stop and restart the same installed daemon with the same data, socket, HTTP origin, adapter, and disposable repository. Recovery in this plan means proving after that restart that default channel discovery still hides the archived root, channel show and channel list --all retain it, the ordered roster and safe root/child agent snapshots persist, worktree list still identifies the same active child/canonical path/branch, Git still contains the child checkout and branch, and the completed qualified result remains only in the origin history. Do not add unarchive, hard delete, force, prune, recursive removal, branch deletion, session kill, or direct SQLite assertions. Finish the pre-existing browser/API/teardown checks and keep runtime networking off.
  Preserve automatic installed-local socket behavior, explicit URL/token behavior, the rule that the local operator credential is never automatically sent to a non-loopback origin, Unix socket privacy, Windows named-pipe and argument-forwarding shims, owner/admin/member authorization, confirmation, exit codes, stderr, JSON projection, and secret redaction. Do not change the protocol, switchboard, management clients/renderers, setup/install code, Windows scripts, web clients, Agent Presets domain, Native Worktrees domain, dependencies, package versions, or release publishing. Produce exactly one implementation commit containing only this applied plan and the five declared files.
