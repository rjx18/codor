verification: >-
  Work test-first. Add the dedicated end-of-file help regression and observe it

  fail against the unmodified Commander metadata; then make the bounded program

  changes and rerun it green through the repository test-environment wrapper.

  Keep all new index.spec.ts markers at file end so historical duplicate-anchor

  line mappings do not move. Validate the packed shell with `bash -n

  scripts/packed-install-test.sh` before executing it.


  Before any Git-backed command, capture a normalized inventory of every real

  Git worktree under the user's existing worktree roots. Every repository and

  linked checkout created by tests or the packed workflow must live under its

  own mkdtemp or /proof bind root, and cleanup may remove only that exact root.

  Compare the normalized inventory after each Git-backed gate and at completion;

  any real path, HEAD, branch, or dirty-state change fails the phase.


  Run the focused help regression with

  `pnpm --filter @codor/cli exec node ../../scripts/test-env.mjs vitest run

  src/index.spec.ts -t "Phase 5 management help"`. Run the Windows argument and

  local-transport regressions explicitly with

  `pnpm --filter @codor/cli exec node ../../scripts/test-env.mjs vitest run

  src/install-win32.spec.ts src/setup-win32.spec.ts src/runtime-install.spec.ts

  src/connection-pipe.spec.ts`. Run `pnpm --filter @codor/cli test`,

  `pnpm --filter @codor/switchboard test`, `pnpm --filter '@codor/cli...'
  build`,

  `pnpm build`, and root `pnpm test` in isolated CODOR environment. Run the

  focused accepted browser composition specs room37-agent-presets,

  room40-native-worktree-group, and room41-native-worktree-lifecycle with fresh

  harness state and non-overlapping four-port ranges.


  Execute `scripts/packed-install-test.sh` end to end. It must
  build/pack/install

  from the clean selected branch, keep every prior assertion, run the installed

  Git-capable management/restart workflow with runtime networking disabled, and

  finish browser/API/teardown. Inspect captured success and failure output for

  the proof token and private field vocabulary, assert one compact JSON value

  per requested success, keep prompts/diagnostics off stdout, and use bounded

  readiness/result polling instead of sleeps.


  Run `harn find --plan cli-management-phase5-packaging-integration`, `harn plan

  check cli-management-phase5-packaging-integration`, and `harn check

  cli-management-phase5-packaging-integration`; resolve every plan, scope,

  anchor, LIFO, and duplicate-identity issue without changing this locked plan.

  Stage only this plan and the five declared files, run `git diff --cached

  --check`, `harn find --staged`, and `harn check --staged`, and let the normal

  Harn commit hook apply the plan. Create exactly one Phase 5 implementation

  commit above f141553e7c5130169c597d491e4443f02ee7e18f and leave a clean

  worktree.
