id: cli-management-phase5-review-fix-evidence
title: Correct Phase 5 management examples and packed recovery evidence
notes: >-
  This is a bounded review fix for Phase 5 on the independently reviewed clean
  commit 6b199812962d2867063b6b239d7530e34ad1eac7. The Phase 5 plan is applied,
  its commit boundary is exact, and the accepted Phase 1-4 runtime remains
  unchanged. Independent review found two evidence defects in the new
  help/documentation and packed integration surfaces; this plan corrects those
  defects without reopening or extending the product.


  First, root help, channel-family help, and README advertise `codor channel
  list --channel desk`, but the accepted `channel list` grammar has only `--all`
  and `--json`. The installed CLI reproducibly rejects the advertised example
  with invocation exit 2, empty stdout, and one `unknown option '--channel'`
  stderr line. Replace every invalid example with accepted syntax, keep `channel
  list` unscoped, and use `channel show desk` wherever an example needs a
  specific channel. Strengthen the end-of-file Phase 5 help regression so root
  help, family help, and README cannot reintroduce the invalid option and retain
  exact safe examples; do not add an option or change any command registration,
  ordering, alias, parser route, exit, output, or connection behavior.


  Second, the packed recovery setup creates `/proof/phase5-child` and local
  branch `phase5-child` with raw Git before invoking the installed CLI with
  `worktree add --create` for those same resources. The accepted WorktreeManager
  correctly refuses an existing target or local branch, so this setup cannot
  prove that the installed CLI created the secondary worktree described by the
  assumption. Initialize and commit only the disposable primary repository with
  argument-array Git in the raw setup. The installed explicit loopback URL/token
  `worktree add --create --default-roster` command must be the sole creator of
  the child checkout and branch. Assert immediately afterward that the returned
  public projection, canonical child checkout, registered worktree, branch, and
  roster snapshot exist, and retain the recovery assertions after restart.


  Make the restart evidence genuinely graceful: fail if the first daemon does
  not exit successfully after SIGTERM, rather than ignoring its status, before
  starting the same installed daemon with the same data, socket, origin,
  adapter, and repository. After restart, assert both named root agents
  (`phase5-helper` and `explicit-worker`) and the named child snapshot
  (`phase5-helper`) in addition to their canonical cwd values. Strengthen the
  shared Phase 5 redaction assertion to reject the proof bearer and explicit
  private JSON field names for ACP launch/executable/argv, native session/host,
  Git administrative/common path identity, and room/sealed keys without
  false-positive substring matches; apply it to installed root help as well as
  every new success/history projection. Keep stdout JSON-pure and failures on
  one-line stderr.


  The packed script clones the selected committed ref before building the
  artifact, so running it directly from an uncommitted target branch can
  exercise the parent script and artifact rather than this fix. Before the
  target commit, validate the exact staged source in an isolated temporary
  clone/branch under an exact mktemp root and run this worktree's updated script
  with `CODOR_PACKED_SOURCE` and `CODOR_PACKED_REF` selecting that temporary
  committed source. After the one target commit, rerun the normal packed script
  against the resulting `feat/cli-management` commit and require it to pass.
  This temporary validation history is outside the managed branch and must be
  removed with only its exact temporary root.


  Preserve every accepted flat and structured command, local socket default,
  explicit loopback URL/token path, credential locality, owner/admin/member
  authorization, confirmation, exit code, stderr, JSON projection, archive-only
  retention, preset/roster semantics, worktree lifecycle, qualified routing,
  offline runtime, pinned images, browser/API checks, Windows shims, and package
  contents. Do not change protocol, switchboard, management
  clients/renderers/classifier, database, Git manager, setup/install code,
  Windows scripts, web code, dependencies, versions, changelog, or publishing.
  Produce exactly one review-fix implementation commit containing only this
  applied plan and the four declared files.
