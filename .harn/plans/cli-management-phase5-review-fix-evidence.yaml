verification: >-
  Work test-first. Extend the physical-end Phase 5 help regression to read root
  help, channel-family help, README, and the packed script; assert the invalid
  `channel list --channel` example is absent, corrected accepted channel
  examples are present, the raw Git setup does not create the child or branch,
  and the installed CLI create command remains. Run `pnpm --filter @codor/cli
  exec node ../../scripts/test-env.mjs vitest run src/index.spec.ts -t "Phase 5
  management help"` against the unmodified sources and observe the new
  assertions fail; then make only the bounded production/docs/script corrections
  and rerun green. Keep the test block at physical EOF and preserve all
  historical markers. Run the built CLI reproduction for the corrected
  documented channel commands and require zero invocation errors.


  Run `bash -n scripts/packed-install-test.sh`, the focused
  Windows/local-transport regressions (`pnpm --filter @codor/cli exec node
  ../../scripts/test-env.mjs vitest run src/install-win32.spec.ts
  src/setup-win32.spec.ts src/runtime-install.spec.ts
  src/connection-pipe.spec.ts`), `pnpm --filter @codor/cli test`, `pnpm --filter
  '@codor/cli...' build`, `pnpm build`, and root `pnpm test` in an isolated
  CODOR environment. The existing Node engine and bundle-size warnings are
  acceptable; failures are not.


  Before the target commit, create one isolated temporary validation clone and
  branch under an exact mktemp root, apply the exact staged four-file source
  diff, commit that throwaway branch, and run this worktree's updated
  `scripts/packed-install-test.sh` with `CODOR_PACKED_SOURCE` and
  `CODOR_PACKED_REF` pointing at that exact temporary branch. This must build,
  pack, and install the corrected source, initialize only the primary repository
  outside the installed CLI, prove the installed CLI creates the child/branch
  once, require a successful graceful stop, recover named root/child agents and
  canonical paths, pass strengthened redaction assertions, preserve every
  browser/API/teardown assertion, and run with runtime networking disabled.
  Remove only the exact temporary root. After the normal Harn-hook target
  commit, rerun `scripts/packed-install-test.sh` against the committed
  `feat/cli-management` tip and require the same result.


  Capture a normalized inventory of all real worktrees before any Git-backed
  gate and compare it after each such gate and at completion; all disposable
  repositories/checkouts must stay under mktemp or `/proof`, and no real
  checkout, branch, HEAD, or dirty state may change.


  Run `harn find --plan cli-management-phase5-review-fix-evidence`, `harn plan
  check cli-management-phase5-review-fix-evidence`, and `harn check
  cli-management-phase5-review-fix-evidence`; resolve every issue without
  changing the locked plan. Stage only this plan and the four declared files,
  run `git diff --cached --check`, `harn find --staged`, and `harn check
  --staged`, and let the normal Harn commit hook apply the plan without bypass.
  Create exactly one review-fix commit above
  6b199812962d2867063b6b239d7530e34ad1eac7 and leave a clean worktree.
