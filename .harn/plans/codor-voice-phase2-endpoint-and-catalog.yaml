verification: "Vitest proves the registry projects codex-only safe metadata with
  availability from injected credentials state; server integration specs prove
  catalog auth and shape, transcribe success text with a stubbed provider,
  refusals (no auth, oversized, short audio, concurrent, timeout, disabled) with
  correct statuses, upstream-body preservation, and that selection follows
  server config with no client override. CLI/up threading compiles and is
  exercised by the server option specs. Curl smoke against a running switchboard
  once: real WAV with the operator token returns 200 and a transcript; a wrong
  bearer gets a clean 401/403; an oversized body gets 413. pnpm -r build and -r
  test gate on exit codes (known pre-existing acp cancellation flake noted
  separately); harn unstaged/staged/apply gates pass."
