verification: >
  Run harn find and inspect the existing avatar and badge assumptions before
  checking and clean-locking this plan from e2aa09d's reviewed correction commit
  9b31cb7. Run focused ComputerChoice/ComputerSwitcher units, all web-next
  units, the production/PWA build, and Room 36. Prove zero suppression and
  independent working/attention rendering in units, and assert adjacent
  horizontal bounding-box geometry for both bottom badges in the browser. Run
  harn find --changed, harn check, harn apply, harn check --staged, and git diff
  --check, then create exactly one review-fix commit. Do not change pairing,
