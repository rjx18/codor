verification: >
  Before editing, run harn find for every reviewed assumption and declared file,
  check and clean-lock this plan from the exact 54b46ab base. Run focused
  ComputerChoice/ComputerSwitcher/session/storage units, all web-next units, the
  production/PWA build, Rooms 34, 35, and 36, desktop and phone flows, warm
  switching and no-new-socket assertions, browser-local appearance
  persistence/isolation, context-menu/long-press/Shift+F10 dialog focus, and
  light/dark Axe. Run harn find --changed, harn check, harn apply, harn check
  --staged, and git diff --check. Stage only this plan, the declared files, and
  generated assumption truth; create exactly one implementation commit. Do not
  start Phase 3, push, deploy, publish, or alter relay, database, credential,
  protocol, or server behavior.
