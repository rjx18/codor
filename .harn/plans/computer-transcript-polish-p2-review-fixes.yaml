verification: >
  Run harn find and inspect the existing avatar, activity, label, isolation, and
  recovery assumptions before locking this plan from clean e2aa09d. Run focused
  ComputerChoice, ComputerSwitcher, RecoveryOverlay, session, and storage units,
  all web-next units, the production/PWA build, and Rooms 34, 35, and 36 on
  desktop and phone. Cover zero badges, simultaneous working/attention badges,
  hover and keyboard-focus tooltips, context-menu/Shift+F10 accessibility, and
  appearance cleanup from both customization Forget and recovery Forget. Run
  harn find --changed, harn check, harn apply, harn check --staged, and git diff
  --check, then create exactly one review-fix commit. Do not change pairing,
  session, relay, protocol, server, direct-mode, deployment, or release
  behavior.
