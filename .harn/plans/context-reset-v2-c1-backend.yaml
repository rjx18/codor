anchors:
  context-reset-requests-settle-by-explicit-ref:
    clear-context-ref-protocol:
      action: change
      reason: >
        Require a bounded explicit ref for clear_member_context while retaining
        compatibility for unrelated acts.
    clear-context-ref-server:
      action: change
      reason: >
        Return one requester-local success or failure with the exact request ref
        and keep ordinary member fanout uncorrelated.
    clear-context-ref-regression:
      action: change
      reason: >
        Prove concurrent refs, unrelated errors/member frames, denial, success,
        disconnect, and stale results cannot cross-settle.
  context-reset-retirement-is-bounded-owned-and-confirmed:
    adapter-reset-retirement-contract:
      action: change
      reason: >
        Define finite complete retirement and ownership semantics without
        replacement-session creation.
    claude-reset-retirement:
      action: change
      reason: >
        Bound query interruption, close/return, and pump settlement before cache
        removal.
    codex-reset-retirement:
      action: change
      reason: >
        Gracefully dispose, escalate only the owned app-server child when
        needed, confirm exit, and retain supervision on failure.
    acp-reset-retirement:
      action: change
      reason: >
        Gracefully terminate then narrowly escalate the owned ACP process group,
        confirming exit before negotiated runtime removal.
    one-shot-reset-retirement:
      action: change
      reason: >
        Prove each built-in one-shot adapter has no live owned child capable of
        writing before confirming reset.
    reset-retirement-regression:
      action: change
      reason: >
        Cover graceful exit, timeout/escalation, unconfirmed failure,
        disconnect/restart, late exit, and fresh post-reset creation order.
  member-context-reset-is-authorized-atomic-and-lazy:
    adapter-reset-contract:
      action: change
      reason: >
        Tighten the hook documentation around bounded confirmed retirement and
        no stale writers.
    clear-context-act-schema:
      action: change
      reason: Require explicit per-request correlation for this destructive act.
    clear-context-runtime-lease:
      action: change
      reason: >
        Preserve all existing guards while fencing turns, attach, compaction,
        stale usage/session/model/exit callbacks, and queued-after-lease work
        across the complete bounded retirement boundary.
    clear-context-server-dispatch:
      action: change
      reason: >
        Correlate requester-local completion and failure without treating an
        ordinary member broadcast as action acknowledgement.
    clear-context-store-transaction:
      action: change
      reason: >
        Verify the atomic success boundary still clears only session-scoped
        metadata and preserves configuration, history, limits, spend, and future
        queued delivery.
    claude-session-reset:
      action: change
      reason: Bound and confirm complete retained-query retirement.
    codex-session-reset:
      action: change
      reason: Bound and confirm owned app-server retirement before cache removal.
    acp-session-reset:
      action: change
      reason: Bound and confirm owned provider retirement before cache removal.
    first-party-cli-session-reset:
      action: change
      reason: Verify no live one-shot child remains for every built-in adapter.
  member-task-projection-is-durable-and-session-scoped:
    member-task-storage:
      action: change
      reason: >
        Exercise task clearing only inside the confirmed atomic reset success
        transaction and preservation on retirement failure.
    member-task-daemon-regression:
      action: change
      reason: Preserve task state on failed retirement and clear it on success.
  current-context-window-truth-outlives-restarts:
    persisted-window-seed:
      action: change
      reason: >
        Prove delayed old-session/model usage cannot restore context truth after
        the reset boundary.
  attach-custody-lease-tracks-child-pid:
    attach-release-handshake:
      action: change
      reason: Prove attach acquisition remains excluded for the full reset lease.
  manual-compaction-leases-out-turn-admission:
    compaction-lease-state:
      action: change
      reason: Preserve mutual exclusion across bounded reset retirement.
    compaction-lease-regression:
      action: change
      reason: Prove neither lease admits or settles the other's work.
  claude-agent-sdk-query-is-the-session-runtime:
    claude-sdk-session-lifecycle:
      action: change
      reason: Reuse the existing query retirement seam with explicit finite bounds.
    claude-sdk-session-regression:
      action: change
      reason: Prove full retirement and failure preservation before a fresh query.
  codex-app-server-is-the-member-runtime:
    codex-app-server-session-lifecycle:
      action: change
      reason: Keep runtime supervision until bounded retirement confirms child exit.
    codex-app-server-session-regression:
      action: change
      reason: Prove graceful, escalated, delayed, and failed exit ordering.
  acp-v1-events-and-capabilities-are-negotiated:
    acp-adapter-runtime:
      action: change
      reason: Add bounded confirmed retirement for the retained ACP process.
    acp-adapter-regression:
      action: change
      reason: Prove negotiated runtime state is forgotten only after confirmed exit.
  adapter-process-lifecycle-supervised:
    antigravity-cli-process-supervision:
      action: change
      reason: Exercise the one-shot reset no-live-child boundary.
    copilot-cli-process-supervision:
      action: change
      reason: Exercise the one-shot reset no-live-child boundary.
    gemini-cli-process-supervision:
      action: change
      reason: Exercise the one-shot reset no-live-child boundary.
    grok-cli-process-supervision:
      action: change
      reason: Exercise the one-shot reset no-live-child boundary.
    grok-cli-process-supervision-regression:
      action: change
      reason: Cover reset refusal while an owned one-shot child is still live.
    opencode-cli-process-supervision:
      action: change
      reason: Exercise the one-shot reset no-live-child boundary.
