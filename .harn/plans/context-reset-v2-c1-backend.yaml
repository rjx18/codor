id: context-reset-v2-c1-backend
title: Context reset v2 phase C1 - bounded correlated backend retirement
notes: >
  Lane F phase C1 from the accepted parallel reliability and collaboration
  program. Preserve the existing owner/admin, local owned-custody, idle,
  persisted-session, no-active-turn, no-pending-delivery, no-attach,
  no-compaction, and single-reset lease gates. Make every clear request carry a
  caller-supplied bounded ref and return exactly one matching success or error
  to that requester; unrelated room errors, member broadcasts, and stale results
  must not settle another request.

  Make native retirement an honest bounded boundary. Claude must finish or bound
  its retained query interruption/close/pump retirement. Codex and ACP must
  request graceful shutdown, await confirmed exit, and after the grace bound
  escalate only the child/process group created and owned by that adapter, with
  a second finite confirmation bound. One-shot first-party CLI adapters must
  likewise prove that no owned turn child can still write before reset succeeds.
  A timeout, disconnect, process error, or unconfirmed exit rejects without
  clearing the durable reference or forgetting supervision. A daemon restart
  with no retained in-memory runtime still clears only after the adapter
  honestly confirms that it owns no live writer.

  Hold the reset lease across retirement and the atomic durable clear, and fence
  attach, turn, compaction, delayed usage, stale session/model events, and late
  runtime exits from restoring invalidated state. On failure release the lease
  and preserve the old valid session/runtime reference; on success preserve
  identity, configuration, channel transcript/evidence, provider limits,
  spend/usage accounting, and queued future delivery while clearing only
  session/context/task/runtime metadata. Clear itself creates no native session
  and no paid turn; the next admitted delivery creates the fresh runtime through
  the ordinary session path.

  Red first: add focused protocol/server tests proving two concurrent refs and
  unrelated frames cannot cross-settle; daemon tests for timeout, restart,
  duplicate reset, mirrored custody, attach/turn/compaction races, queued-after-
  lease delivery, stale usage/model/session/exit callbacks, and durable failure
  preservation; and adapter tests that initially expose incomplete graceful
  retirement, escalation, or retained-runtime forgetting. Then implement the
  smallest backend fix. Run affected protocol, adapter, and complete switchboard
  tests/builds plus Harn staged/apply checks and git diff --check. C2 UI,
  layout, modal/confirmation behavior, unrelated protocol redesign, transcript
  deletion, deployment, publication, push, merge, and release are excluded.
assumptions:
  retire: []
  create:
    - id: context-reset-requests-settle-by-explicit-ref
      title: Context reset requests settle only by their explicit correlation ref
      statement: >
        Every clear_member_context request must carry one bounded explicit ref,
        and the initiating connection must receive exactly one success member
        result or error carrying that same ref for the same room and target.
        Ordinary authoritative member broadcasts remain uncorrelated state, and
        unrelated room errors, member updates, concurrent clears, disconnects,
        or stale replies cannot settle a different reset request.
      reason: >
        A constant action-name ref and an uncorrelated member broadcast cannot
        distinguish concurrent or stale reset outcomes and cannot support the
        member-local C2 progress contract safely.
      depends_on:
        - member-context-reset-is-authorized-atomic-and-lazy
        - management-frames-correlate-one-result
    - id: context-reset-retirement-is-bounded-owned-and-confirmed
      title: Context reset clears durable state only after bounded owned retirement
      statement: >
        A first-party adapter reset must retire every retained writer for the
        selected idle member within finite graceful and confirmation bounds,
        escalating only a subprocess or process group created and owned by that
        adapter. Success means the prior runtime can no longer emit, mutate,
        resume, or be found through any session/member cache; an unconfirmed
        exit, timeout, disconnect, close failure, or foreign/unowned runtime
        rejects while retaining supervision and the old durable session
        reference. A restarted daemon with no retained runtime confirms absence
        without creating a replacement session.
      reason: >
        Clearing resume and context metadata before all native writers are
        conclusively retired permits stale output and can orphan a paid runtime;
        an unbounded wait can wedge turn admission indefinitely.
      depends_on:
        - member-context-reset-is-authorized-atomic-and-lazy
        - adapter-process-lifecycle-supervised
        - claude-agent-sdk-query-is-the-session-runtime
        - codex-app-server-is-the-member-runtime
        - acp-v1-events-and-capabilities-are-negotiated
  reviewed:
    - id: member-context-reset-is-authorized-atomic-and-lazy
      outcome: unchanged
      reason: >
        Existing authorization, custody, idle-state, lease, atomic clear,
        preserved durable state, lazy fresh-session, and failure semantics
        remain authoritative; C1 closes correlation, bounded retirement, and
        stale- writer gaps inside that contract.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: Clear remains owner/admin-only and agent credentials gain no act.
    - id: one-inflight-turn-per-member
      outcome: unchanged
      reason: >
        The ordinary single-turn pump remains intact; the reset lease continues
        to exclude turn admission until retirement and commit settle.
    - id: durable-agent-runtime-configuration
      outcome: unchanged
      reason: >
        Model, policy, thinking, cwd, purpose, and private ACP launch identity
        remain durable while session lifecycle and baselines are cleared.
    - id: member-task-projection-is-durable-and-session-scoped
      outcome: unchanged
      reason: >
        Tasks remain scoped to the retired native session and clear atomically
        only after confirmed reset success.
    - id: compaction-reinjects-codor-briefing
      outcome: unchanged
      reason: >
        Reset continues re-arming the same briefing flags without changing
        compaction semantics or clearing misaddress state.
    - id: current-context-window-truth-outlives-restarts
      outcome: unchanged
      reason: >
        Successful reset invalidates only the retired context window; delayed
        old-session or old-model usage remains unable to restore it.
    - id: attach-custody-lease-tracks-child-pid
      outcome: unchanged
      reason: >
        Reset does not acquire foreign custody and continues refusing pending or
        active interactive attach ownership.
    - id: custody-uncertain-never-double-writes
      outcome: unchanged
      reason: >
        Mirrored or uncertain custody still fails closed; escalation is limited
        to adapter-owned children and never targets an external writer.
    - id: manual-compaction-leases-out-turn-admission
      outcome: unchanged
      reason: >
        Compaction and reset leases remain mutually exclusive at the common
        admission seam.
    - id: adapter-process-lifecycle-supervised
      outcome: unchanged
      reason: >
        Existing subprocess supervision remains authoritative; reset adds a
        bounded graceful-to-force retirement path without weakening turn or
        daemon shutdown supervision.
    - id: claude-agent-sdk-query-is-the-session-runtime
      outcome: unchanged
      reason: >
        Ordinary turns still reuse one query; explicit reset alone bounds and
        confirms full query retirement before forgetting it.
    - id: codex-app-server-is-the-member-runtime
      outcome: unchanged
      reason: >
        Ordinary turns still retain one app-server; reset preserves supervision
        until the owned child is conclusively gone and all lookup entries
        retire.
    - id: acp-v1-events-and-capabilities-are-negotiated
      outcome: unchanged
      reason: >
        Ordinary ACP negotiation/resume stays unchanged; reset conclusively
        retires its owned retained provider before lifecycle metadata clears.
