verification: >
  Confirm the worktree is clean except for this plan, then run harn find for
  every reviewed assumption and harn find --file for every declared file. Run
  harn plan check and clean-lock this plan at d50d867. Capture red focused
  store, connector, direct browser, and hosted browser evidence before
  production edits. Run focused app/store and connector units, all
  @codor/web-next units, its production/PWA build, isolated Playwright Rooms 3
  and 32, and Room 34 when multi-computer browser coverage changes. The browser
  gates must include keyboard focus/Escape/outside cancellation, composer
  usability while held, one attempt under repeat input, differently referenced
  error/member frames, local announced failure and Retry, success/fresh-session
  visibility, 390px light/dark bounds, target measurements, and Axe. Run harn
  find --changed, harn check, harn check --staged, harn apply, a staged recheck,
  git diff --check, and one Harn-guarded implementation commit leaving a clean
  worktree. Do not push, merge, deploy, publish, release, or change C1
  backend/runtime code.
