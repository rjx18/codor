  - packages/web-next/tests/room32-relay-journey.e2e.spec.ts
verification: >
  Validate and clean-lock this plan at 0475ccb before source edits. Capture red
  focused store/browser/type-check evidence first. Run focused store tests, the
  complete @codor/web-next unit suite, a production/PWA build against this
  worktree's protocol/switchboard artifacts, an explicit TypeScript check of
  room3-context.e2e.spec.ts with no C2 helper errors, and isolated full Rooms 3
  and 32 Playwright journeys. Verify Confirm leaves the pending Clear focused;
  an uncorrelated session-cleared member frame and a room switch retain one
  spinner and one attempt; matching success alone hides it; a hosted matching
  error delivered while away becomes one source-member alert/Retry on return;
  other refs/targets/stores do not settle it. Run harn check, staged check,
  apply, staged recheck, git diff --check, and one Harn-guarded correction
  commit leaving the worktree clean. Do not push, merge, deploy, publish, or
  release.
