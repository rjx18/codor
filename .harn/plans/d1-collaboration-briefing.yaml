verification: >
  Red first: add the D1 required/forbidden-phrase regression and run the focused
  router test to observe failure because the accepted baseline recommends status
  renewal/polling and omits single-handoff rules. Then implement the smallest
  shared-composer/boundary correction. Run focused router and daemon
  D1/compaction tests, the complete @codor/switchboard suite and build, and all
  first-party adapter package test suites and builds to verify their exact
  prompt boundaries. Run harn find --plan d1-collaboration-briefing, harn check
  d1-collaboration-briefing, harn find --changed, git diff --check, stage, harn
  check --staged, harn apply d1-collaboration-briefing, restage generated Harn
  truth, harn check --staged again, and make one implementation commit. Stop
  after tagging the local orchestrator once with red evidence, focused/full
  evidence, commit, and clean status. Do not delegate internally, push, merge,
  deploy, release, alter group routing, add a compaction path, or begin another
  lane.
