id: d1-collaboration-briefing
title: D1 - teach the single-handoff channel workflow on first delivery and
  after compaction
notes: >
  Lane D corrects the existing concise conventions briefing; it does not add a
  second prompt injection or compaction mechanism. The current trailer tells a
  worker to check status and renew while a peer is active and conditionally to
  poll its inbox. That encourages the exact post-handoff polling/monitoring loop
  the channel contract forbids. Replace the capability-sensitive polling
  contract with one adapter-independent, single-handoff contract. It must say:
  channel work stays with channel members rather than internal subagents; assign
  one member by tagging once; plain names do not invoke; after handoff do not
  poll, monitor, remind, or re-tag; the worker returns by tagging the
  orchestrator once only on completion or a genuine blocker; ordinary final
  replies post automatically; codor post is only necessary interim output while
  continuing or output sent outside the normal response path; and codor post
  --wait is only for one genuinely blocking direct answer. Preserve the
  untagged-target, message-reference, ledger, search, and exact ACK_OK clauses.

  The shared composeDeliveryBriefing boundary feeds every first-party adapter,
  so the daemon must stop branching the briefing bytes on live_inbox. The
  existing conventions_sent/misaddressed and roster_stale gates remain the only
  injection mechanism. The existing successful auto/manual compaction re-arm
  remains the only post-compaction hook. Regressions must cover fresh delivery,
  automatic and manual compaction, repeated compaction, real Store/Daemon
  restart persistence, grouped delivery, no mid-turn injection, exactly-once
  consumption, and unchanged stored user text. Existing adapter prompt tests
  remain the proof that the supplied string crosses each first-party native
  prompt boundary exactly.
assumptions:
  retire:
    - id: collaboration-briefing-is-capability-aware
      reason: >
        Its required timeout status renewal and capability-dependent inbox
        polling contradict D1's single handoff followed by no polling or
        monitoring. The replacement keeps the useful collaboration clauses but
        makes the briefing identical across adapter capabilities.
  create:
    - id: collaboration-briefing-enforces-single-channel-handoff
      title: The conventions briefing teaches one channel-member handoff without
        polling
      statement: >
        On a member's first flag-gated delivery and first delivery after a
        successful automatic or manual compaction, the shared conventions
        briefing supplied unchanged to every adapter must say that channel work
        is assigned to a channel member rather than an internal subagent by
        tagging that member exactly once, plain names do not invoke, the
        delegator does not poll, monitor, remind, or re-tag after handoff, and
        the worker tags the delegator exactly once only on completion or a
        genuine blocker; it must also say ordinary final replies post
        automatically, codor post is only for necessary interim output while
        continuing or output outside the normal response path, and codor post
        --wait is only for one genuinely blocking direct answer, because
        repeated invocations waste turns and blur ownership. The existing
        flag-gated composition must not inject mid-turn, duplicate a briefing,
        mutate stored user text, or vary the workflow by adapter capability.
      reason: >
        Compaction can remove the original orientation from native context, and
        the previous polling guidance causes orchestrators to repeatedly inspect
        or invoke an already-active worker instead of waiting for one terminal
        handoff.
      depends_on:
        - roster-briefing-refreshes-on-membership
        - compaction-reinjects-codor-briefing
        - adapter-registry-sole-harness-source
  reviewed:
    - id: agent-briefings-distinguish-invocation-from-discussion
      outcome: unchanged
      depends_on:
        - collaboration-briefing-enforces-single-channel-handoff
        - substantive-routing-excludes-acknowledgements
      reason: >
        Automatic final posting, @ invocation, plain-name discussion, and
        interim-only codor post remain true; the replacement makes the
        single-invocation consequence explicit.
    - id: grouped-deliveries-retain-agent-briefings
      outcome: unchanged
      depends_on:
        - roster-briefing-refreshes-on-membership
        - collaboration-briefing-enforces-single-channel-handoff
        - delivery-payload-snapshotted
        - group-round-payloads-share-one-ordered-view
      reason: >
        Grouped delivery still appends and consumes the same dynamic roster and
        conventions flags without changing the immutable group core.
    - id: live-collaboration-contract-is-public-v5
      outcome: unchanged
      depends_on:
        - collaboration-briefing-enforces-single-channel-handoff
        - cli-waits-consume-only-matching-deliveries
        - run-evidence-search-is-bounded-and-redacted
        - web-waits-are-visible-across-live-surfaces-v5
      reason: >
        The public exact example advances to the replacement briefing while the
        documented CLI capabilities and observable wait behavior remain true.
    - id: compaction-reinjects-codor-briefing
      outcome: unchanged
      depends_on:
        - compaction-timeline-items-are-durable-run-evidence
        - manual-compaction-is-an-operator-act
      reason: >
        Successful auto/manual compaction still re-arms only conventions_sent
        and roster_stale for consumption by the next ordinary delivery; D1
        changes the bytes behind that existing gate, not the hook.
    - id: roster-briefing-refreshes-on-membership
      outcome: unchanged
      reason: >
        First/stale roster delivery and persisted flag consumption do not
        change; the conventions block nested beside it receives new text.
    - id: delivery-payload-snapshotted
      outcome: unchanged
      reason: >
        Stored user messages, headers, and resolved references remain immutable;
        the dynamic flag-gated briefing is still appended only at admission.
    - id: adapter-registry-sole-harness-source
      outcome: unchanged
      reason: >
        Every built-in/configured adapter continues receiving the same payload
        string from the registry-owned deliver boundary; only the shared
        upstream briefing bytes change.
