id: d1-review-fix-compaction-doc
title: D1 review fix - document post-compaction briefing reinjection
notes: >
  Independent review of D1 commit 320aa2b found one public-contract
  contradiction in docs/PROTOCOL.md. The exact example now shows the correct
  single-handoff briefing, but the paragraph immediately below still says that
  after first delivery the trailer appears only following a misaddress. The
  accepted runtime and D1 contract also re-inject it on the next delivery after
  a successful automatic or manual native compaction. Correct only that prose,
  explicitly preserving the same persisted flag gate, no mid-turn injection, no
  duplicate briefing, no failed-compaction reinjection, and no second compaction
  mechanism. Extend the public collaboration anchor over the explanatory
  paragraph and add a nested compaction reinjection anchor so this edge cannot
  drift untracked again.
