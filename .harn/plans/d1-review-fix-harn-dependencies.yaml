id: d1-review-fix-harn-dependencies
title: D1 review fix - replace stale briefing dependents in Harn truth
notes: >
  Independent review after commits 320aa2b and 55fe4f8 found that D1 retired
  collaboration-briefing-is-capability-aware, but Harn apply does not rewrite a
  reviewed assumption's depends_on list. Three active assumptions therefore
  still depend on the retired node, and two statements still say the briefing is
  capability-aware and appears only on first delivery/misaddress. Retire those
  stale assumptions and create narrowly named successors with the same
  observable obligations updated for the adapter-independent single-handoff
  briefing and successful auto/manual compaction refresh. Re-home their existing
  source anchors by changing Harn comment IDs only. Runtime TypeScript, tests,
  public prose, and emitted prompt bytes must remain otherwise identical.
assumptions:
  retire:
    - id: agent-briefings-distinguish-invocation-from-discussion
      reason: >
        Its first-delivery/misaddress-only statement and dependency on the
        retired capability-aware briefing no longer describe D1 truth.
    - id: grouped-deliveries-retain-agent-briefings
      reason: >
        Its capability-aware and first-delivery/misaddress-only statement omits
        the adapter-independent post-compaction refresh now accepted by D1.
    - id: live-collaboration-contract-is-public-v5
      reason: >
        Its exact-briefing obligation still depends on the retired
        capability-aware assumption; replace it so public wait/status/inbox
        capabilities stay distinct from the no-polling briefing guidance.
  create:
    - id: agent-briefings-enforce-single-invocation
      title: Agent briefings distinguish discussion from one intentional invocation
      statement: >
        On first delivery, after misaddress, and on the next delivery after a
        successful automatic or manual compaction, the conventions briefing must
        state that an ordinary final reply posts automatically, an @mention
        invokes and auto-sends to that member exactly once, a plain member name
        discusses them without invocation, and codor post is only for necessary
        interim output while continuing or output outside the normal response
        path, because models must not accidentally schedule or repeat paid
        channel work while referring to a collaborator.
      reason: >
        This preserves the independently reviewable invocation/discussion edge
        while aligning its lifecycle and dependency with D1.
      depends_on:
        - collaboration-briefing-enforces-single-channel-handoff
        - substantive-routing-excludes-acknowledgements
    - id: grouped-deliveries-retain-single-handoff-briefings
      title: Grouped deliveries retain roster and single-handoff briefings
      statement: >
        Delivery-time composition for grouped work must append the active roster
        when the recipient roster is stale and the adapter-independent
        single-handoff conventions when their persisted gate is re-armed by
        first delivery, misaddress, or successful automatic/manual compaction,
        then clear each flag only after appending its block, while the immutable
        group root and result bundle remains unchanged.
      reason: >
        Group delivery uses the same accepted D1 gate and must not retain the
        retired capability-sensitive description.
      depends_on:
        - roster-briefing-refreshes-on-membership
        - collaboration-briefing-enforces-single-channel-handoff
        - delivery-payload-snapshotted
        - group-round-payloads-share-one-ordered-view
    - id: live-collaboration-contract-is-public-v6
      title: The single-handoff live collaboration contract is public
      statement: >
        Public docs must describe member-attributed interim and blocking posts,
        direct-reply wait mechanics, consuming inbox hooks, transient wait
        visibility, member status, bounded redacted run-evidence search, and the
        exact adapter-independent single-handoff conventions briefing agents
        receive, while clearly distinguishing separately available observability
        tools from briefing guidance that forbids polling delegated channel
        work.
      reason: >
        The public surface still documents live collaboration capabilities, but
        its briefing dependency must point to D1 rather than the retired polling
        contract.
      depends_on:
        - collaboration-briefing-enforces-single-channel-handoff
        - cli-waits-consume-only-matching-deliveries
        - run-evidence-search-is-bounded-and-redacted
        - web-waits-are-visible-across-live-surfaces-v5
  reviewed:
    - id: collaboration-briefing-enforces-single-channel-handoff
      outcome: unchanged
      reason: >
        D1 runtime, lifecycle, and prompt wording are already accepted; this
        plan only makes the dependent Harn graph point to that truth.
    - id: compaction-reinjects-codor-briefing
      outcome: unchanged
      reason: >
        The successful auto/manual re-arm hook and newly anchored public prose
        remain unchanged.
    - id: roster-briefing-refreshes-on-membership
      outcome: unchanged
      reason: Roster stale-state composition and membership refresh are unchanged.
    - id: substantive-routing-excludes-acknowledgements
      outcome: unchanged
      reason: Invocation guidance does not alter routing or acknowledgement semantics.
    - id: delivery-payload-snapshotted
      outcome: unchanged
      reason: Re-homing comments changes no immutable snapshot behavior.
    - id: group-round-payloads-share-one-ordered-view
      outcome: unchanged
      reason: The immutable group core and stable result order remain unchanged.
    - id: cli-waits-consume-only-matching-deliveries
      outcome: unchanged
      reason: Direct-reply wait mechanics remain an available documented capability.
    - id: run-evidence-search-is-bounded-and-redacted
      outcome: unchanged
      reason: Public bounded search behavior remains unchanged.
    - id: web-waits-are-visible-across-live-surfaces-v5
      outcome: unchanged
      reason: Existing wait visibility remains unchanged and distinct from polling
        guidance.
