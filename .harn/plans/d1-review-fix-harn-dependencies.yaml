verification: >
  Change only six assumption IDs in existing Harn source comments. Confirm a
  word-diff excluding .harn shows no runtime, test assertion, or documentation
  prose change. Run harn plan/check/staged/apply, harn find each retired and new
  assumption, harn find --depended-by
  collaboration-briefing-enforces-single-channel-handoff --depth 2, focused
  router and grouped/compaction daemon tests, switchboard build, git diff
  --check, and finish with one commit and a clean tree. Do not change behavior,
  prose, test assertions, push, merge, deploy, release, or begin another lane.
