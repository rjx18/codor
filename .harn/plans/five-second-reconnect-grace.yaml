id: five-second-reconnect-grace
title: Source-owned five-second visual grace and in-memory never-sent records
notes: "P3 only at 780b1d6a. Store one outage timestamp per computer, starting
  after established live readiness; repeat signals/view switches cannot extend
  it. Actual connected/roomLive remain unchanged in meaning. Reuse the recovery
  UI timing hook and existing reconnect owner. Existing outgoing records buffer
  at most 32 never-dispatched intents per source; on unavailable capability they
  remain not-sent with an explanation, never falling through to legacy posting.
  Existing ready/capability callbacks drain only compatible records in origin
  order; no extra request/polling/retry loop. Media upload/transcription and all
  server acts remain readiness-gated. Manual/auth/upgrade/disposed and
  never-live sessions cannot enqueue or receive grace. Skeleton behavior stays
  intact: only dependent Harn marker names are updated for the new priority
  graph; P2 removal remains separate. Fake-timer boundaries, short/long real
  direct/hosted outages, source/view switching, parks, downgrade and
  frozen-identity gates; full web units and production build before browsers.
  Authorized named-plan hook if generic ignored-web guard fails."
