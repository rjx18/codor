    - id: composer-memory-survives-session-connector-handover-v2
      reason: Replace immediate/no-local-buffer presentation and align active
        dependents with P3.
    - id: floating-room-loading-pill-uses-existing-priority
      reason: Replace immediate/no-local-buffer presentation and align active
