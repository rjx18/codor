id: history-text-slots-p1
title: Bound transcript history by text slots and cache two pages per room
notes: >
  Phase 1 on exact origin/main base 1ceaee95b54f7b27e81351fa47ea49d9cec3c238.
  Preserve the existing combined endpoint, room-bound opaque cursors, unitizer,
  merge controller, background warming, IndexedDB store, live-run ownership,
  target walking, and direct/ hosted transport split. Change a page from twenty
  raw units to twenty visible text slots while carrying all intervening
  tool/timeline evidence; an evidence-only output family costs one fallback
  slot. Persist at most the newest forty text slots for every materialized room
  in the owning computer's existing last-good record. A head refresh performs
  one head request and at most its immediate predecessor, adopts authoritative
  overlap, and replaces a stale no-overlap finalized window instead of walking
  an unbounded cursor bridge. Add an explicit combined-transcript-history
  capability to the existing compatibility response: capable runtimes receive
  zero socket history while missing/old capability retains the twenty-message
  socket tail and explicit 404/405 legacy fallback. Keep warm since_seq replay,
  running families, interactions, unread state, pins, search, permalinks,
  deliberate older pages, attachments/voice exclusion, credentials, and
  computer/room isolation unchanged.
assumptions:
  retire:
    - id: historical-transcript-pages-match-output-scoped-rendering
      reason: Raw render units no longer define the twenty-item user-facing page
        budget.
    - id: transcript-history-prepends-one-deliberate-page
      reason: A deliberate page remains one request, but its bound is now twenty text
        slots with attached evidence.
    - id: missed-terminal-history-refreshes-through-combined-head
      reason: Head reconciliation must no longer walk arbitrarily many pages to find
        an overlap.
    - id: hosted-last-good-room-cache-is-bounded-read-only-projection
      reason: The cache expands from one twenty-unit active room to isolated
        forty-text-slot snapshots for each materialized room.
    - id: combined-history-supports-bounded-legacy-host-fallback
      reason: Legacy socket hydration must be selected before connection by an
        explicit compatibility capability, not discovered after duplicate
        hydration.
    - id: hosted-background-rooms-hydrate-metadata-until-promoted
      reason: Capable runtimes keep every finalized-history socket budget at zero;
        only old runtimes retain twenty-message promotion.
    - id: inactive-history-evidence-warms-captured-store
      reason: Successful inactive warming now also feeds the owning room's bounded
        persisted cache and may fetch one predecessor.
    - id: actionable-interactions-remain-support-owned-outside-history
      reason: Interaction rows still cost zero, but the governed budget is now text
        slots rather than raw units.
    - id: combined-head-adopts-authoritative-overlap-order
      reason: Authoritative overlap remains, but no-overlap now replaces stale
        finalized membership after at most two pages.
    - id: cached-transcript-head-stays-stale-until-revalidated
      reason: Each cached room now owns its own bounded two-page revalidation state.
    - id: selected-room-activation-reconciles-destination-history
      reason: Activation preserves readable cache on failure but intentionally
        replaces a stale no-overlap finalized window.
  create:
    - id: historical-transcript-pages-budget-text-slots
      title: Finalized transcript pages budget visible text and attach evidence
      statement: >
        An authenticated combined-history page must bind its opaque cursor to
        the room and immutable newest-message ceiling, establish the complete
        existing output-scoped/legacy chronology, and select at most twenty
        visible text slots. Ordinary/deleted message rows, prose blocks, visible
        settled tails, and one complete evidence-only output family each cost
        one slot; tool call/results and timeline evidence attached between
        selected text boundaries cost zero and remain complete, so a text
        response with fifty tools returns the text plus all fifty tools.
        Reasoning and actionable interaction rows remain excluded, running or
        queued families remain live-owned, valid pairs and prose boundaries are
        never split, and cursor walks return every selected unit exactly once.
      reason: Tool-heavy answers must not crowd all readable text out of a bounded
        page.
      depends_on:
        - run-journals-own-evidence-across-output-messages
        - continuation-writer-follows-journaled-output-ownership
        - permalink-ids-stable
        - redaction-before-fanout
        - compaction-timeline-items-are-durable-run-evidence
        - run-events-merge-by-journal-index
        - normalized-run-item-payload-contract
        - prose-blocks-carry-first-delta-timestamps
    - id: transcript-history-prepends-one-text-slot-page
      title: One deliberate top reach prepends one text-slot page
      statement: >
        The mounted transcript requests one active-room combined page initially
        and one opaque-cursor page per deliberate top reach; each page contains
        at most twenty text slots plus complete associated evidence. Requests
        remain source-store/room/cursor deduplicated, stable unit DOM identity
        preserves the first pre-existing visible unit offset across an
        intra-message boundary, and the top latch rearms only after the reader
        leaves and deliberately returns, so one gesture never drains history.
      reason: Text-slot pages keep tool-heavy history readable without changing
        operator-driven pagination.
      depends_on:
        - historical-transcript-pages-budget-text-slots
        - permalink-ids-stable
    - id: combined-head-reconciliation-is-two-page-bounded
      title: Combined-head reconciliation is bounded to a head and predecessor
      statement: >
        Every initialization, activation, resume, settlement, or background
        warming signal deduplicates by captured source store and room and may
        request only the newest combined page plus at most its immediate
        predecessor. A stable overlap preserves the established older prefix and
        adopts the response's exact suffix; no overlap, including an honestly
        empty head, replaces stale finalized membership instead of walking
        further cursors. Failures keep rendered history readable and retryable,
        newer live rows remain room-owned, and finalized runs never fall back to
        full journal requests.
      reason: A week-old cache must cause at most two bounded history requests rather
        than an archive walk.
      depends_on:
        - historical-transcript-pages-budget-text-slots
        - finalized-browser-history-is-combined-page-owned
        - run-events-merge-by-journal-index
        - client-syncs-by-seq
    - id: hosted-last-good-history-cache-is-per-room-and-bounded
      title: Hosted last-good history caches forty text slots per room
      statement: >
        Each hosted computer may persist one dedicated IndexedDB record holding
        isolated snapshots for its materialized rooms, each capped at the newest
        forty text slots plus complete selected message context and indexed
        evidence and the predecessor cursor needed for deliberate older loading.
        The record may render the remembered room and later selected cached
        rooms immediately but starts disconnected/read-only, strips drafts,
        credentials, keys, attachments, voice, inbox, interactions, mutable
        runs, and full journals, updates after authenticated head or inactive
        warming success, and is deleted only for the addressed computer on
        forget or with every Codor database on unpair.
      reason: Every recently materialized channel should reopen instantly without
        creating a second cache architecture.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
        - historical-transcript-pages-budget-text-slots
        - combined-head-reconciliation-is-two-page-bounded
        - relay-app-socket-readiness-requires-server-evidence
    - id: combined-history-capability-gates-socket-fallback
      title: Runtime capability gates finalized socket history and legacy fallback
      statement: >
        The authenticated compatibility response explicitly declares combined
        transcript-history support. Direct and hosted browsers must capture the
        capability for the exact runtime/computer before creating its socket:
        true sends hydrate_limit zero for cold selected, desired, and background
        rooms so REST pages exclusively own finalized history; missing or false
        retains the existing twenty-message selected-room socket hydration and
        explicit 404/405 legacy transcript fallback. Warm since_seq recovery,
        metadata/support hydration, live runs/events, authorization, upgrade
        gating, and direct/relay semantics remain identical, and support is
        never inferred from semver or from a post-hydration endpoint failure.
      reason: New runtimes should not deliver finalized history twice while old
        installed runtimes must remain usable.
      depends_on:
        - finalized-browser-history-is-combined-page-owned
        - addressed-cold-hydration-is-strict-and-legacy-safe
        - hosted-computer-sessions-keep-state-isolated
        - browser-protocol-epoch-blocks-only-stale-browser-ui
    - id: inactive-history-warming-persists-bounded-room-cache
      title: Inactive evidence warms and persists the owning bounded room cache
      statement: >
        A hosted session observes new message or terminal evidence in inactive
        subscribed rooms and coalesces the existing combined-head refresh for
        that captured store, room, token, and tunnel. One trailing refresh may
        follow evidence arriving in flight; each refresh remains bounded to a
        head and optional predecessor, and successful materialization updates
        only that computer-room's forty-text-slot snapshot. No polling, eager
        socket history, new cache, cross-computer state, or activation request
        for an already-warmed room is introduced.
      reason: Per-room last-good state should follow the existing background warmer
        without extra transport machinery.
      depends_on:
        - hosted-app-keeps-all-paired-computers-live
        - hosted-computer-sessions-keep-state-isolated
        - combined-history-capability-gates-socket-fallback
        - hosted-computer-switching-reuses-warm-session
        - finalized-browser-history-is-combined-page-owned
        - combined-head-reconciliation-is-two-page-bounded
    - id: actionable-interactions-do-not-spend-history-text-slots
      title: Actionable interactions remain support-owned and spend no text slots
      statement: >
        Ask and approval rows contribute zero combined-history units and zero
        text slots; recipient-scoped RoomSupport.interactions exclusively owns
        their actionability, pending cards remain inline or detached according
        to current support/cold state, resolved cards disappear immediately and
        after reload, and durable answers and multi-question prompts retain
        their existing behavior.
      reason: Changing the page budget must not resurrect or charge invisible
        interaction rows.
      depends_on:
        - historical-transcript-pages-budget-text-slots
        - finalized-browser-history-is-combined-page-owned
        - room-support-is-bounded-recipient-scoped-state
        - approval-answer-is-atomic-and-chatless
        - addressed-cold-hydration-is-strict-and-legacy-safe
    - id: bounded-combined-head-adopts-authoritative-window
      title: Bounded combined heads adopt authoritative overlap or replace staleness
      statement: >
        A successful at-most-two-page head reconciliation deduplicates by stable
        unit identity and adopts the server's exact order throughout its window.
        A stable overlap retains only the already-loaded older prefix outside
        that window; no overlap replaces stale finalized membership, while live
        room records not represented by pages remain available. Finalized
        families and interjections therefore keep server chronology without
        gaps, duplicates, local receipt-time fallback, or an unbounded bridge.
      reason: Authoritative ordering must remain correct under the new bounded
        no-overlap rule.
      depends_on:
        - historical-transcript-pages-budget-text-slots
        - transcript-history-cursors-cover-complete-established-order
        - finalized-browser-history-is-combined-page-owned
        - combined-head-reconciliation-is-two-page-bounded
        - live-runs-settle-beside-paged-history-once
        - continuation-writer-follows-journaled-output-ownership
        - permalink-ids-stable
    - id: cached-room-history-stays-stale-until-bounded-revalidation
      title: Each cached room stays stale until bounded authenticated revalidation
      statement: >
        Every restored hosted room snapshot may render read-only while
        disconnected but remains marked for revalidation until the owning
        computer's current authenticated tunnel successfully completes its
        bounded head/predecessor refresh. Signals deduplicate against the exact
        store, room, token, and transport; failure remains retryable and keeps
        cached/live content readable, while success adopts overlap or replaces a
        stale no-overlap finalized window without importing another computer.
      reason: Expanding the cache to many rooms must preserve explicit freshness and
        isolation.
      depends_on:
        - hosted-last-good-history-cache-is-per-room-and-bounded
        - combined-head-reconciliation-is-two-page-bounded
        - hosted-computer-sessions-keep-state-isolated
        - hosted-app-streams-follow-tunnel-generations
    - id: selected-room-activation-uses-bounded-destination-reconciliation
      title: Selected rooms use bounded destination-owned history reconciliation
      statement: >
        When a room becomes selected, the browser waits for that exact room's
        current connector evidence and starts one nonblocking source-store/
        room-deduplicated bounded head refresh with its captured credential.
        Missed terminal evidence appears without reload, reconnect, socket
        replacement, cross-computer writes, or duplicate subscription; failure
        preserves readable cached/live truth and remains retryable, while a
        successful no-overlap response may replace only stale finalized
        membership.
      reason: Activation must retain its destination ownership while adopting the
        bounded stale-cache rule.
      depends_on:
        - combined-head-reconciliation-is-two-page-bounded
        - managed-computer-activation-revalidates-destination-history
        - finalized-browser-history-is-combined-page-owned
        - hosted-computer-sessions-keep-state-isolated
        - worktree-conversation-status-is-live-and-independent
  reviewed:
