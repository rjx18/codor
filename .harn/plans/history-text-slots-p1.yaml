    - id: managed-computer-activation-revalidates-destination-history
      outcome: unchanged
      reason: Computer activation still captures and refreshes only the destination
        store, room, token, and transport.
    - id: combined-history-sync-classifies-bounded-cold-only
      outcome: unchanged
      reason: Warm sync remains live reconciliation and only restored bounded
        snapshots are classified as cold.
    - id: transcript-targets-walk-combined-pages
      outcome: unchanged
      reason: Explicit search, pin, inbox, permalink, and held-target walks may still
        request as many deliberate cursor pages as needed.
    - id: transcript-history-failures-are-bounded-and-actionable
      outcome: unchanged
      reason: Noncompatibility failures remain visible, retryable, and never become
        honest empty state.
    - id: addressed-cold-hydration-is-strict-and-legacy-safe
      outcome: unchanged
      reason: Server hydrate_limit semantics stay identical; the new capability only
        selects zero versus twenty at the client.
    - id: browser-protocol-epoch-blocks-only-stale-browser-ui
      outcome: unchanged
      reason: The optional additive capability does not change compatibility admission
        or upgrade gating.
    - id: live-runs-settle-beside-paged-history-once
      outcome: unchanged
      reason: Running families remain live/unbounded and settle into combined-page
        ownership once.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: Capability, requests, cache windows, tokens, stores, and same-named
        rooms remain computer-local.
    - id: hosted-app-streams-follow-tunnel-generations
      outcome: unchanged
      reason: Capability lookup uses the existing generation-bounded transport before
        creating the same one app socket.
    - id: relay-app-socket-readiness-requires-server-evidence
      outcome: unchanged
      reason: Zero finalized rows do not make a socket live; addressed sync_complete
        remains readiness proof.
    - id: readable-reconnecting-room-never-admits-mutation
      outcome: unchanged
      reason: Multi-room cached content remains disconnected/read-only and mutation
        admission is unchanged.
    - id: hosted-explicit-room-survives-cached-bootstrap
      outcome: unchanged
      reason: The remembered public room still seeds cached bootstrap without
        overriding explicit navigation intent.
    - id: active-run-segments-follow-established-transcript-time
      outcome: unchanged
      reason: Mutable run segments remain socket/live owned and use the same
        chronology before settlement.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: The authenticated REST regression crosses the existing role-matrix
        integration span; no role, principal, authorization, or mutation
        behavior changes.
