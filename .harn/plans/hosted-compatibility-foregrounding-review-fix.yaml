id: hosted-compatibility-foregrounding-review-fix
title: Keep watchdog probes refresh-neutral and preserve direct foreground recovery
notes: >
  Correct the hosted foregrounding seam without changing its approved recovery
  contract. Periodic list_rooms watchdog replies are liveness/reconciliation
  evidence only and must not refresh history or journals through onResume. A
  real hosted foreground transition may coalesce onto an already outstanding
  watchdog probe and consume its reply exactly once. Direct connectors retain
  their previous foreground replacement behavior; only hosted sessions probe a
  healthy socket before deciding whether to recover. No history, protocol,
  release, deployment, or other connector behavior is in scope.
assumptions:
  create:
    - id: foreground-watchdog-probes-are-refresh-neutral
      title: Periodic foreground watchdog probes do not impersonate foreground resumes
      statement: >
        A periodic visible list_rooms watchdog probe must remain
        refresh-neutral: its timely reply may reconcile liveness but must not
        invoke onResume or trigger foreground history/journal refreshes. If a
        real hosted foreground transition arrives while that probe is in flight,
        the same reply invokes onResume exactly once; direct connectors retain
        their prior replacement behavior instead of using the hosted health
        probe.
      reason: >
        Treating every heartbeat as a foreground transition causes unbounded
        transcript and mutable-journal refreshes, while treating a concurrent
        wake as an unrelated second probe can duplicate recovery work.
      depends_on:
        - hosted-foregrounding-reuses-healthy-sessions
        - hosted-app-streams-follow-tunnel-generations
  reviewed:
    - id: hosted-foregrounding-reuses-healthy-sessions
      outcome: unchanged
      reason: >
        Hosted foregrounding still probes a healthy tunnel/app socket and
        recovers one coalesced dead generation; this correction separates the
        user-driven foreground reason from periodic watchdog traffic.
    - id: hosted-app-streams-follow-tunnel-generations
      outcome: unchanged
      reason: >
        Generation ownership, tunnel waits, parks, and replacement behavior are
        unchanged; only the reason attached to a hosted health reply is fixed.
    - id: browser-tunnel-readiness-follows-current-generation
      outcome: unchanged
      reason: |
        Tunnel readiness and generation/waiter semantics remain unchanged.
    - id: relay-app-socket-readiness-requires-server-evidence
      outcome: unchanged
      reason: >
        Current-generation server evidence still controls connected/send
        admission; this change only controls foreground refresh ownership.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: >
        Probe intent and callbacks remain connector/session-local, preserving
        per-computer state isolation.
