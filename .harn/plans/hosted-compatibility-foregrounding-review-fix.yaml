anchors:
  foreground-watchdog-probes-are-refresh-neutral:
    watchdog-probe-state:
      action: change
      reason: Track whether a list_rooms probe came from a real hosted foreground
        transition.
    watchdog-probe-reply:
      action: change
      reason: Consume a coalesced foreground intent exactly once on the matching rooms
        reply.
    watchdog-probe-regression:
      action: change
      reason: Cover refresh-neutral watchdogs, direct replacement, and foreground
        coalescing.
  hosted-foregrounding-reuses-healthy-sessions:
    foreground-health-probe:
      action: change
      reason: Preserve direct resume/replacement while using health probing only for
        hosted foregrounds.
    foreground-health-unit-regression:
      action: change
      reason: Keep the healthy hosted probe regression and add direct-mode coverage.
