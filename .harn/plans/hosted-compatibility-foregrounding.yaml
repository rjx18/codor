anchors:
  combined-history-supports-bounded-legacy-host-fallback:
    history-unsupported-status:
      action: change
      reason: Classify only combined-history 404/405 responses as unsupported.
    history-legacy-fallback-materializer:
      action: change
      reason: Mark the room ready for its already-hydrated legacy transcript without
        importing legacy rows into finalized history.
    history-legacy-fallback-regression:
      action: change
      reason: Prove old-host 404 fallback retains legacy rows and old journal reads in
        one room.
  transcript-history-failures-are-bounded-and-actionable:
    history-failure-state:
      action: change
      reason: Preserve a retryable failure state for non-compatibility errors.
    history-failure-regression:
      action: change
      reason: Prove auth/server failures do not fall back and expose a bounded
        retry/update-required state.
  hosted-foregrounding-reuses-healthy-sessions:
    foreground-health-probe:
      action: change
      reason: Probe a connected visible session before replacing it and coalesce only
        genuine failures.
    foreground-health-unit-regression:
      action: change
      reason: Prove healthy hide/show sends list_rooms without a new socket and a dead
        socket recovers once.
    foreground-health-browser-regression:
      action: change
      reason: Prove healthy hosted foregrounding keeps one app stream and a dead
        foregrounded connection recovers once.
  finalized-browser-history-is-combined-page-owned:
    combined-history-api-client:
      action: change
      reason: Add the bounded unsupported-status classification at the
        combined-history client boundary.
    combined-history-materializer:
      action: change
      reason: Keep current-host page materialization intact while recording the
        explicit legacy compatibility state.
    combined-history-rendering:
      action: change
      reason: Render legacy hydrated rows only for the explicit compatibility state
        and show errors otherwise.
    combined-history-browser-regression:
      action: change
      reason: Exercise old-host and non-compatibility history outcomes in the browser.
  missed-terminal-history-refreshes-through-combined-head:
    combined-history-head-refresh:
      action: change
      reason: Do not repeat an endpoint request after the room has entered explicit
        legacy fallback.
  hosted-app-streams-follow-tunnel-generations:
    generation-gated-connector-regression:
      action: change
      reason: Update foreground recovery coverage to distinguish healthy probes from
        real generation failure.
