anchors:
  hosted-managed-bootstrap-reacts-to-late-readiness:
    reactive-managed-bootstrap:
      action: change
      reason: Mount a subscribed hosted shell and consume manager-owned bootstrap truth without duplicate requests.
    reactive-managed-bootstrap-regression:
      action: change
      reason: Prove late readiness enters the same document and direct boot keeps its prior requests.
  hosted-bootstrap-requests-are-abortable-and-generation-bounded:
    abortable-tunnel-fetch:
      action: change
      reason: Bind abort to one mux stream and settle exactly once.
    bounded-managed-bootstrap-attempt:
      action: change
      reason: Deadline authentication and summary loading and retire only the timed-out generation.
    bounded-managed-bootstrap-regression:
      action: change
      reason: Cover stalled auth/summary, cleanup, retry, and independent computers.
  hosted-background-rooms-hydrate-metadata-until-promoted:
    zero-history-subscribe-protocol:
      action: change
      reason: Admit explicit zero while preserving omitted/default and positive limits.
    zero-history-server-hydration:
      action: change
      reason: Emit full metadata/support/cursor completion with no historical tail.
    background-room-promotion:
      action: change
      reason: Subscribe background rooms at zero and promote selected/desired rooms once at twenty.
    background-room-promotion-regression:
      action: change
      reason: Prove payload bounds, live aggregates, one promotion, and isolation.
  hosted-last-good-room-cache-is-bounded-read-only-projection:
    hosted-last-good-room-store:
      action: change
      reason: Add bounded per-computer IndexedDB projection validation, write, read, and purge.
    hosted-last-good-room-lifecycle:
      action: change
      reason: Hydrate before live startup, persist only authenticated materialization, reconcile, forget, and unpair.
    hosted-last-good-room-regression:
      action: change
      reason: Prove bounds, forbidden fields, same-room isolation, cached reload, replacement, and purge.
  readable-reconnecting-room-never-admits-mutation:
    nonmodal-reconnecting-surface:
      action: change
      reason: Keep renderable content interactive for reads while disabling every mutation until server evidence.
    nonmodal-reconnecting-regression:
      action: change
      reason: Prove retained and cached content, draft/scroll preservation, disabled actions, and terminal fallback.
  transcript-tail-follow-has-one-prepaint-owner:
    transcript-prepaint-geometry:
      action: change
      reason: Consolidate content and viewport resize correction before paint for pinned and anchored readers.
    transcript-prepaint-geometry-regression:
      action: change
      reason: Sample live batches and composer resize frame-by-frame while retaining prepend and gap behavior.
  hosted-app-keeps-all-paired-computers-live:
    computer-session-lifecycle:
      action: change
      reason: Publish late active readiness and hydrate/persist each entry's bounded local fallback without stopping peers.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Scope deadlines, background hydration state, and last-good snapshots to the owning computer.
  hosted-computer-switching-reuses-warm-session:
    warm-computer-activation:
      action: change
      reason: Render cached or newly ready active entries in place while retaining warm switching.
  hosted-offline-recovery-offers-other-computers:
    multi-computer-recovery-exit:
      action: change
      reason: Replace modal recovery only when renderable content exists and keep warm alternatives available.
  hosted-background-computer-activity-is-visible:
    background-computer-summary:
      action: change
      reason: Derive live aggregates from zero-history background subscriptions.
  hosted-app-streams-follow-tunnel-generations:
    generation-aware-computer-session:
      action: change
      reason: Retire timed-out bootstrap work with the owning tunnel generation.
    generation-gated-app-connector:
      action: change
      reason: Preserve exactly one app stream while changing room hydration budgets.
  browser-tunnel-readiness-follows-current-generation:
    current-tunnel-generation:
      action: change
      reason: Add request-timeout retirement without reusing stale readiness.
    idempotent-tunnel-recovery:
      action: change
      reason: Coalesce deadline recovery with existing retry/foreground recovery.
  tunnel-stream-mux:
    browser-tunnel-client:
      action: change
      reason: Reset an aborted request stream without altering sibling mux semantics.
  addressed-cold-hydration-is-strict-and-legacy-safe:
    addressed-cold-hydration-server:
      action: change
      reason: Make N=0 an exact empty historical tail with the same snapshot metadata.
  multiplexed-subscriptions-identify-their-room:
    room-addressed-frame-contract:
      action: change
      reason: Permit the explicit zero hydration value in the addressed subscribe schema.
    room-addressed-hydration:
      action: change
      reason: Preserve addressed attribution for zero-history metadata/support frames.
  sync-cursor-commits-after-hydration:
    sync-complete-frame:
      action: change
      reason: Cover the zero-history subscription shape without changing cursor commit order.
  relay-app-socket-readiness-requires-server-evidence:
    relay-app-socket-readiness:
      action: change
      reason: Keep cached and retained rooms disconnected until current server evidence.
  finalized-browser-history-is-combined-page-owned:
    combined-history-store:
      action: change
      reason: Export only the bounded materialized projection needed for last-good persistence.
    combined-history-materializer:
      action: change
      reason: Trigger cache replacement only after successful authenticated head materialization.
  transcript-history-prepends-one-deliberate-page:
    deliberate-history-page-controller:
      action: change
      reason: Coordinate the existing prepend anchor with the single geometry owner.
  agent-activity-bar-keeps-a-visible-gap-above-the-composer:
    activity-gap-geometry:
      action: change
      reason: Preserve the measured gap under the consolidated resize owner.
