id: hosted-relay-smooth-startup-r2-review-fixes
title: Make the official updater durable-rooted, bounded, identity-safe, and fully transactional
notes: >
  Contained R2 review correction only. Preserve the accepted updater, platform
  service, authentication, data-preservation, and no-onboarding behavior while
  fixing six material boundaries. An invoking source-linked launcher, npx
  candidate, or packaged CLI may update an already-existing durable runtime;
  source guidance applies only when no durable installation exists. Resolve and
  acquire the exact stable candidate only through the official npm registry,
  reject downgrades, execute npm's JavaScript entrypoint with Node on Windows,
  and bound lookup, acquisition, and candidate execution with actionable
  diagnostics.

  Thread the exact selected data root through the private candidate handoff and
  every durable/runtime/service path. Normal setup and update must prove the
  selected version and generation before marking the service reusable; an old
  generic-health responder cannot satisfy that proof. Update must snapshot the
  exact prior unit/env, plist, or Windows task/script bytes and existence, then
  either commit the candidate after authenticated identity proof or restore
  those artifacts and the prior runtime before reconvergence. A restored legacy
  daemon without the private identity endpoint may be reported only as
  generically healthy and unverified.

  Document and prove the one-time first-update bootstrap through
  `npx --yes --package=@richhardry/codor@latest codor update`, after which the
  durable launcher contains plain `codor update`. Do not update a real host,
  touch R1/R3, alter archive behavior, weaken authentication/redaction, or add
  background updates, alternate registries, onboarding, pairing, push, relay,
  account, or UI work.
assumptions:
  retire:
    - id: official-codor-update-acquires-one-exact-stable-candidate
      reason: >
        The packaged-only/source-refusal statement is false for Richard's
        source-linked launcher and omits official-registry pinning, downgrade
        refusal, Windows shell-free npm resolution, bounded child execution,
        and the one-time npx bootstrap.
    - id: runtime-update-is-transactional-through-service-readiness
      reason: >
        Runtime-file rollback alone is not the complete transaction: the exact
        selected data root and prior platform service artifacts must participate,
        and a legacy restored daemon cannot be falsely identity-verified.
    - id: setup-restarts-resident-runtime-before-readiness
      reason: >
        Restart ordering is necessary but generic health is insufficient; setup
        may become reusable only after the selected version and generation pass
        the authenticated identity proof.
  create:
    - id: official-codor-update-is-bounded-cross-platform-and-durable-rooted
      title: Codor update selects one bounded official candidate for an existing durable runtime
      statement: >
        When the selected data root contains a durable Codor runtime, `codor
        update` may be invoked by its launcher, a source-linked CLI, or the
        official npx candidate without mutating the invoking checkout; it must
        resolve @richhardry/codor latest and acquire the resulting exact stable
        non-prerelease version only through https://registry.npmjs.org, never
        downgrade a newer installed semantic version, invoke npm without a
        shell (using Node plus npm's JavaScript entrypoint on Windows), bound
        registry lookup, acquisition, and candidate-child execution with direct
        timeout diagnostics, and execute only the acquired candidate against
        the exact selected data root. If no durable runtime exists, a source
        invocation gives Git/build guidance and a packaged invocation gives
        install guidance; arbitrary sources, prereleases, background updates,
        onboarding, and pairing minting remain forbidden. The first release
        that introduces update must be invokable once as `npx --yes
        --package=@richhardry/codor@latest codor update`, after which the durable
        launcher provides plain `codor update`.
      reason: >
        The supported update journey must work on the installed XPS topology,
        stay pinned to official immutable bytes on every platform, never move
        backwards, and fail within an operator-visible bound.
      depends_on:
        - github-tags-publish-one-immutable-alpha-or-stable-release
        - setup-resolves-complete-invoking-runtime
        - public-package-bundles-complete-codor-runtime
    - id: runtime-update-transacts-runtime-service-and-selected-data-root
      title: Update commits the selected data root only after runtime and service identity are ready
      statement: >
        The acquired candidate must carry the exact public `--data-dir` into its
        private application, use that root for durable runtime detection,
        staging, service rendering, and readiness, retain the prior runtime and
        exact platform service-definition/config bytes and existence across the
        swap, and delete those rollback assets only after the owner-authenticated
        status reports the candidate version and generation. Any staging,
        restart, readiness, timeout, or identity failure must restore the exact
        prior runtime and Linux unit/env, macOS plist, or Windows task/script
        artifacts before reconverging that prior service, while leaving every
        other data/config/log byte and the default data root untouched. A prior
        identity-capable daemon may be version-verified; a legacy daemon without
        the identity endpoint may be accepted only after bounded generic health
        and reported explicitly as healthy but identity-unverified.
      reason: >
        A runtime-only rollback can strand a prior binary behind candidate
        service configuration, while dropping the chosen data root can mutate
        the wrong installation.
      depends_on:
        - official-codor-update-is-bounded-cross-platform-and-durable-rooted
        - setup-installs-durable-per-user-runtime-atomically
        - setup-preserves-private-platform-service
        - service-runtime-status-is-owner-authenticated
    - id: setup-proves-selected-runtime-before-reuse
      title: Setup reuses a service only after the selected identity has passed
      statement: >
        On the first real Start attempt, Linux, macOS, and Windows must replace
        the resident service generation using the selected runtime, wait for
        generic Codor readiness, and then require the owner-authenticated runtime
        status to equal that run's expected version and generation before the
        step is marked successful or reusable. Linux reloads/enables then
        restarts, Windows ends before recreating/running, and macOS confirms old
        target absence and waits through a loaded-but-booting target without
        kickstart; a failed restart or stale healthy daemon leaves the run
        unverified so Retry performs convergence again, while Retry after a
        completed identity proof does not restart and durable user state remains
        untouched.
      reason: >
        Generic health can come from the old process, so it cannot authorize a
        successful or reusable setup generation.
      depends_on:
        - setup-preserves-private-platform-service
        - setup-verifies-codor-before-creating-pairing-code
        - setup-macos-launchd-confirms-loaded-and-healthy
        - service-runtime-status-is-owner-authenticated
  reviewed:
    - id: github-tags-publish-one-immutable-alpha-or-stable-release
      outcome: unchanged
      reason: Stable publication remains one immutable exact npm release; update pins its consumer to the official registry.
    - id: setup-resolves-complete-invoking-runtime
      outcome: unchanged
      reason: Runtime layout detection remains authoritative; invoking layout no longer overrides an existing durable target.
    - id: setup-installs-durable-per-user-runtime-atomically
      outcome: unchanged
      reason: The existing staged copy and atomic runtime swap remain the runtime transaction primitive.
    - id: setup-preserves-private-platform-service
      outcome: unchanged
      reason: The same private user services, absolute paths, permissions, token, and harness environment remain.
    - id: setup-verifies-codor-before-creating-pairing-code
      outcome: unchanged
      reason: The existing generic Codor readiness and pairing gate remains, with selected identity added before reuse.
    - id: setup-macos-launchd-confirms-loaded-and-healthy
      outcome: unchanged
      reason: launchd validation and bounded loaded/healthy recovery remain unchanged while identity proof follows readiness.
    - id: windows-setup-installs-private-task-service
      outcome: unchanged
      reason: Windows retains the private least-privilege scheduled task and exact service script contract.
    - id: service-runtime-status-is-owner-authenticated
      outcome: unchanged
      reason: The existing no-store owner-only projection remains the sole positive identity proof.
    - id: setup-readiness-wait-is-wall-clock-bounded
      outcome: unchanged
      reason: Generic readiness retains the same monotonic sixty-second budget and diagnostics.
    - id: platform-services-propagate-destination-pnpm-node-path
      outcome: unchanged
      reason: PATH and NODE_PATH remain destination-rooted across update, rollback, and normal setup.
    - id: setup-installs-user-launcher-shim
      outcome: unchanged
      reason: The same stable launcher path is installed; only its update eligibility is corrected.
    - id: setup-unattended-mutation-requires-explicit-intent
      outcome: unchanged
      reason: Public update remains the explicit mutation command and install/setup consent is unchanged.
    - id: management-failures-have-stable-redacted-exits
      outcome: unchanged
      reason: Timeout and update errors remain concise/redacted without changing management exit behavior.
    - id: channel-archive-requires-explicit-confirmation
      outcome: unchanged
      reason: Monolithic index regression edits must not change archive confirmation, --yes, TTY/JSON, stdout, or refusal semantics.
    - id: public-npx-install-is-primary-install
      outcome: unchanged
      reason: npx install remains primary installation; the new npx update command is only the first-update bootstrap.
    - id: public-package-readme-renders-on-npm
      outcome: unchanged
      reason: The staged npm README retains public branding and primary install guidance while adding truthful update bootstrap copy.
    - id: public-package-bundles-complete-codor-runtime
      outcome: unchanged
      reason: The existing artifact closure and bin remain complete; packed coverage proves that bin exposes update.
    - id: packed-release-proof-runs-install-runtime
      outcome: unchanged
      reason: The clean packed proof keeps all install/runtime checks and adds the candidate update entrypoint.
    - id: packed-local-tgz-npx-proof-runs-fresh-default-audit
      outcome: unchanged
      reason: The same fresh npx cache and default audit path also dispatch the packed update command help.
    - id: fresh-clone-install-proven-by-script
      outcome: unchanged
      reason: Source checkout upgrade guidance remains explicit and separate from packaged update.
    - id: source-cli-installers-remain-idempotent-fallback
      outcome: unchanged
      reason: Source installers remain contributor fallbacks and are never mutated by update.
