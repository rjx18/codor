verification: >
  Clean-lock this review plan at caf67cf. Run focused update, runtime installer,
  normal setup/retry, Linux, launchd, Windows, artifact, and authenticated status
  coverage; fixtures must cover source-linked and npx durable targets, exact
  custom data-root isolation, official registry args, no downgrade, Windows
  Node/npm JS invocation, lookup/acquisition/candidate timeouts, stale generic
  health, failed-restart retry, exact service-file restoration, identity-capable
  rollback, legacy generic/unverified recovery, and packed candidate dispatch.
  Run complete CLI and switchboard suites, the full serialized workspace tests,
  recursive build, the packed/npx proof, Harn diff/staged/apply gates, and clean
  tree checks. Do not update a real host, touch R1/R3, delegate, monitor, push,
  merge, deploy, publish, release, or begin another phase.
