      reason: Re-anchor the corrected durable-rooted command contract.
    stable-update-acquisition:
      action: remove
      reason: Replace packaged-only ambient acquisition with bounded official cross-platform acquisition.
    stable-update-regression:
      action: remove
      reason: Replace the obsolete source-refusal regression contract.
  runtime-update-is-transactional-through-service-readiness:
    private-update-application:
      action: remove
      reason: Re-anchor private application to the full runtime/service/data-root transaction.
    update-rollback-regression:
      action: remove
      reason: Replace runtime-only rollback regressions.
    durable-runtime-transaction:
      action: remove
      reason: Re-anchor the retained runtime primitive under the complete successor transaction.
    durable-runtime-transaction-regression:
      action: remove
      reason: Re-anchor retained-backup coverage under the complete successor transaction.
  setup-restarts-resident-runtime-before-readiness:
    setup-runtime-convergence:
      action: remove
      reason: Replace generic-health reuse with selected-identity reuse.
    launchd-stateful-convergence:
      action: remove
      reason: Re-anchor unchanged launchd ordering under the stronger identity contract.
    setup-runtime-convergence-regression:
      action: remove
      reason: Replace restart-only regressions with identity/retry regressions.
  official-codor-update-is-bounded-cross-platform-and-durable-rooted:
    stable-update-command:
      action: change
      reason: Thread the exact data root through both public and private update commands.
    stable-update-acquisition:
      action: change
      reason: Allow existing durable targets from any invoking layout, pin the registry, refuse downgrades, resolve Windows npm JS, and bound all children.
    stable-update-regression:
      action: change
      reason: Cover source-linked durable use, missing durable guidance, official registry argv, downgrade refusal, Windows Node/npm, and each timeout.
  runtime-update-transacts-runtime-service-and-selected-data-root:
    private-update-application:
      action: change
      reason: Apply against the selected data root and snapshot/restore exact service artifacts around candidate convergence.
    update-rollback-regression:
      action: change
      reason: Prove non-default-root isolation, exact platform-file restoration, identity-capable rollback, and legacy generic recovery.
    durable-runtime-transaction:
      action: change
      reason: Keep retained runtime backup mechanics tied to the complete update transaction.
    durable-runtime-transaction-regression:
      action: change
      reason: Preserve atomic runtime coverage under the successor transaction.
  setup-proves-selected-runtime-before-reuse:
    setup-runtime-convergence:
      action: change
      reason: Mark serviceStarted only after generic and authenticated identity proof; retry stale or failed starts.
    launchd-stateful-convergence:
      action: change
      reason: Preserve launchd replacement ordering under the selected-identity gate.
    setup-runtime-convergence-regression:
      action: change
      reason: Cover stale generic health, failed restart retry, successful identity reuse, and all platform ordering.
  setup-preserves-private-platform-service:
    setup-platform-service-runtime:
