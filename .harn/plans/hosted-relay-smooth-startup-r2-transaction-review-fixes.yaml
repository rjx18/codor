id: hosted-relay-smooth-startup-r2-transaction-review-fixes
title: Make official updates cooperatively bounded and restore exact Windows and launcher state
notes: >
  Contained R2 review correction only. A parent process must never hard-kill the
  private candidate after runtime or service mutation; the acquired candidate
  owns a cooperative deadline inside the existing rollback transaction, and
  rollback itself retains a bounded recovery allowance. On Windows, quiesce an
  existing scheduled task before any durable-runtime swap in official update
  and normal setup/reinstall, restart the untouched task when pre-commit work
  fails, and snapshot/restore the registered task's exact existence and XML as
  well as local service files. A failed update must also restore any POSIX
  launcher or macOS profile bytes changed before verification.

  Extend the packed local-TGZ proof through the real public npx update command,
  exact candidate acquisition, private application, service generation, and
  previous-runtime convergence. Keep the platform claim truthful: the first
  official bootstrap uses npx everywhere; the durable launcher provides plain
  `codor update` on POSIX, while Windows continues to use the exact npx command
  until a separately approved persistent Windows launcher exists. Preserve R1,
  R3, real hosts, tokens, pairings, channels, worktrees, presets, roster,
  agents, logs, authentication, redaction, and existing setup consent.
assumptions:
  retire:
    - id: official-codor-update-is-bounded-cross-platform-and-durable-rooted
      reason: >
        A parent spawn timeout can kill the mutation-owning child outside its
        rollback transaction, and the statement incorrectly promises a plain
        durable launcher on Windows where setup installs none.
    - id: runtime-update-transacts-runtime-service-and-selected-data-root
      reason: >
        Exact service files are insufficient on Windows because the registered
        task is separate state, and failed verification can also leave a changed
        POSIX launcher or macOS profile behind.
  create:
    - id: official-codor-update-is-cooperatively-bounded-and-platform-truthful
      title: Codor update is officially acquired and bounded inside its mutation transaction
      statement: >
        When the selected data root contains a durable Codor runtime, `codor
        update` may be invoked by its POSIX launcher, a source-linked CLI, or the
        official npx candidate without mutating the invoking checkout. It must
        resolve @richhardry/codor latest and acquire that exact stable
        non-prerelease version only through https://registry.npmjs.org, never
        downgrade, invoke npm without a shell, and bound lookup and acquisition
        before mutation. Candidate application carries a deadline into the
        private transaction; the parent must not hard-kill a mutation-owning
        child, and expiry after staging or swap must run complete bounded
        rollback before failure is returned. The first official bootstrap is
        `npx --yes --package=@richhardry/codor@latest codor update` on every
        platform. Afterward POSIX has plain `codor update` through its durable
        launcher; Windows continues to use that exact npx command because setup
        does not install a persistent Windows launcher. Arbitrary sources,
        prereleases, background updates, onboarding, and pairing minting remain
        forbidden.
      reason: >
        Time bounds cannot weaken transaction safety, and operator guidance must
        describe the launcher actually installed on each platform.
      depends_on:
        - github-tags-publish-one-immutable-alpha-or-stable-release
        - setup-resolves-complete-invoking-runtime
        - public-package-bundles-complete-codor-runtime
    - id: windows-runtime-swap-requires-task-quiescence
      title: Windows quiesces and exactly restores its registered service before runtime swaps
      statement: >
        Before setup, reinstall, or official update moves a durable Windows
        runtime, Codor must query and snapshot whether the private scheduled task
        exists and its exact exported XML, then stop it before the first swap.
        If acquisition, staging, or swap fails before a candidate service is
        committed, the untouched prior task is restarted. If later convergence
        fails, rollback restores the prior registered task definition exactly;
        a previously absent task remains absent and is never synthesized from a
        missing local XML file. Native files in use must never be moved while
        the task is running.
      reason: >
        Windows can lock native dependencies, and local task XML is not proof of
        the separately registered Task Scheduler state.
      depends_on:
        - windows-setup-installs-private-task-service
        - setup-installs-durable-per-user-runtime-atomically
    - id: runtime-update-restores-every-mutated-runtime-service-and-launcher-surface
      title: Update commits only after every selected runtime and service surface is verified
      statement: >
        The acquired candidate must carry the exact public data root into private
        application and retain the prior runtime, exact platform service files,
        registered Windows task state, POSIX launcher, and macOS profile bytes
        and existence until owner-authenticated candidate version and generation
        pass. Any staging, swap, restart, readiness, identity, or cooperative
        timeout failure restores every changed surface exactly before bounded
        prior-service recovery, leaves all other data and the default data root
        untouched, and reports incomplete recovery honestly. A prior
        identity-capable daemon may be version-verified; a legacy daemon without
        the identity endpoint may be accepted only as generically healthy and
        explicitly unverified.
      reason: >
        Runtime, service registration, launchers, and shell profile mutations
        form one operator-visible transaction.
      depends_on:
        - official-codor-update-is-cooperatively-bounded-and-platform-truthful
        - windows-runtime-swap-requires-task-quiescence
        - setup-installs-durable-per-user-runtime-atomically
        - setup-preserves-private-platform-service
        - service-runtime-status-is-owner-authenticated
    - id: packed-update-bootstrap-crosses-real-candidate-transaction
      title: Packed npx proof performs a previous-runtime official update transaction
      statement: >
        The clean local-TGZ release proof must invoke the real public `npx --yes
        --package=<packed-candidate> codor update` command against a controlled
        previous durable runtime, exercise official-registry lookup/acquisition,
        the acquired package's private updater, runtime swap, rendered service
        generation, and authenticated readiness, and prove the selected version
        commits without touching a real host. Help-only dispatch is not an update
        proof.
      reason: >
        The one-time bootstrap contract is credible only when the packed public
        entrypoint crosses the complete candidate handoff.
      depends_on:
        - official-codor-update-is-cooperatively-bounded-and-platform-truthful
        - packed-release-proof-runs-install-runtime
        - packed-local-tgz-npx-proof-runs-fresh-default-audit
  reviewed:
    - id: github-tags-publish-one-immutable-alpha-or-stable-release
      outcome: unchanged
      reason: Stable publication remains one immutable exact npm release.
    - id: setup-resolves-complete-invoking-runtime
      outcome: unchanged
      reason: Runtime layout detection remains authoritative.
    - id: public-package-bundles-complete-codor-runtime
      outcome: unchanged
      reason: The packaged runtime and private updater closure remain complete.
    - id: setup-installs-durable-per-user-runtime-atomically
      outcome: unchanged
      reason: Existing staged copy and atomic move mechanics remain the runtime primitive.
    - id: setup-preserves-private-platform-service
      outcome: unchanged
      reason: Private per-user service paths, permissions, token, and environment remain unchanged.
    - id: windows-setup-installs-private-task-service
      outcome: unchanged
      reason: The least-privilege private scheduled task contract remains; only swap ordering and exact restoration are corrected.
    - id: service-runtime-status-is-owner-authenticated
      outcome: unchanged
      reason: Owner-only no-store runtime status remains the positive identity proof.
    - id: setup-proves-selected-runtime-before-reuse
      outcome: unchanged
      reason: Selected version and generation must still pass before reuse.
    - id: setup-readiness-wait-is-wall-clock-bounded
      outcome: unchanged
      reason: Normal setup retains its sixty-second budget; candidate application may pass a smaller remaining transaction budget.
    - id: setup-verifies-codor-before-creating-pairing-code
      outcome: unchanged
      reason: Generic Codor readiness remains mandatory before identity proof and pairing.
    - id: setup-installs-user-launcher-shim
      outcome: unchanged
      reason: POSIX keeps the deterministic durable launcher; rollback now restores its prior state.
    - id: setup-macos-ensures-local-bin-on-path
      outcome: unchanged
      reason: The idempotent marked zprofile block remains, with exact rollback on failed update.
    - id: setup-unattended-mutation-requires-explicit-intent
      outcome: unchanged
      reason: Update remains explicit and setup consent remains unchanged.
    - id: setup-dry-run-reports-without-mutation-or-secret
      outcome: unchanged
      reason: Dry-run output and zero-mutation behavior remain unchanged.
    - id: platform-services-propagate-destination-pnpm-node-path
      outcome: unchanged
      reason: Destination NODE_PATH derivation and service emission remain unchanged.
    - id: public-npx-install-is-primary-install
      outcome: unchanged
      reason: npx remains the primary install and the truthful official update bootstrap.
    - id: packed-release-proof-runs-install-runtime
      outcome: unchanged
      reason: Existing packed install/runtime checks remain and gain a real update journey.
    - id: packed-local-tgz-npx-proof-runs-fresh-default-audit
      outcome: unchanged
      reason: Fresh audited npx behavior remains while the packed command now performs a transaction.
    - id: fresh-clone-install-proven-by-script
      outcome: unchanged
      reason: Source Git rebuild guidance remains separate from official packaged update.
    - id: source-cli-installers-remain-idempotent-fallback
      outcome: unchanged
      reason: Source installers remain contributor fallbacks and are never mutated by update.
