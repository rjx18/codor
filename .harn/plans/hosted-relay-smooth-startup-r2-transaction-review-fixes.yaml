verification: >
  Lock cleanly at 5354503. Cover a cooperative timeout after runtime/service
  mutation with exact rollback; Windows move refusal while the task runs;
  pre-swap failure restarting an untouched task; exact registered-task XML
  restoration and prior-absence preservation; failed source-linked POSIX
  launcher and macOS profile restoration; normal setup/reinstall ordering; and
  a packed local-TGZ previous-runtime journey through the public npx command,
  official acquisition, private candidate application, selected generation,
  and authenticated readiness. Run focused updater, runtime installer, setup,
  platform, launcher, and status tests; complete CLI and switchboard suites; full
  serialized workspace tests; recursive build; packed/npx proof; Harn check,
  staged check, apply; git diff --check; and clean-tree checks. Do not touch
  R1/R3, update a real host, delegate, monitor, push, merge, deploy, publish,
  release, or begin another phase.
