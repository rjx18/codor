    empty-roster-choice-regression:
      action: change
      reason: Prove empty guidance copy and selected nonempty state invalidation when
        refresh returns an empty authoritative roster.
    empty-roster-browser-regression:
      action: keep
      reason: Existing mounted empty-roster browser coverage remains unchanged.
    empty-roster-onboarding-regression:
      action: keep
      reason: Existing no-default_roster first-channel request coverage remains intact.
  empty-roster-guidance-reuses-mounted-settings:
    mounted-empty-roster-settings-route:
      action: keep
      reason: Mounted guidance continues to open the existing Settings route in place.
    hosted-empty-roster-routing-regression:
      action: keep
      reason: Hosted active-computer routing and no-reconnect coverage remain
        unchanged.
  empty-roster-refresh-clears-selection-before-action:
    empty-roster-refresh-synchronous-invalidation:
      action: change
      reason: Run the parent invalidation in a layout effect so it completes before
        browser paint and the next create action.
    empty-roster-refresh-unit-regression:
      action: change
      reason: Unit coverage proves a selected nonempty roster is cleared by an empty
        refresh and the choice no longer renders as selectable.
    empty-roster-refresh-browser-regression:
      action: change
      reason: Browser coverage proves the immediate Create request omits
        default_roster after a selected roster refreshes empty.
