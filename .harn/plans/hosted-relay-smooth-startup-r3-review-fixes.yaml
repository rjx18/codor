id: hosted-relay-smooth-startup-r3-review-fixes
title: R3 review fixes - close roster refresh action race and clarify
  first-channel guidance
notes: "Contained review correction on top of
  dff88d042598b74e839c8687522c0c3d325d5370. Preserve the accepted empty-roster
  contract: an empty authoritative roster is normal unconfigured state, Starting
  agent remains usable, and no create request may claim default_roster while the
  roster is empty. Make the roster refresh invalidation synchronous before paint
  so a selected nonempty roster cannot leave one actionable window after it
  becomes empty. Keep mounted RoomPage guidance linked to the existing Settings
  surface, while first-channel onboarding states explicitly that the first
  channel must be created with Starting agent before Settings can configure
  presets and the Default roster. No server, protocol, transport, session,
  Settings workflow, deployment, or release behavior changes."
assumptions:
  create:
    - id: empty-roster-refresh-clears-selection-before-action
      title: Empty roster refresh clears stale selection before action admission
      statement: When a selected default roster refresh resolves to an empty
        authoritative roster, the create UI must invalidate that selection
        before the next paint and omit default_roster from any immediately
        admitted request, while preserving the Starting agent fallback, because
        a stale selection could otherwise submit a zero-agent roster.
      reason: The roster read resolves in a child choice component while the parent
        owns create admission; the invalidation must close the refresh-time
        stale selection window rather than relying on a later passive effect.
      depends_on:
        - empty-default-roster-is-unconfigured-state
  retire: []
  reviewed:
    - id: empty-default-roster-is-unconfigured-state
      outcome: unchanged
      reason: The fix closes the refresh-time admission race and clarifies onboarding
        copy without changing the empty-roster or default_roster request
        contract.
    - id: empty-roster-settings-guides-saveable-setup
      outcome: unchanged
      reason: Settings setup order and its existing retryable mutations are unchanged.
    - id: empty-roster-guidance-reuses-mounted-settings
      outcome: unchanged
      reason: Mounted guidance still invokes the existing in-app Settings callback;
        only the no-callback first-channel wording is clarified.
    - id: settings-navigation-reuses-live-session
      outcome: unchanged
      reason: No routing, connector, history, or connection behavior changes.
    - id: hosted-computer-switching-reuses-warm-session
      outcome: unchanged
      reason: No computer switching or session lifecycle behavior changes.
files:
  - .harn/plans/hosted-relay-smooth-startup-r3-review-fixes.yaml
  - packages/web-next/src/room/DefaultRosterChoice.tsx
  - packages/web-next/src/room/DefaultRosterChoice.spec.tsx
  - packages/web-next/tests/room38-agent-preset-settings.e2e.spec.ts
