anchors:
  empty-default-roster-is-unconfigured-state:
    empty-roster-choice-and-submit:
      action: change
      reason: Render nonselectable empty-roster guidance and guard both onboarding and
        mounted Create Channel requests from sending default_roster true.
    empty-roster-choice-regression:
      action: change
      reason: Unit coverage proves an empty roster has no selector, retains Starting
        agent/error behavior, and can invoke mounted Settings guidance.
    empty-roster-browser-regression:
      action: change
      reason: Browser coverage proves empty mounted creation remains usable without a
        default-roster request.
    empty-roster-onboarding-regression:
      action: change
      reason: First-channel onboarding coverage proves the empty state never emits the
        default-roster request field.
  empty-roster-settings-guides-saveable-setup:
    empty-roster-settings-render:
      action: change
      reason: Connect the empty roster condition to the conditional setup guide in the
        existing Settings surface.
    empty-roster-settings-guide:
      action: change
      reason: Settings presents the conditional preset/add/save sequence while the
        existing controls and retry paths remain authoritative.
    empty-roster-settings-regression:
      action: change
      reason: Browser coverage proves the create-preset step is present only when no
        presets exist and is skipped when a saved preset already exists.
  empty-roster-guidance-reuses-mounted-settings:
    mounted-empty-roster-settings-route:
      action: change
      reason: Wire mounted Create Channel guidance to RoomPage's existing Settings
        callback and prove the route remains in-app on the live session.
    hosted-empty-roster-routing-regression:
      action: change
      reason: Retain hosted active-computer routing and Settings navigation coverage
        while exercising the new guidance callback.
