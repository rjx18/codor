anchors:
  hosted-support-active-run-transcript-projection:
    support-active-run-transcript-projection:
      action: change
      reason: >
        Project missing running support roots into the live ordered transcript
        while preserving message-map authority and the existing journal/event
        rendering path.
    support-active-run-transcript-unit-regression:
      action: change
      reason: >
        Prove running support-only roots are included, ordinary message records
        win by id, and non-running support rows are not projected.
    hosted-support-active-run-browser-regression:
      action: change
      reason: >
        Exercise a fresh compatible hosted browser with preconnection output, A
        -> B -> A restoration, later append/finalization, exact-once evidence,
        store isolation, and no replacement sockets.
    direct-support-active-run-browser-regression:
      action: change
      reason: >
        Exercise the direct connection parity path with an active support-only
        root while retaining existing journal/live-event and finalization
        behavior.
verification: >
  Run the focused Transcript/store/connector/run-journal units, all web-next
  units, the production/PWA build, the hosted multi-computer and direct browser
  regressions (including the compatible alpha.1-shaped support/frame fixture),
  Harn find/plan check/clean lock/check/apply/staged validation, git diff
  --check, and a final clean-tree check. Do not change protocol, switchboard,
  relay, daemon, pagination, socket, cache, CLI, deployment, or release
  behavior.
