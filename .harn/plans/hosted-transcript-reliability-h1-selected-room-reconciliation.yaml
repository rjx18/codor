  Before implementation, add the room-switch reproduction and run its isolated
  Playwright spec against accepted base
  a2be0b6722b4d08dac5ac3550fee9362a3de3ba4; record that the latest terminal
  evidence is absent specifically because no new combined head is requested for
  an initialized, already-promoted room. Also make the same-room-id/two-computer
  ownership regression red if its captured source or credential is removed.
  After the smallest fix, run focused web unit tests for computer sessions and
  transcript history, the complete web unit suite, recursive production build,
  and isolated Room 23 cross-channel plus Room 34 multi-computer Playwright
  specs. Assert one destination head request per concurrent activation, no
  finalized /runs/:id request, no document reload, watchdog, relay handshake,
  app-socket replacement, unnecessary room subscribe, cross-computer mutation,
  duplicate, or clearing of newer live rows. Exercise direct and hosted paths
  and a failed refresh followed by later activation retry. Run harn check, harn
  apply, staged Harn checks, and git diff --check; create one implementation
  commit that consumes only this plan. Stop and return for review without
  starting H2, pushing, merging, deploying, publishing, releasing, or updating a
  host.
