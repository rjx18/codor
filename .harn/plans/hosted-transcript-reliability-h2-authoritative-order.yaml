verification: >
  Before product edits, add a focused unit reproduction on accepted H1 commit
  7c8c95e7474f4acf22eb1483a382f86861a888ac: current stable units contain the
  interjection while the successful combined head returns first-half,
  interjection, continuation; record the exact failure as current-first order.
  Add the browser lifecycle reproduction before its fix and record the same
  ordering failure, not a timeout or fixture failure. Then implement the
  smallest stable-key overlap merge and reader-anchor integration. Assert exact
  stable keys at live rendering, settlement, head refresh, switch-back, reload,
  and across a twenty-unit cursor boundary; assert no gaps or duplicates,
  correct continuation attribution, preserved older pages and live-only records,
  stable anchors/search/ pins/permalinks, no local-time sort, and no finalized
  /runs/:id request. Hold one hosted-style response after capturing an
  intra-message first-visible unit and keep its viewport offset within two
  pixels through delayed materialization; also prove a pinned reader stays at
  the tail and room changes clear pending restore state. Run focused
  transcript-history and Transcript units, all web units, the recursive
  production build, and complete isolated Room 21 hydration and Room 23
  continuation Playwright specs. Run harn check, harn apply, staged Harn checks,
  and git diff --check; create exactly one implementation commit consuming this
  plan. Stop and return for review without starting other work, pushing,
  merging, deploying, publishing, releasing, or updating a host.
