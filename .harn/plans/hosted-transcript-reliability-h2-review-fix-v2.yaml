verification: >
  Add the overlap regression first on aaaad27 and record its failure showing a
  stale interior/suffix key after the authoritative tail. Then correct the
  splice without sorting by id, timestamp, or receipt time. Unit coverage must
  prove an older prefix is retained; stable incoming order is exact; stale
  current units at or after first overlap are absent; an exhausted no-overlap
  response replaces stale finalized units; and current/live message records not
  represented by the page remain in the message map but never become history
  units. Add the main Investigator's proven red browser journey before product
  correction and run it against the pre-H2 ordering implementation (the accepted
  2d5cbbc source behavior, also unchanged at the H1 parent): with no browser
  mounted, start a real run, wait for first prose, persist the newer operator
  interjection, open/hydrate while the family remains mutable, and let it settle
  live. Record the exact baseline DOM failure #1,#3,#2,#4; assert equal
  root/prose/tool x coordinates so the failure is ordering/grouping rather than
  CSS. Green must be #1,#2,#3,#4 without reload, with #3 between the two output
  stretches. Switch to another room and back through room-link clicks in the
  same document, then retain the separate reload and page-boundary exact-key
  checks. Extend the held-head journey to switch rooms before one response
  settles and prove no restore/pin state leaks into the destination and a pinned
  destination stays at the true tail; retain the intra-message delayed- response
  offset within two pixels. Run focused transcript-history and Transcript units,
  all web units, recursive build, and the complete isolated Room 21 and Room 23
  suites. Run Harn check/apply/staged checks and git diff --check; create one
  review-fix commit. Do not push, merge, deploy, publish, release, update a
  host, or start unrelated work.
