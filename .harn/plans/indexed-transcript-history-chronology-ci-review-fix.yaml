        introduces or lowers the continuation floor.
    transcript-history-index-regression:
      action: change
      reason: Reproduce an indexed room that receives an interjection before its first
        modern family finalizes, then prove exact legacy-builder parity,
        permanent continuation rows, fixed-cost warm reads, and clean dirtiness.
  indexed-transcript-pages-read-only-current-selected-evidence:
    indexed-transcript-page-regression:
      action: change
      reason: Prove the corrected floor transition changes no warm request bounds,
        backfill state, selected evidence, or cursor behavior.
