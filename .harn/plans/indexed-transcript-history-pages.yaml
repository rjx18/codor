anchors:
  explicit-prose-boundaries-survive-transcript-lifecycle:
    transcript-prose-boundary-unitizer:
      action: change
      reason: Reuse and expose the exact unitizer and established chronology metadata
        for atomic backfill and dirty-family replacement without changing
        semantics.
  actionable-interactions-do-not-spend-history-text-slots:
    interaction-text-slot-unitizer:
      action: change
      reason: Move the unchanged interaction exclusion into the shared authoritative
        entry builder used by backfill and parity tests.
  transcript-history-cursors-cover-complete-established-order:
    complete-transcript-order-before-page-boundaries:
      action: change
      reason: Preserve v1 boundaries while selecting warmed pages from the same
        materialized established order instead of rebuilding the room.
  historical-transcript-pages-budget-text-slots:
    transcript-history-text-slot-page-builder:
      action: change
      reason: Retain twenty-slot selection and evidence attachment over indexed warm
        entries, with the existing builder used only for incomplete-room
        backfill.
    transcript-history-text-slot-regression:
      action: change
      reason: Add first-build parity, warm bounded-read, mutation, deletion, cursor,
        and Mac-shaped workload regressions.
  historical-transcript-pages-match-output-scoped-rendering:
    transcript-history-rest:
      action: change
      reason: Supply the store-owned derived index and byte-range journal reader to
        the unchanged authenticated/redacted REST projection.
  addressed-cold-hydration-is-strict-and-legacy-safe:
    addressed-hydration-contract:
      action: change
      reason: The daemon transcript source is nested inside the addressed hydration
        region; socket hydrate_limit, capability gating, and legacy behavior
        remain unchanged while the existing REST builder receives its derived
        index.
  transcript-history-index-is-derived-and-rebuildable:
    transcript-history-index-schema:
      action: change
      reason: Add versioned metadata/dirty tables, mutation triggers, atomic backfill,
        and family-replacement operations.
    transcript-history-index-lifecycle:
      action: change
      reason: Build incomplete rooms once and reconcile only transactionally dirty
        identities thereafter.
    transcript-history-index-regression:
      action: change
      reason: Prove lazy migration, atomic retry, incremental ordinary/terminal/
        deletion maintenance, parity, reopen, and rebuildability.
  indexed-transcript-pages-read-only-selected-evidence:
    indexed-journal-byte-spans:
      action: change
      reason: Read only selected JSONL event byte ranges while preserving original
        event indices and payload bytes.
    indexed-transcript-page-query:
      action: change
      reason: Select the charged window by indexed chronology and load only referenced
        records and evidence.
    indexed-transcript-page-regression:
      action: change
      reason: Prove warm head/cursor bounds and Mac-shaped latency/read-count behavior
        with unchanged response parity.
