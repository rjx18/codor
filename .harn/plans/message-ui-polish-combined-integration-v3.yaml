id: message-ui-polish-combined-integration-v3
title: Compose accepted optimistic sending, reconnect grace, no-skeleton UI and
  source-owned archive
notes: "Exact clean first parent 732a6998225701c83f68d12c0229476393b85be8; exact
  second parent a1e20cfcf3cf4389f8152a37d098de6c2b7ec454; common base
  864069b6134e09d3b786f85171fb8ea7a8710e17. One real no-ff merge, no
  squash/cherry-pick/duplicate feature application. Preserve second-parent
  historical Harn records through ancestry, not direct imports: after merge
  restore the complete .harn tree byte-for-byte to first-parent files except
  this locked plan, remove incoming-only generated truth and five incoming
  historical plans, then ordinary Harn apply derives the final active contract.
  Do not write hashes or alter shared hooks/ignore rules. Resolve only ten
  forecast conflicts plus automatic session/store/connector/harness overlap
  audit. No skeleton renderer/helper/styles restored. Compose P4 targeted
  actForRoom/archive source ownership with P3 actual-readiness gating; local
  queue admission/grace never enables management writes. Keep both Room48 files.
  Add only bounded offline local-send/archive/no-skeleton regression. No backend
  transaction, history, network, outbox or lifecycle redesign. Replacement
  authorized in #3097. Resolved merge is preserved exactly in named stash
  message-ui-integration-preserved-proof-scope-3097, commit
  47ec945b1daf5311144292f551a3eaa0a4aa07a5, tree
  42381c7f7fe1f92ca57bfc2bf0e768b2f977d7e6. Restore its source bytes and exact
  accepted merge parents after this clean lock; exclude the replaced original
  lock. Only additional edit is scripts/p6-installed-proof.mjs fault injection
  and associated assertions: withhold target ack and target canonical
  live/replay/HTTP evidence before crash, allow same-ID retry ack after restart
  while canonical stays held, release evidence afterwards. Unrelated traffic
  continues. Preserve pending, immutable identity/outcome, durable counts,
  edited draft and zero-error assertions. No runtime changes. Final fixture
  amendment approved in #3099. Resolved merge/proof preserved in
  ba0590655850774aaedf96e0eb7d4716cc9c7182 (tree
  dcf36240e8b4c6cfcecbc007dc89d21bbd7ede88). Restore its exact source and
  parents after clean lock, excluding old v2 plan. Only new edits: Room11 helper
  uses actual room readiness/editability/Send admission, never draft-prefix
  contents; Room9 and Room40 require Disconnected and false transport/grace with
  their remaining recovery assertions unchanged; only hosted Room44 gets a
  90-second outer test budget, preserving its existing 60-second jump assertion
  and all request/scroll bounds. No runtime, proof, global timeout or
  configuration changes. The Room40 historical branch-status marker names an
  already-retired assumption; no reactivation or generated-record edit is
  performed."
assumptions:
  create:
    - id: agent-handling-ticks-require-delivery-evidence
      title: Double ticks require evidence of agent handling rather than cleanup
      statement: >
        Double ticks require each eligible agent delivery to be delivering or
        consumed with a recorded run or native steering acknowledgement.
        Consumed-before-start cleanup, queued/held work and removed recipients
        must not imply a read. Grouped human rows retain independent accessible
        status, with server acceptance distinguished from handling evidence.
      depends_on:
        - agent-delivery-lifecycle-streams-v2
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: composer-acknowledgement-preserves-owned-raw-drafts-v2
      title: Optimistic sends transfer only their captured composition
      statement: On a verified correlation-capable computer, a valid send transfers
        its complete captured composition into a session-owned outgoing row and
        immediately clears only that composition. Subsequent acceptance or
        correlated canonical records settle that submission by identity without
        touching a newer draft. Legacy mode retains the existing owned
        acknowledgement/echo workflow.
      depends_on:
        - pending-composer-echo-is-destination-and-self-bound
        - exact-trailing-mentions-send-before-owned-result
        - composer-enter-uses-live-draft-state
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: composer-memory-survives-session-connector-handover-v3
      title: Composition memory survives cached-to-live session handover (source-owned
        grace)
      statement: A computer session gives its cached and live connectors the same
        nonpersistent composition owner. Body, edited-empty state, reply,
        uploaded attachment selection, completed voice metadata and pending
        result state stay scoped to that owner and room across connector
        replacement. Other computer sessions, forgotten pairings and page
        reloads cannot inherit the memory. No draft or outbox is written to
        persistent storage.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - pending-submission-retries-only-through-ready-owner-v3
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: edited-outgoing-intents-use-browser-preparation
      title: Edited outgoing intents use the same browser preparation as Composer
      statement: >
        A new edited outgoing intent must canonicalize friendly schedule clocks
        and validate/re-resolve its qualified destination through the same
        preparation helper as Composer, using its captured source owner. Raw
        editable text and media remain intact on failure; unchanged same-ID
        Resend uses its frozen payload without recanonicalization.
      depends_on:
        - friendly-schedule-clocks-canonicalize-at-client-boundary
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: floating-room-loading-pill-uses-existing-priority-with-grace-cached
      title: Room loading states use one animated floating overlay pill (source-owned
        grace)
      statement: The browser exposes at most one accessible loading pill over the
        transcript, selected by the existing priority of Reconnecting, Loading
        channel, Syncing messages, and Loading older messages. It is compact,
        contains a progress spinner and short fade/slide entrance, does not
        occupy the transcript's layout flow, and disables that motion under
        prefers-reduced-motion; no additional loading state machine or request
        is introduced and direct/hosted readiness and mutation semantics stay
        unchanged.
      depends_on:
        - prioritized-room-loading-pill-uses-existing-readiness-with-grace-cached
        - readable-reconnecting-room-never-admits-mutation-with-grace-cached
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: pending-submission-retries-only-through-ready-owner-v3
      title: Independent submissions retry only through their ready owner
        (source-owned grace)
      statement: Never-dispatched outgoing records remain distinct from dispatched
        uncertain submissions under the existing computer owner. Only the
        existing current room-ready/capability callbacks may drain queued
        records or retry immutable IDs. Optimistic records require verified
        acknowledgement and correlation support at dispatch; legacy ambiguous
        posts never replay. Actual Connection.post retains socket-admission
        semantics. No persistent outbox or additional retry/reconnect loop is
        introduced.
      depends_on:
        - hosted-app-streams-follow-tunnel-generations
        - hosted-computer-sessions-keep-state-isolated
        - post-acknowledgements-are-optional-and-correlated
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: post-capability-recovery-is-owned-and-bounded-v3
      title: Unknown post capability retries through its ready owner (source-owned
        grace)
      statement: Timeouts, transport errors and failed compatibility responses leave
        post capability unknown, distinct from verified supported or
        unsupported. One bounded abortable compatibility check per owning socket
        generation uses that session's credential renewal, coalesces concurrent
        intent, and retries unknown results with bounded backoff while the
        connection is healthy. Generation retirement and
        auth/manual/upgrade/disposal parks cancel the checks. Only verified
        support permits replay of the original immutable pending ID;
        verification never replaces a healthy connection or sends legacy
        retries.
      depends_on:
        - pending-submission-retries-only-through-ready-owner-v3
        - relay-read-renewal-retains-original-owner
        - hosted-app-streams-follow-tunnel-generations
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: prioritized-room-loading-pill-uses-existing-readiness-with-grace-cached
      title: One room loading pill projects existing readiness in fixed priority
        (source-owned grace)
      statement: Outside the source-owned five-second transient grace, the existing
        reconnect/channel/head/older priority selects at most one floating
        loading pill. During grace, reconnect-only and reconnect-room-readiness
        feedback is withheld while genuine requested history/older work retains
        the existing loading presentation. Actual readiness and mutation guards
        stay truthful; no history request or second scroll owner is introduced.
      depends_on:
        - readable-reconnecting-room-never-admits-mutation-with-grace-cached
        - hosted-app-streams-follow-tunnel-generations
        - hosted-computer-sessions-keep-state-isolated
        - finalized-browser-history-is-combined-page-owned
        - transcript-history-prepends-one-text-slot-page
        - combined-head-reconciliation-is-two-page-bounded
        - relay-app-socket-readiness-requires-server-evidence
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: readable-reconnecting-room-never-admits-mutation-with-grace-cached
      title: Readable reconnects admit local intent without enabling server mutation
      statement: Retained chats remain readable during reconnect. Established
        recoverable sessions and an already-paired computer's validated cached
        rooms may admit page-memory never-sent records under the existing
        composition owner, without claiming a socket write. Cached startup gets
        no healthy grace or verified capability; dispatch waits for the same
        authenticated room-ready owner and verified acknowledgement/correlation
        support. Unknown rooms and manual/auth/upgrade/disposal parks cannot
        admit local sends. All server mutations require actual readiness; only
        established transient loss gets source-owned five-second visual grace.
        No persistent outgoing queue is added.
      depends_on:
        - hosted-last-good-history-cache-is-per-room-bounded-and-provisional
        - relay-app-socket-readiness-requires-server-evidence
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: reconnect-grace-timestamp-belongs-to-source-store
      title: Reconnect grace uses one source-owned timestamp without falsifying
        readiness
      statement: Each page-memory source store remembers established live readiness
        and one outage timestamp. Transient recoverable loss permits five
        seconds of presentation grace; repeated loss signals or view changes
        cannot reset it. Manual/auth/upgrade/disposal parks withdraw grace
        immediately. The actual connected and roomLive fields never become true
        because of grace.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: reconnect-safe-post-dispatch-preserves-draft-v3-cached
      title: Rejected dispatch preserves the submitted composition under its owner
        (source-owned grace)
      statement: Connection.post truthfully reports current socket admission;
        unavailable sockets never imply server acceptance. Correlation-capable
        composition is retained in the outgoing record on refusal, with explicit
        recovery, while legacy mode preserves its draft. Actual readiness
        remains required and cached shells reject. Reconnect never silently
        replays ambiguous legacy posts.
      depends_on:
        - readable-reconnecting-room-never-admits-mutation-with-grace-cached
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - pending-composer-echo-is-destination-and-self-bound
        - client-syncs-by-seq
        - hosted-app-streams-follow-tunnel-generations
        - relay-app-socket-readiness-requires-server-evidence
        - room-action-errors-are-visible
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: scheduled-composer-settles-original-owned-outcome-v2
      title: Scheduled composer acknowledgement preserves exact raw draft ownership
      statement: Scheduled composer submissions retain the raw draft, immutable
        canonical directive, originating room and computer. An opted-in request
        settles on its correlated original schedule outcome, including its
        original due instant; legacy mode continues to match a newly observed
        schedule by destination, authenticated author and clean body. Refusals
        keep editable text and acceptance never clears a newer draft.
      depends_on:
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - scheduled-state-streams-through-room-seq-v2
        - target-worktree-owns-qualified-conversation
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: sender-receipt-correlation-is-indexed-and-private
      title: Returned records correlate only for their authenticated sender
      statement: Live, replay and HTTP messages/schedules may carry optional
        sender-owned submission correlation derived from durable receipts
        through indexed destination lookups bounded by unique returned records.
        Publication and receipt transactions stay unchanged; no extra browser
        request or polling is introduced. Distinct authors never receive each
        others correlation. A separate capability gates optimistic UI; canonical
        identity reconciles before or after acknowledgement without text
        matching.
      depends_on:
        - post-receipts-commit-atomically-with-routing
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: unsupported-submissions-can-stop-local-wait-v3
      title: Unsupported submissions preserve uncertainty without automatic replay
        (source-owned grace)
      statement: A verified unsupported replacement never automatically replays a
        retained submission. Legacy acknowledgement-only composition retains the
        guarded Stop waiting control; optimistic records retain their captured
        content and explicit uncertainty until local retry, edit or discard.
        Discard stops local recovery without claiming server cancellation.
        Neither a late result nor a capability change clears a newer draft or
        transfers content to another computer.
      depends_on:
        - post-capability-recovery-is-owned-and-bounded-v3
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
      reason: Compose the unchanged independently accepted P1/P3 truth from the exact
        second parent.
    - id: loading-messages-use-one-floating-pill-without-tail-skeleton-with-grace
      title: Room loading uses one floating pill without a bottom synchronization
        skeleton
      statement: >
        The room UI exposes at most one accessible loading surface for the
        existing prioritized readiness signals: the high-contrast floating
        spinner pill with one “Loading messages…” label, its existing entrance
        and reduced-motion behavior, and no bottom synchronization skeleton
        during initialized head refresh. Initial hydration keeps its existing
        empty-chat placeholder, older-page loads keep their floating state and
        reader anchoring, and no new loading state machine, request, or scroll
        owner is introduced.
      depends_on:
        - floating-room-loading-pill-uses-existing-priority-with-grace-cached
        - transcript-tail-follow-has-one-prepaint-owner
        - transcript-history-prepends-one-text-slot-page
      reason: Preserve P2 removal and P3 priority together, without new presentation
        or requests.
