id: multi-worktree-reliability-post-merge-reconciliation
title: Reconcile worktree management with bounded history and generation recovery
notes: >-
  This is an honest post-merge reconciliation of the accepted management stack
  and transcript/relay reliability stack. The real merge commit 2b8d5c4 has
  first parent e7fa093 and exact reliability second parent 52e0c0a; both feature
  histories and their applied Harn plans predate this plan. This plan therefore
  does not claim to have governed or authored either feature. A semantic audit
  of all fourteen files changed by both lines found the contracts additive:
  management, preset, roster, worktree, and transcript routes coexist;
  worktree-qualified attribution survives bounded historical rendering;
  desired per-computer worktree observations remain store-local while tunnel
  generations recover; finalized history remains combined-page owned; and the
  shared harness serves both fixture families. Add executable cross-stack
  regressions at those seams. Make no source change unless a regression exposes
  a concrete integration defect, and then keep the correction inside the named
  seam. Phase 3 exhaustive verification, deployment, release, and cleanup remain
  outside this plan.
assumptions:
  create:
    - id: merged-worktree-reliability-contracts-coexist
      title: Worktree management and bounded relay history coexist without shared-state loss
      statement: >-
        In the merged browser and switchboard, preset, roster, routing, and
        worktree lifecycle APIs must coexist with authenticated redacted
        transcript pages; a worktree-qualified historical row must retain its
        stable author identity, target, permalink, and bounded transcript-unit
        ownership without fetching a finalized full run; and each hosted
        computer's desired worktree observations must survive only that
        computer's current tunnel generation without resetting, cross-writing,
        or reopening another computer, while direct mode keeps its existing
        behavior.
      reason: >-
        The accepted stacks independently own overlapping server, store,
        transcript, connector, session, API, and harness seams; only executable
        combined regressions can prove the semantic merge retained both sides.
      depends_on:
        - agent-preset-management-is-authorized-across-rest-and-cli
        - registered-worktree-navigation-is-promotion-gated
        - cross-worktree-output-stays-in-origin
        - finalized-browser-history-is-combined-page-owned
        - hosted-app-streams-follow-tunnel-generations
        - hosted-computer-sessions-keep-state-isolated
  reviewed:
    -
      id: a-permission-change-is-never-silent
      outcome: unchanged
      reason: >-
        The post-merge audit found this existing contract and its anchors in the
        fourteen overlap files semantically unchanged; reconciliation adds only
        explicit cross-stack regression coverage.
