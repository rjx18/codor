anchors:
  merged-worktree-reliability-contracts-coexist:
    cross-stack-server-coexistence-regression:
      action: change
      reason: >-
        Exercise preset, roster, worktree catalog, and transcript-history reads
        through one authorized server without one route absorbing another.
    cross-stack-session-recovery-regression:
      action: change
      reason: >-
        Prove a current-generation recovery retains only the addressed
        computer's desired worktree observations and leaves its peer untouched.
    cross-stack-api-transport-regression:
      action: change
      reason: >-
        Exercise worktree routing and combined history through the same active
        hosted relay transport, token, and room without request collision.
    cross-stack-browser-fixture:
      action: change
      reason: >-
        Seed one worktree-qualified historical message in the existing native
        worktree group fixture without changing either feature's ownership.
    cross-stack-browser-regression:
      action: change
      reason: >-
        Prove the mounted worktree UI renders the seeded combined-page row with
        its qualified author, stable target, permalink, and bounded unit while
        making no finalized full-journal request.
