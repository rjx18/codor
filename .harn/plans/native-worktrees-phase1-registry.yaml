verification: Run harn find --plan native-worktrees-phase1-registry and harn
  check native-worktrees-phase1-registry; run pnpm --filter @codor/protocol
  test, pnpm --filter @codor/switchboard test, and pnpm --filter
  '@codor/switchboard...' build. All worktree lifecycle tests must use only
  per-test mkdtemp repositories and worktrees below their own temporary roots,
  assert the branch survives removal, and clean up only those roots. Then stage
  only the plan files and implementation, run harn check --staged, let the Harn
  hook apply the plan, and create exactly one Phase 1 implementation commit
  containing the code, tests, applied plan, and generated assumption truth.
