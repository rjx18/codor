    conversation-key-response:
      action: change
      reason: Reuse the validated lifecycle response after worktree creation.
    conversation-files-voice-key-regression:
      action: change
      reason: Prove paired-browser create returns only the new child key and operator
        creation remains keyless.
  browser-created-channel-delivers-its-room-key:
    browser-room-key-response:
      action: keep
      reason: Direct room creation must remain unchanged.
    browser-room-key-regression:
      action: keep
      reason: Direct room creation coverage must remain unchanged.
  registered-worktrees-materialize-stable-conversations:
    worktree-conversation-migration:
      action: change
      reason: Close the existing migration regression outer anchor correctly.
    worktree-conversation-store-regression:
      action: change
      reason: Preserve the inner store regression while fixing nested closure.
  main-and-direct-conversations-stay-compatible:
