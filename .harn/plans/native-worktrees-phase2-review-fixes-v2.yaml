id: native-worktrees-phase2-review-fixes-v2
title: Native worktrees Phase 2 review fixes v2 - browser keys and Harn truth
notes: >-
  Replace the unimplemented native-worktrees-phase2-review-fixes lock without
  rewriting it. The first lock was clean but Harn's duplicate-anchor identity
  aggregation attributed the required store.spec.ts edits to both
  registered-worktree-identities-are-durable worktree-store-lifecycle and
  worktree-store-schema. This replacement preserves the exact same five-file
  implementation and explicitly accounts for both anchors; store.ts remains
  outside the file list and its production schema must not change.

  Route both worktree creation REST aliases through the same validated
  lifecycle-response helper as adoption so successful creation ensures the child
  room key, a paired browser receives only that child's sealed key, and operator
  responses remain keyless. Add a browser-create regression using only its own
  temporary Git repository/worktrees. Make the child-roster assertion
  independent of random ULID lexical order. Repair only the malformed or missing
  Phase 2 Harn test delimiters for migration, store/server isolation, main
  compatibility, child authorization, roster neutrality, and residency. Do not
  alter conversation identity/persistence, routing, runtime behavior, filesystem
  lifecycle, relay protocols, UI, presets, or any Phase 3 behavior. Never mutate
  a real user worktree.
assumptions:
  reviewed:
    - id: child-files-voice-and-keys-are-isolated
      outcome: unchanged
      reason: The existing invariant requires the create route to reuse the correct
        child-key response already implemented for adoption.
    - id: browser-created-channel-delivers-its-room-key
      outcome: unchanged
      reason: Direct room creation remains untouched and is the compatibility
        precedent for a paired browser creating a worktree child.
    - id: registered-worktrees-materialize-stable-conversations
      outcome: unchanged
      reason: Identity and migration behavior stay unchanged while missing regression
        delimiters become valid source anchors.
    - id: main-and-direct-conversations-stay-compatible
      outcome: unchanged
      reason: Compatibility behavior stays unchanged and its existing REST regression
        receives the correct closing marker.
    - id: child-conversation-state-is-room-isolated
      outcome: unchanged
      reason: State and server isolation behavior stays unchanged while malformed
        nested test anchors are repaired.
    - id: child-members-own-isolated-runtime
      outcome: unchanged
      reason: Runtime isolation stays unchanged and child authorization closes under
        its intended assumption.
    - id: child-home-authority-survives-residency
      outcome: unchanged
      reason: Hosted behavior stays unchanged and the existing child fixture receives
        its missing end marker.
    - id: worktree-lifecycle-is-roster-neutral
      outcome: unchanged
      reason: The empty-child proof stays unchanged apart from duplicate and unmatched
        delimiter cleanup.
    - id: registered-worktree-identities-are-durable
      outcome: unchanged
      reason: Lifecycle and schema behavior stay unchanged; the test assertion becomes
        order-independent and both duplicate Harn anchor identities are
        accounted.
    - id: agent-network-authority-is-narrow
      outcome: unchanged
      reason: Authorization behavior stays unchanged while test delimiters are fixed.
    - id: worktree-creation-registers-only-a-new-secondary
      outcome: unchanged
      reason: Creation still performs the same safe Git/registration operation; only
        its response gains the already-declared paired-browser key envelope.
    - id: worktree-management-is-human-admin-only
      outcome: unchanged
      reason: Existing role gates stay unchanged while the nested regression marker is
        corrected.
