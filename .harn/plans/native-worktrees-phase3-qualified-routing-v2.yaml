verification: Run harn find --plan native-worktrees-phase3-qualified-routing-v2 and
  harn check native-worktrees-phase3-qualified-routing-v2; run pnpm --filter
  @codor/protocol test, pnpm --filter @codor/switchboard test, and pnpm --filter
  @codor/web-next test. Run pnpm --filter '@codor/switchboard...' build and pnpm
  --filter '@codor/web-next...' build. The protocol suites must cover the shared
  qualified grammar, scoped identity schemas, paired-field refusal, and legacy
  compatibility. Switchboard suites must use only per-test data roots and
  disposable mkdtemp Git repositories/worktrees to prove same-handle local and
  qualified routing, alias/branch/path observation changes, strict refusal,
  origin-only replies, target-only cwd/session/token/cache/task/meter state,
  concurrent cross-origin serialization, collaboration, active-invocation
  authorization, and queued/delivering restart recovery. Web suites must cover
  accessible local/qualified completion, identical handles, full-token
  insertion, shared-parser refusal, draft preservation through post errors,
  scoped author rendering, and the unchanged ordinary room. Capture
  `git worktree list --porcelain` path/branch mapping for the real repository
  before and after all tests/builds and require an exact match; no test or
  verification command may create, move, rename, unregister, remove, or modify
  a real user worktree. Stage only the locked plan and its twenty declared
  files, run harn check --staged, let the Harn hook apply the plan and generate
  assumption truth, and create exactly one Phase 3 implementation commit.
