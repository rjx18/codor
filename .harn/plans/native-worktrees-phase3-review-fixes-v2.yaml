verification: Before source edits, verify the preserved patch at
  /tmp/codor-native-worktrees-phase3-review-fixes-unplanned.9vJ4fT.patch has
  SHA-256 f1317c990740233bf9d6d1991db7c1b4c5b46212b5e01a15b604082d2f58f54c,
  contains exactly the seven declared source entries for body.ts, worktree.ts,
  collaboration.ts, daemon.ts, router.ts, server.ts, and store.ts, and passes
  git apply --check against the clean locked base. Reapply only those seven
  entries after the lock is verified; then complete every declared regression
  and source requirement within the unchanged sixteen-file boundary. Run harn
  find --plan native-worktrees-phase3-review-fixes-v2, harn plan
  check native-worktrees-phase3-review-fixes-v2, and harn check
  native-worktrees-phase3-review-fixes-v2. First run focused tests with pnpm --filter
  @codor/protocol test and pnpm --filter @codor/switchboard exec vitest run
  src/router.spec.ts src/collaboration.spec.ts src/store.spec.ts src/daemon.spec.ts
  src/server.spec.ts and pnpm --filter @codor/web-next exec vitest run
  src/room/Composer.spec.tsx src/room/Transcript.spec.tsx. Then run the complete
  pnpm --filter @codor/switchboard test twice, pnpm --filter @codor/web-next test,
  pnpm --filter '@codor/switchboard...' build, and pnpm --filter
  '@codor/web-next...' build. Capture a normalized git worktree list --porcelain
  path/branch inventory immediately before all gates and after all gates; require
  the same count and exact bytes. Any Git-backed regression must create its own
  mkdtemp repository and disposable worktrees. No command or test may create,
  move, rename, unregister, remove, or modify a real user worktree. Stage only
  this locked plan and the sixteen declared source/test files, run harn check
  --staged, let the hook apply the plan/generate truth, and create exactly one
  review-fix implementation commit.
