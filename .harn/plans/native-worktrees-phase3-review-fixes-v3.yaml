verification: Run harn find --plan native-worktrees-phase3-review-fixes-v3, harn
  plan check native-worktrees-phase3-review-fixes-v3, and harn check
  native-worktrees-phase3-review-fixes-v3 before package gates. Run pnpm
  --filter @codor/protocol test; pnpm --filter @codor/switchboard exec vitest
  run src/router.spec.ts src/collaboration.spec.ts src/store.spec.ts
  src/daemon.spec.ts src/server.spec.ts; and pnpm --filter @codor/web-next exec
  vitest run src/room/Composer.spec.tsx. Then run the complete pnpm --filter
  @codor/switchboard test twice, pnpm --filter @codor/web-next test, pnpm
  --filter '@codor/switchboard...' build, and pnpm --filter '@codor/web-next...'
  build. Capture a normalized git worktree list --porcelain path/branch
  inventory immediately before all gates and after all gates; require identical
  bytes, count, and SHA-256. Any Git-backed test must create its own mkdtemp
  repository and disposable worktrees. No test or command may create, adopt,
  discover, move, rename, unregister, remove, or modify a real user worktree.
  Stage only this locked plan and the fourteen declared source/test files, run
  harn check --staged, let the commit hook apply the plan, and create exactly
  one review-fix implementation commit.
