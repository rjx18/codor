id: native-worktrees-phase3-review-fixes-v4
title: Native worktrees Phase 3 review fixes v4 - finish strict scoped refusal
notes: >-
  Fix only the remaining defects found by Sol's independent review of commit
  48f79ac75b56a61b56853e281463581c10ec865d. Preserve every prior applied
  plan and remain inside Phase 3 qualified routing. The review reran 212
  protocol tests, 599 focused switchboard tests, 21 focused Composer tests,
  the complete 789-test switchboard suite, the complete 454-test web suite,
  both recursive builds, and the applied-plan check. Those gates passed and
  the normalized 52-entry real-worktree inventory was byte-identical, but the
  gaps below are not covered by the current suites.

  Complete the shared qualified-token scanner without returning to the broad
  every-tilde behavior. Ordinary prose and paths such as `~5`, `~/tmp`, and
  `~approximately` remain ordinary. A token that actually attempts qualified
  syntax must own its complete inner handle and produce one structured
  malformed issue when the selector is empty, the colon is repeated, the
  handle is empty, or horizontal, newline, carriage-return, or other
  JavaScript whitespace appears around the selector/colon/handle separators.
  Inputs including `~:@codex`, `~ :@codex`, `~review::@codex`,
  `~review: :@codex`, `~review:\n@codex`, `~\nreview:@codex`,
  `~review:`, and `~review:@` must never expose an inner local mention or post
  a message. Preserve UTF-16 offsets, code-span exclusion, valid punctuation,
  and atomic no-fallback behavior in both router and Composer consumers.

  Finish the locked v3 catalog contract. An empty routing catalog remains
  valid for an ordinary or non-Git channel. Every nonempty catalog must contain
  exactly one primary target, and that target must be alias `main` at the
  catalog room. Reject secondary-only, non-primary-main, and multi-primary
  projections. Update the browser API fixture to model an actual main plus
  secondary catalog; do not weaken the wire invariant to preserve an invalid
  fixture.

  Make the origin repository an explicit required argument to scoped-target
  validation so no caller can accidentally validate a target against itself.
  Audit delivery creation, group materialization, dispatch, queue draining,
  turn admission, active-invocation lookup, retry/release, and boot recovery.
  A legacy or test-injected cross-repository queued row must be consumed with
  one visible origin refusal, must not spin the recursive turn pump or invoke
  an adapter, and must not strand later valid same-target work. Atomic group
  materialization must reject a cross-repository participant without leaving a
  group, round, participant, delivery, or payload snapshot before or after
  reopen.

  Make post-acceptance scoped refusal durable as one store transaction. For a
  stale queued or held delivery, commit its consumed/group-terminal state and
  exactly one origin system refusal together. For a stale delivering attempt
  found at boot, atomically preserve and interrupt the run evidence, consume
  its bound delivery rows, settle any collaboration participant with truthful
  terminal evidence, and append exactly one origin refusal before any adapter
  retry. A crash or repeated reconcile must not leave a running orphan, omit
  the refusal, duplicate it, throw on a delivering group participant, reopen a
  closed round, or block later valid work. Subsequent group barrier advancement
  may remain idempotent after that durable settlement.

  When a completed collaboration result contains any invalid qualified
  intent, commit the visible refusal in the same transaction that closes the
  current round and group. Return the durable refusal row for normal daemon
  emission. Repeated advancement and restart must leave exactly one refusal,
  one closed round, no next-round delivery, and all terminal result evidence.
  Do not use an unbounded scan of unrelated system messages as the durability
  mechanism.

  Add a real WebSocket regression proving an already-connected target agent
  cannot retain effective-origin authority after its durable target becomes
  invalid, while a fresh authentication after settlement restores only home
  scope. Keep the active target-self hydration behavior from v3 and never
  expose another target member or inbox.

  Restore the missing `cross-worktree-turn-orchestration` closing delimiter in
  Store.beginTurn and add explicit scoped boot-reconcile regression markers.
  Preserve or restore the existing qualified Composer/client regression
  delimiters so Harn truth describes the tests that now guard the contract.

  Do not add Phase 4 UI/navigation, presets, roster cloning, alias editing,
  relay/residency changes, multi-repository routing, or new Git lifecycle
  behavior. Do not touch the agent-presets or CLI-management worktrees. No
  command or test may create, adopt, discover, move, rename, unregister,
  remove, or modify a real user worktree; all lifecycle state used by tests
  must live in disposable temporary repositories and temporary databases.
assumptions:
  reviewed:
    - id: qualified-member-target-identity-is-durable
      outcome: unchanged
      reason: Attempted scoped syntax must own its inner handle and persist only a same-repository stable tuple.
    - id: invalid-qualified-targets-never-fallback
      outcome: unchanged
      reason: Malformed and post-acceptance stale targets refuse atomically, visibly, and without local fallback.
    - id: qualified-completion-lists-registered-targets-only
      outcome: unchanged
      reason: A path-free catalog contains main plus explicitly registered active targets, while an ordinary channel remains empty.
    - id: body-parser-shared-across-router-and-web
      outcome: unchanged
      reason: Router and Composer continue to consume one corrected protocol parser.
    - id: main-and-direct-conversations-stay-compatible
      outcome: unchanged
      reason: Empty catalogs and ordinary channel behavior remain valid and unchanged.
    - id: cross-worktree-output-stays-in-origin
      outcome: unchanged
      reason: Refusal and interrupted run evidence remain only in the delivery origin.
    - id: cross-worktree-runtime-stays-target-local
      outcome: unchanged
      reason: Invalid origin/target pairs never execute and valid later work retains the target runtime.
    - id: target-member-turns-serialize-across-origins
      outcome: unchanged
      reason: Draining an invalid foreign-origin row cannot spin or strand the target member FIFO.
    - id: only-an-admissible-delivery-becomes-delivering
      outcome: unchanged
      reason: Transactional admission remains the final guard after the daemon drains invalid rows.
    - id: delivery-attempt-wal-reconcile
      outcome: unchanged
      reason: Boot settlement of an invalid scoped attempt preserves the WAL evidence without retry.
    - id: agent-delivery-lifecycle-streams-v2
      outcome: unchanged
      reason: Atomic refusal still emits the committed inbox and message rows through existing live-frame semantics.
    - id: one-inflight-turn-per-member
      outcome: unchanged
      reason: Invalid queue draining terminates and later valid work still observes the one-turn guard.
    - id: brakes-rechecked-at-turn-start
      outcome: unchanged
      reason: Scoped validation changes must not bypass or duplicate the target-room brake check.
    - id: collaboration-groups-are-durable-state
      outcome: unchanged
      reason: Same-repository validation and refusal settlement remain atomic with group persistence.
    - id: group-round-creation-is-atomic-and-idempotent
      outcome: unchanged
      reason: A rejected foreign-repository participant leaves no partial round or payload snapshot.
    - id: collaboration-round-release-is-one-barrier
      outcome: unchanged
      reason: Invalid qualified results close one barrier with the refusal in the same transaction.
    - id: open-collaboration-groups-reconcile-without-resurrection
      outcome: unchanged
      reason: Invalid delivering participants settle truthfully and idempotently without retry or startup failure.
    - id: agent-authority-follows-one-active-invocation
      outcome: unchanged
      reason: An invalidated durable target cannot keep effective-origin authority on an existing socket.
    - id: agent-network-authority-is-narrow
      outcome: unchanged
      reason: Re-authentication after invalidation restores only home scope and never another room.
    - id: agent-sync-hydrates-only-own-queued-inbox
      outcome: unchanged
      reason: The target-self overlay remains limited to the authenticated member and its own origin inbox.
anchors:
  qualified-member-target-identity-is-durable:
    qualified-member-target-protocol:
      action: change
      reason: Require exactly one primary main target for every nonempty catalog.
    qualified-member-target-protocol-regression:
      action: change
      reason: Cover empty, main-only, main-plus-secondary, secondary-only, non-primary-main, and multi-primary catalogs.
    qualified-body-grammar:
      action: change
      reason: Recognize only actual scoped attempts while owning every malformed selector/colon/handle variant across whitespace.
    qualified-body-grammar-regression:
      action: change
      reason: Cover empty selectors/handles, repeated colons, line breaks, Unicode offsets, code spans, punctuation, and ordinary tildes.
    qualified-routing-store-query:
      action: change
      reason: Remove the self-origin default and require explicit same-repository validation at every call site.
    qualified-routing-store-regression:
      action: change
      reason: Prove direct, group, reopen, and legacy cross-repository refusal with no partial durable state.
  invalid-qualified-targets-never-fallback:
    qualified-routing-refusal:
      action: change
      reason: Settle delivery, run/group evidence, and one origin refusal as a durable unit.
    qualified-routing-refusal-regression:
      action: change
      reason: Cover malformed post suppression, stale queue draining, repeat reconcile, and no local fallback.
    qualified-post-error-regression:
      action: change
      reason: Prove every attempted incomplete/malformed token allocates no message or delivery.
    qualified-composer-refusal-regression:
      action: change
      reason: Mirror the complete malformed-token ownership matrix through the shared Composer parser.
  qualified-completion-lists-registered-targets-only:
    qualified-target-catalog:
      action: keep
      reason: The daemon continues to project only registered path-free targets.
    qualified-target-catalog-regression:
      action: keep
      reason: The real REST catalog remains main plus registered secondary targets.
    qualified-target-catalog-client-regression:
      action: change
      reason: Replace the invalid secondary-only client fixture and assert schema rejection of that shape.
    qualified-composer-completion-regression:
      action: change
      reason: Preserve main/secondary completion and empty-catalog ordinary behavior under the stronger schema.
  body-parser-shared-across-router-and-web:
    shared-body-parser:
      action: change
      reason: Keep all strict token ownership in the protocol parser rather than consumer-specific scanners.
  cross-worktree-output-stays-in-origin:
    cross-worktree-turn-orchestration:
      action: change
      reason: Restore the missing Store.beginTurn closing delimiter around origin-owned run creation.
    cross-worktree-turn-orchestration-regression:
      action: change
      reason: Cover origin-owned refusal, run interruption, and later valid target execution.
  cross-worktree-runtime-stays-target-local:
    cross-worktree-runtime-regression:
      action: change
      reason: Prove the invalid row never invokes an adapter and later valid work uses only the target session.
  target-member-turns-serialize-across-origins:
    cross-origin-turn-scheduler:
      action: change
      reason: Drain every invalid origin row before selecting the next valid same-target FIFO batch.
    cross-origin-turn-scheduler-regression:
      action: change
      reason: Prove bounded completion with a legacy foreign-repository row followed by valid work.
  only-an-admissible-delivery-becomes-delivering:
    turn-admission-guard:
      action: change
      reason: Keep explicit origin validation in the transaction-time admission filter.
    turn-start-with-nothing-admissible:
      action: change
      reason: Return without recursion or an empty run after invalid rows settle.
    turn-admission-regression:
      action: change
      reason: Exercise foreign-repository queued and reused rows plus the later valid drain.
  delivery-attempt-wal-reconcile:
    boot-reconcile:
      action: change
      reason: Atomically interrupt and settle invalid scoped attempts before retry classification.
    scoped-boot-reconcile-regression:
      action: change
      reason: Add explicit ordinary and grouped stale/cross-repository restart coverage with repeat reconcile.
  agent-delivery-lifecycle-streams-v2:
    delivery-created-emit:
      action: change
      reason: Emit only the rows returned by the atomic refusal/creation path.
    delivery-consumed-emit:
      action: keep
      reason: Normal successful turn consumption remains unchanged.
  one-inflight-turn-per-member:
    inflight-guard:
      action: change
      reason: Invalid-row draining must terminate before entering the in-memory turn guard.
  brakes-rechecked-at-turn-start:
    turn-start-brake-recheck:
      action: change
      reason: Preserve brake selection while the queue prefilter becomes origin-aware.
  collaboration-groups-are-durable-state:
    collaboration-store-projection:
      action: change
      reason: Keep same-repository validation inside delivery/group creation and atomic refusal settlement.
    collaboration-store-reopen-regression:
      action: change
      reason: Assert no partial foreign-repository group state before and after reopen.
  group-round-creation-is-atomic-and-idempotent:
    collaboration-round-materialization:
      action: change
      reason: Pass the group origin into every scoped participant validation.
    collaboration-round-materialization-regression:
      action: change
      reason: Reject cross-repository participants without allocating any round rows or snapshots.
  collaboration-round-release-is-one-barrier:
    collaboration-barrier-engine:
      action: change
      reason: Request one atomic close-plus-refusal operation and emit its durable message result.
    collaboration-round-release-transaction:
      action: change
      reason: Close the round/group and insert exactly one refusal message in the same store transaction.
    collaboration-barrier-regression:
      action: change
      reason: Prove repeated advancement/restart cannot lose or duplicate refusal evidence or create a next round.
    collaboration-round-release-store-regression:
      action: change
      reason: Pin idempotent atomic refusal creation alongside closed barrier state.
  open-collaboration-groups-reconcile-without-resurrection:
    collaboration-member-skip-engine:
      action: change
      reason: Distinguish before-start skips from invalid already-delivering attempt settlement.
    collaboration-reconciliation-engine:
      action: change
      reason: Reconcile an invalid grouped attempt without throwing, retrying, or orphaning its run.
    collaboration-member-skip-transaction:
      action: change
      reason: Preserve truthful terminal state when invalid scoped work had already started.
    collaboration-reconciliation-regression:
      action: change
      reason: Cover grouped unregister/cross-repository boot settlement and repeat restart.
  agent-authority-follows-one-active-invocation:
    agent-active-invocation-resolution:
      action: change
      reason: Require explicit origin validity in every durable and in-memory invocation lookup.
    agent-active-invocation-server-regression:
      action: change
      reason: Invalidate an already-connected origin mapping, deny further origin access, and restore home only after fresh auth.
    agent-active-invocation-regression:
      action: change
      reason: Prove foreign-repository and stale tuples never appear as active invocations.
  agent-network-authority-is-narrow:
    agent-authz-regression:
      action: change
      reason: Re-run the WebSocket operation matrix across active, invalidated, and home-restored scope.
  agent-sync-hydrates-only-own-queued-inbox:
    own-queued-sync-regression:
      action: change
      reason: Preserve the exact self-only overlay and inbox while invalidating effective-origin scope.
files:
  - packages/protocol/src/body.ts
  - packages/protocol/src/worktree.ts
  - packages/protocol/src/worktree.spec.ts
  - packages/switchboard/src/router.spec.ts
  - packages/switchboard/src/store.ts
  - packages/switchboard/src/store.spec.ts
  - packages/switchboard/src/daemon.ts
  - packages/switchboard/src/daemon.spec.ts
  - packages/switchboard/src/server.spec.ts
  - packages/web-next/src/runtime/api.spec.ts
  - packages/web-next/src/room/Composer.spec.tsx
verification: >-
  Before implementation, run harn find --plan
  native-worktrees-phase3-review-fixes-v4, harn plan check
  native-worktrees-phase3-review-fixes-v4, and harn check
  native-worktrees-phase3-review-fixes-v4. Run pnpm --filter @codor/protocol
  test; pnpm --filter @codor/switchboard exec vitest run src/router.spec.ts
  src/store.spec.ts src/daemon.spec.ts src/server.spec.ts; and pnpm --filter
  @codor/web-next exec vitest run src/runtime/api.spec.ts
  src/room/Composer.spec.tsx. Then run the complete pnpm --filter
  @codor/switchboard test twice, pnpm --filter @codor/web-next test, pnpm
  --filter '@codor/switchboard...' build, and pnpm --filter
  '@codor/web-next...' build. Run harn find --file for body.ts, worktree.ts,
  store.ts, daemon.ts, router.spec.ts, daemon.spec.ts, api.spec.ts, and
  Composer.spec.tsx and confirm the planned source/regression delimiters are
  represented after apply. Capture a normalized git worktree list --porcelain
  path/branch inventory immediately before all gates and after all gates;
  require identical bytes, count, and SHA-256. Every Git-backed test must use
  its own mkdtemp repository and disposable worktrees. Direct legacy-row fault
  injection is allowed only inside a temporary test database. No test or
  command may create, adopt, discover, move, rename, unregister, remove, or
  modify a real user worktree. Stage only this plan and the eleven declared
  source/test files, run harn check --staged, let the commit hook apply the
  plan, and create exactly one review-fix implementation commit.
