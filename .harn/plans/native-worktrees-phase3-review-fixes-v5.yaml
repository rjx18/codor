id: native-worktrees-phase3-review-fixes-v5
title: Native worktrees Phase 3 review fixes v5 - close malformed and recovery gaps
notes: >-
  Fix only two defects found by Sol's independent review of commit
  570a3bc1500645fc7b0f596702df4aacd7458053. Preserve every prior applied plan
  and remain inside Phase 3 qualified routing.

  First, finish the shared qualified-token grammar for the smallest incomplete
  form. A colon-only scoped attempt with both selector and handle empty, such as
  `~:`, `~ :`, `~::`, or `~ ::`, is malformed qualified intent. It must own the
  attempted token, produce one structured malformed issue, allocate no origin
  message or delivery, invoke no local/default recipient, and remain visible to
  the Composer as a refusal. Preserve the v4 ordinary-prose boundary, including
  `~5`, `~/tmp`, `~approximately`, `~5:30`, `~note:check`, code spans, valid
  punctuation, and UTF-16 offsets. Router and Composer must continue to consume
  only the shared protocol parser.

  Second, settle a stale run-bound scoped attempt as one attempt at every
  operator recovery seam. Releasing or redelivering any held row from a stale
  multi-delivery attempt must atomically consume every stale row still bound to
  that run, preserve their run bindings as evidence, interrupt the one running
  run, and append exactly one origin refusal. It must leave no held sibling or
  running orphan, invoke no adapter, and remain idempotent when another row or
  restart is examined. A retry_run request for an already-terminal run whose
  persisted scoped target is stale must fail with one actionable qualified
  refusal before reviving the member, clearing any delivery binding, queuing
  work, or creating a new run. Direct redelivery of a stale consumed terminal
  row must likewise fail without mutation. Keep ordinary active-target
  release_hold, redeliver, and retry_run behavior unchanged.

  The review independently passed 213 protocol tests, 617 focused switchboard
  tests, 39 focused web tests, the complete 813-test switchboard suite, the
  complete 464-test web suite, and both recursive builds. The normalized real
  worktree inventory was byte-identical before and after those gates. The two
  gaps above were reproduced separately with disposable temporary databases and
  paths: colon-only attempts fell through to the configured local default;
  releasing one of two stale held rows left its sibling held and its run
  running, and the second release created a duplicate refusal. Direct redelivery
  behaved the same way, while retry_run cleared both terminal bindings and
  posted two refusals.

  Do not change catalog shape, valid qualified routing, group conversations,
  collaboration barriers, WebSocket authority, presets, Phase 4 UI/navigation,
  roster cloning, alias editing, relay/residency, multi-repository support, or
  Git lifecycle behavior. Do not touch the agent-presets or CLI-management
  worktrees. No command or test may create, adopt, discover, move, rename,
  unregister, remove, or modify a real user worktree; every lifecycle fixture
  must use a disposable temporary repository/database.
assumptions:
  reviewed:
    - id: body-parser-shared-across-router-and-web
      outcome: unchanged
      reason: Router and Composer must share the corrected colon-only ownership rule
        without consumer-specific parsing.
    - id: qualified-member-target-identity-is-durable
      outcome: unchanged
      reason: Even the empty-selector/empty-handle form is owned as attempted
        qualified syntax and can never expose a local mention.
    - id: invalid-qualified-targets-never-fallback
      outcome: unchanged
      reason: Malformed ingress and stale recovery actions refuse visibly without
        local fallback, partial settlement, resurrection, or duplicate evidence.
    - id: default-recipient-fallback-chain
      outcome: unchanged
      reason: Ordinary mentionless text retains its default recipient, while a
        colon-only qualified attempt is excluded before fallback.
    - id: delivery-attempt-wal-reconcile
      outcome: unchanged
      reason: A stale held attempt remains exactly-once-or-held evidence and is
        settled as one complete run-bound unit.
    - id: redeliver-interrupts-stranded-run
      outcome: unchanged
      reason: Redelivery cannot split a stale attempt or leave its original run
        placeholder running.
    - id: retried-runs-revive-and-redeliver
      outcome: unchanged
      reason: Retry remains a fresh requeue only for a still-valid target and
        otherwise refuses before mutating terminal evidence.
anchors:
  body-parser-shared-across-router-and-web:
    shared-body-parser:
      action: change
      reason: Extend the one protocol scanner to own colon-only empty qualified
        attempts without broadening ordinary tilde matching.
  qualified-member-target-identity-is-durable:
    qualified-body-grammar:
      action: change
      reason: Recognize empty-selector and empty-handle colon-only attempts as one
        malformed qualified token.
    qualified-body-grammar-regression:
      action: change
      reason: Cover colon-only whitespace/repeated-colon variants plus preserved
        ordinary prose, code-span, punctuation, and offset behavior.
  invalid-qualified-targets-never-fallback:
    qualified-routing-refusal:
      action: change
      reason: Expand a run-bound stale refusal to every stale delivery in the same
        attempt before the atomic settlement call.
    qualified-routing-refusal-regression:
      action: change
      reason: Prove colon-only no-fallback and complete one-refusal settlement for
        multi-delivery release/redelivery paths.
    qualified-post-error-regression:
      action: change
      reason: Prove colon-only attempts allocate no message or delivery and start no
        configured local agent.
    qualified-composer-refusal-regression:
      action: change
      reason: Mirror colon-only malformed ownership through the shared Composer parser
        without clearing or rerouting the draft.
  default-recipient-fallback-chain:
    substantive-default-recipient:
      action: keep
      reason: The fallback algorithm itself remains unchanged.
    effective-default-regression:
      action: keep
      reason: Existing ordinary mentionless fallback coverage must remain untouched.
  delivery-attempt-wal-reconcile:
    boot-reconcile:
      action: keep
      reason: Boot already groups stale deliveries by run and remains unchanged.
    scoped-boot-reconcile-regression:
      action: keep
      reason: Existing boot idempotence coverage remains unchanged.
  redeliver-interrupts-stranded-run:
    redeliver-run-retirement:
      action: change
      reason: Reject or atomically settle stale scoped recovery before clearing one
        row from its run binding.
  retried-runs-revive-and-redeliver:
    retry-run-contract:
      action: change
      reason: Validate every surviving scoped target before revive/redeliver so a
        stale retry produces one actionable refusal and zero mutation.
