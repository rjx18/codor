  native-worktrees-phase3-review-fixes-v5, harn plan check
  native-worktrees-phase3-review-fixes-v5, and harn check
  native-worktrees-phase3-review-fixes-v5. Run pnpm --filter @codor/protocol
  test; pnpm --filter @codor/switchboard exec vitest run src/router.spec.ts
  src/daemon.spec.ts; and pnpm --filter @codor/web-next exec vitest run
  src/room/Composer.spec.tsx. Then run the complete pnpm --filter
  @codor/switchboard test twice, pnpm --filter @codor/web-next test, pnpm
  --filter '@codor/switchboard...' build, and pnpm --filter '@codor/web-next...'
  build. Exercise release_hold and direct redeliver with at least two held rows
  bound to one running stale scoped attempt, repeated recovery/reopen, and
  retry_run/direct redeliver against consumed rows bound to one terminal stale
  run. Assert one or zero durable refusal rows as specified, preserved binding
  evidence, no queued/held/running orphan, no new run, no member revival, and no
  adapter call. All such state must live in disposable temporary databases and
  paths. Run harn find --file for body.ts, daemon.ts, router.spec.ts,
  daemon.spec.ts, and Composer.spec.tsx and confirm the planned
  source/regression delimiters after apply. Capture a normalized git worktree
  list --porcelain path/branch inventory immediately before and after all gates;
  require identical bytes, count, and SHA-256. No gate may mutate a real
  worktree or branch. Stage only this plan and the five declared files, run harn
  check --staged, let the pre-commit hook apply the plan, and create exactly one
  review-fix implementation commit.
