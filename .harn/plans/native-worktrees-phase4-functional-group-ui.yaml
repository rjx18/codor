        fresh validation before non-force Git removal.
    worktree-remove-rest:
      action: change
      reason: Expose authorized preview separately from unregister and removal.
    worktree-remove-regression:
      action: change
      reason: Prove preview states, no preview mutation, dirty refusal, preview/action
        race recheck, clean removal, and branch survival in disposable fixtures.
