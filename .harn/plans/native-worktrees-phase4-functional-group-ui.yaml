        alias/create/adopt/unregister/ remove mutations to admin/owner before
        Store, roster preflight, or Git.
    worktree-lifecycle-authorization-regression:
      action: change
      reason: Cover anonymous/agent read refusal, observer/member mutation refusal,
        wrong-room isolation, and admin/owner access for every new route.
  agent-network-authority-is-narrow:
    agent-authz-regression:
      action: change
