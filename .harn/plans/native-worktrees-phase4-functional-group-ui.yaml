      reason: Factor reusable complete expansion that can validate inherited child
        human handles and target configuration before Git.
    default-roster-expansion-regression:
      action: change
      reason: Preserve room-create behavior while adding child-specific preflight and
        no-Git failure evidence.
  default-roster-channel-members-are-detached-ordered-snapshots:
    default-roster-room-seed:
