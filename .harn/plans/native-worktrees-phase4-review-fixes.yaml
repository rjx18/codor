verification: Before implementation, run harn find --plan
  native-worktrees-phase4-review-fixes, harn plan check
  native-worktrees-phase4-review-fixes, and harn check
  native-worktrees-phase4-review-fixes. Capture a normalized byte-for-byte git
  worktree list --porcelain path/branch inventory before any test or build. Run
  git diff --check; pnpm --filter @codor/protocol test; pnpm --filter
  @codor/switchboard exec vitest run src/store.spec.ts src/daemon.spec.ts
  src/server.spec.ts; pnpm --filter @codor/web-next exec vitest run
  src/room/git-diff.spec.ts src/app/connector.spec.ts
  src/app/computer-sessions.spec.ts src/app/store.spec.ts
  src/room/WorktreeGroup.spec.tsx; the complete pnpm --filter @codor/switchboard
  test; the complete pnpm --filter @codor/web-next test; pnpm --filter
  '@codor/switchboard...' build; pnpm --filter '@codor/web-next...' build; then
  root pnpm build followed by root pnpm test. Run isolated Playwright room37,
  room38, room39, room40, and room41 specs sequentially, each with a fresh
  harness and nonoverlapping four-port range. Browser coverage must include a
  direct top-level A-to-B-to-A Back/Forward sequence, child copied/new-tab URL,
  exclusive main/child aria-current, first-child Create without prior adoption,
  explicit Find with mandatory alias, a known existing non-Git cwd, and
  separate-origin relay pre-promotion access with zero escaped direct API
  requests. Connector tests must retain hydrated slices across socket
  replacement and require each exact new sync_complete before live; hosted tests
  must select a hidden child, switch computers away and back, and prove the
  remembered room is still the public root. Store tests must use disposable
  SQLite data and prove custom child config survives active reopen, tombstone
  reopen, alias edit, and re-adoption while only cwd/starting handle/name
  reconcile. Every Git repository and worktree fixture must live below its own
  mkdtemp root, no fixture may delete a branch, and no command may mutate a real
  worktree. Compare the normalized real-worktree inventory after all gates and
  require identical bytes, count, and SHA-256. Run harn find --file for every
  declared switchboard file and textual delimiter checks for every ignored web
  file. Stage only this plan and the 21 declared files, run harn check --staged,
  let the pre-commit hook apply the plan, and create exactly one review-fix
  implementation commit.
