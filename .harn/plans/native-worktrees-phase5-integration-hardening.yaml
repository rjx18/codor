verification: "Before implementation, run harn find --plan
  native-worktrees-phase5-integration-hardening, harn plan check
  native-worktrees-phase5-integration-hardening, and harn check
  native-worktrees-phase5-integration-hardening. Capture a normalized
  byte-for-byte `git worktree list --porcelain` path/branch inventory before any
  test or build. Implement test-first: run each new focused regression against
  the locked base and require it to fail for the intended alias/usability,
  concurrency, runtime-removal, or unselected-Git safety reason before changing
  production. Run git diff --check; pnpm --filter @codor/protocol test; pnpm
  --filter @codor/switchboard exec vitest run src/store.spec.ts
  src/worktrees.spec.ts src/router.spec.ts src/daemon.spec.ts
  src/server.spec.ts; the complete pnpm --filter @codor/switchboard test twice;
  the complete pnpm --filter @codor/web-next test; pnpm --filter
  '@codor/switchboard...' build; pnpm --filter '@codor/web-next...' build; then
  root pnpm build followed by root pnpm test. Run isolated Playwright room34,
  room39, room40, and room41 specs sequentially, each with a fresh harness and
  nonoverlapping four-port range; room34 covers hosted multi-computer isolation,
  room39 covers hosted preset and direct-path compatibility, room40 covers
  direct group navigation/readiness, and room41 covers direct plus
  separate-origin relay lifecycle. Verify ignored workspace package links
  resolve to this checkout before each runtime gate and wait for any unrelated
  harness swap to restore them rather than touching another worktree. Every Git
  fixture must remain below its own mkdtemp root and must never delete a branch.
  Compare the normalized real-worktree inventory after all gates and require
  identical bytes, count, and SHA-256. Run harn find --file for all five
  declared files, harn check, and harn check --staged. Stage only this plan and
  the five declared files, let the pre-commit hook apply the plan and generate
  assumption truth, and create exactly one Phase 5 implementation commit."
