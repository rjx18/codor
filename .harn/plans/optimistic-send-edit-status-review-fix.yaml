id: optimistic-send-edit-status-review-fix
title: Reuse browser preparation for edited sends and require handling evidence
notes: >
  Contained review correction at 5cbe2b3d. First reproduce the browser/host timezone
  mismatch and the real Store skipped-before-start delivery in red. Share existing clock
  conversion and qualified-target validation between Composer and the existing row editor.
  Capture source store/transport/token across the explicit edit action, keep raw edits and
  media, and never reprepare unchanged same-ID Resend. Consumed cleanup alone is not
  handling. No backend, receipt/index, protocol, history, skeleton, offline/grace or
  archive changes. Run focused/full web units, production build, optimistic, scheduling
  and qualified browser coverage on isolated ports.
assumptions:
  create:
    - id: edited-outgoing-intents-use-browser-preparation
      title: Edited outgoing intents use the same browser preparation as Composer
      statement: >
        A new edited outgoing intent must canonicalize friendly schedule clocks and
        validate/re-resolve its qualified destination through the same preparation helper
        as Composer, using its captured source owner. Raw editable text and media remain
        intact on failure; unchanged same-ID Resend uses its frozen payload without
        recanonicalization.
      reason: Prevent timezone drift and stale destinations in the existing editor.
      depends_on:
        - friendly-schedule-clocks-canonicalize-at-client-boundary
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
    - id: agent-handling-ticks-require-delivery-evidence
      title: Double ticks require evidence of agent handling rather than cleanup
      statement: >
        Double ticks require each eligible agent delivery to be delivering or consumed
        with a recorded run or native steering acknowledgement. Consumed-before-start
        cleanup, queued/held work and removed recipients must not imply a read. Grouped
        human rows retain independent accessible status, with server acceptance
        distinguished from handling evidence.
      reason: Consumed is also used for skipped collaboration participants.
      depends_on:
        - agent-delivery-lifecycle-streams-v2
  reviewed:
    - id: friendly-schedule-clocks-canonicalize-at-client-boundary
      outcome: unchanged
      reason: Reuse its existing implementation at both new-intent boundaries.
    - id: composer-acknowledgement-preserves-owned-raw-drafts-v2
      outcome: unchanged
      reason: Preserve complete composition and independent draft ownership.
    - id: sender-receipt-correlation-is-indexed-and-private
      outcome: unchanged
      reason: Only preparation changes; no receipt or correlation behavior changes.
    - id: agent-delivery-lifecycle-streams-v2
      outcome: unchanged
      reason: Interpret existing evidence without changing lifecycle events.
files:
  - .harn/plans/optimistic-send-edit-status-review-fix.yaml
  - packages/web-next/src/app/outgoing.ts
  - packages/web-next/src/app/outgoing.spec.ts
  - packages/web-next/src/room/Composer.tsx
  - packages/web-next/src/room/Transcript.tsx
  - packages/web-next/src/room/Transcript.spec.tsx
  - packages/web-next/src/room/delivery-status.spec.tsx
  - packages/web-next/tests/room48-optimistic-send.e2e.spec.ts
anchors:
  composer-acknowledgement-preserves-owned-raw-drafts-v2:
    raw-and-canonical-pending-send:
      action: change
      reason: Share the existing validation and canonicalization.
  sender-receipt-correlation-is-indexed-and-private:
    optimistic-outgoing-state:
      action: change
      reason: Add the shared pure new-intent preparation helper.
  agent-delivery-lifecycle-streams-v2:
    steering-delivery-indicator:
      action: change
      reason: Evidence-based ticks and nested existing row editor.
    steering-delivery-indicator-regression:
      action: change
      reason: Preserve genuine handling and distinguish skipped cleanup.
  edited-outgoing-intents-use-browser-preparation:
    shared-submission-preparation:
      action: change
      reason: Anchor shared new-intent semantics.
  agent-handling-ticks-require-delivery-evidence:
    delivery-handling-evidence:
      action: change
      reason: Anchor the conservative evidence selector.
