  create:
    - id: composer-acknowledgement-preserves-owned-raw-drafts-v2
      title: Optimistic sends transfer only their captured composition
      statement: On a verified correlation-capable computer, a valid send transfers
        its complete captured composition into a session-owned outgoing row and
        immediately clears only that composition. Subsequent acceptance or
        correlated canonical records settle that submission by identity without
        touching a newer draft. Legacy mode retains the existing owned
        acknowledgement/echo workflow.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - pending-composer-echo-is-destination-and-self-bound
        - exact-trailing-mentions-send-before-owned-result
        - composer-enter-uses-live-draft-state
    - id: composer-memory-survives-session-connector-handover-v2
      title: Composition memory survives cached-to-live session handover
      statement: A computer session gives its cached and live connectors the same
        nonpersistent composition owner. Body, edited-empty state, reply,
        uploaded attachment selection, completed voice metadata and pending
        result state stay scoped to that owner and room across connector
        replacement. Other computer sessions, forgotten pairings and page
        reloads cannot inherit the memory. No draft or outbox is written to
        persistent storage.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - pending-submission-retries-only-through-ready-owner-v2
    - id: pending-submission-retries-only-through-ready-owner-v2
      title: Independent submissions retry only through their ready owner
      statement: Each computer retains independently identified immutable dispatched
        submissions in page memory. Automatic recovery retries each original ID
        and payload at most once per ready socket generation on its own
        authenticated room, only with verified acknowledgement support. Explicit
        same-ID Resend admits only one in-flight attempt per row. Correlated
        results never settle another submission. No offline admission, timers,
        persistent outbox or reconnect loop is added.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - hosted-app-streams-follow-tunnel-generations
        - hosted-computer-sessions-keep-state-isolated
        - post-acknowledgements-are-optional-and-correlated
    - id: post-capability-recovery-is-owned-and-bounded-v2
      title: Unknown post capability retries through its ready owner
      statement: Timeouts, transport errors and failed compatibility responses leave
        post capability unknown, distinct from verified supported or
        unsupported. One bounded abortable compatibility check per owning socket
        generation uses that session's credential renewal, coalesces concurrent
        intent, and retries unknown results with bounded backoff while the
        connection is healthy. Generation retirement and
        auth/manual/upgrade/disposal parks cancel the checks. Only verified
        support permits replay of the original immutable pending ID;
        verification never replaces a healthy connection or sends legacy
        retries.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - pending-submission-retries-only-through-ready-owner-v2
        - relay-read-renewal-retains-original-owner
        - hosted-app-streams-follow-tunnel-generations
    - id: reconnect-safe-post-dispatch-preserves-draft-v2
      title: Rejected dispatch preserves the submitted composition under its owner
      statement: Connection.post truthfully reports current socket admission;
        unavailable sockets never imply server acceptance. Correlation-capable
        composition is retained in the outgoing record on refusal, with explicit
        recovery, while legacy mode preserves its draft. Actual readiness
        remains required and cached shells reject. Reconnect never silently
        replays ambiguous legacy posts.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - readable-reconnecting-room-never-admits-mutation
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - pending-composer-echo-is-destination-and-self-bound
        - client-syncs-by-seq
        - hosted-app-streams-follow-tunnel-generations
        - relay-app-socket-readiness-requires-server-evidence
        - room-action-errors-are-visible
    - id: scheduled-composer-settles-original-owned-outcome-v2
      title: Scheduled composer acknowledgement preserves exact raw draft ownership
      statement: Scheduled composer submissions retain the raw draft, immutable
        canonical directive, originating room and computer. An opted-in request
        settles on its correlated original schedule outcome, including its
        original due instant; legacy mode continues to match a newly observed
        schedule by destination, authenticated author and clean body. Refusals
        keep editable text and acceptance never clears a newer draft.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
        - scheduled-state-streams-through-room-seq-v2
        - target-worktree-owns-qualified-conversation
    - id: unsupported-submissions-can-stop-local-wait-v2
      title: Unsupported submissions preserve uncertainty without automatic replay
      statement: A verified unsupported replacement never automatically replays a
        retained submission. Legacy acknowledgement-only composition retains the
        guarded Stop waiting control; optimistic records retain their captured
        content and explicit uncertainty until local retry, edit or discard.
        Discard stops local recovery without claiming server cancellation.
        Neither a late result nor a capability change clears a newer draft or
        transfers content to another computer.
      reason: Align with independent message-owned submissions; preserve unchanged
        ownership boundaries.
      depends_on:
        - post-capability-recovery-is-owned-and-bounded-v2
        - composer-acknowledgement-preserves-owned-raw-drafts-v2
    - id: sender-receipt-correlation-is-indexed-and-private
      title: Returned records correlate only for their authenticated sender
      statement: Live, replay and HTTP messages/schedules may carry optional
        sender-owned submission correlation derived from durable receipts
        through indexed destination lookups bounded by unique returned records.
        Publication and receipt transactions stay unchanged; no extra browser
        request or polling is introduced. Distinct authors never receive each
        others correlation. A separate capability gates optimistic UI; canonical
        identity reconciles before or after acknowledgement without text
        matching.
      reason: Cover independent transports and lost acknowledgement safely.
      depends_on:
        - post-receipts-commit-atomically-with-routing
