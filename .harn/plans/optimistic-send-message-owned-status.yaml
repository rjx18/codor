id: optimistic-send-message-owned-status
title: Sender-correlated optimistic messages with independent owned submissions
notes: "P1 at 864069b6 with approved amendment #2728/#2743. No publication-order
  or receipt-write change. Indexed returned-record-only projection; no extra
  requests/polling. Measure live/head/acceptance latency and bytes, one-time
  index and incremental cost; prove plans. Immediate rows, independent sends,
  clock/ticks, failure/resend/edit; preserve owner, media, schedule and
  legacy/downgrade safety. Full protocol/switchboard/web tests/builds,
  direct/hosted identity races, packed installed restart proof. P2 skeleton and
  P3 offline/grace excluded."
assumptions:
  retire:
    - id: composer-acknowledgement-preserves-owned-raw-drafts
      reason: Replace acknowledgement-gated singleton semantics and align dependent
        ownership truth.
    - id: composer-memory-survives-session-connector-handover
      reason: Replace acknowledgement-gated singleton semantics and align dependent
        ownership truth.
    - id: pending-submission-retries-only-through-ready-owner
