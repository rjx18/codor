verification: >
  Lock clean on cf293513b877526ab022b92994ae587da15996ce before implementation.
  Record red-first on that exact commit: (1) trace an agent-target due commit
  including inbox frames and show message seq, newer sent-schedule seq, then the
  older message-seq inbox frame; reconnect from each observed cursor and expose
  the ordering breach; (2) inject an exception after the atomic commit but
  before/inside delivery dispatch and show the already-sent schedule is
  broadcast twice instead of leaving one queued delivery to ordinary recovery;
  (3) schedule from an authenticated agent in a registered worktree to a
  qualified foreign target and show missing source author scope either fails
  payload snapshot with no author or loses author_target attribution; (4)
  demonstrate that the current socket-named tests invoke only schemas/daemon
  helpers and that the mandated role/race/restart/removal matrix is absent. Then
  implement the smallest S1-only closure. Run the complete matrix, not
  representative samples: canonical directive placement and examples, ordered
  d/h/m/s, lowercase/malformed cases, clock/ISO offsets, leap/day and
  fixed-offset DST-adjacent clocks, UTF-8/directive/future/horizon bounds, and
  text-only reply/attachment/voice/wait refusals; human and agent authors to
  local human/agent and qualified human/agent targets with exact
  author/recipient attribution; rename, same-handle replacement, removal,
  worktree unregistration/removal/missing/locked states, no fallback/group
  expansion, and restart; tied due rows and cancellation/claim races;
  authenticated owner/admin/member/observer/foreign-room and own/other-agent
  cancellation over an actual server socket with exact success/error refs and
  authoritative terminal no-ops; pending/sending/sent/failed/cancelled reopen
  and daemon boot; injected failure before claim, after claim, before commit,
  after commit, before dispatch, and after dispatch; one bounded unrefed timer,
  24-hour re-arm, wake, shutdown, and background error handling; exactly one
  ordinary message, delivery, durable link, and dispatch after recovery; every
  live message/member/inbox/schedule frame in monotonic producing-seq order,
  replay after every boundary, cold/warm hydration, redaction, and local/remote
  socket parity. Run protocol tests/build, isolated switchboard tests/build
  without changing shared host links, recursive workspace build, serialized
  workspace tests, Harn working/staged/apply checks, and git diff --check. Make
  one acceptance-closure commit and finish clean. Do not integrate Q1, start S2,
  change browser/CLI/cards/composer behavior, add recurrence/cron/edit/bulk/
  scripts/external queues, mutate shared host/node_modules links, delegate, poll
  peers, push, merge, deploy, publish, release, or update the host. Tag the
  local orchestrator exactly once on a genuine blocker or completion with
  commit, red/green evidence, Harn result, and clean status, then stop.
