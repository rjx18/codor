id: persistent-scheduled-messages-s1-acceptance-closure
title: Close scheduled-message ordering, attribution, and recovery acceptance
notes: >
  Final contained S1 correction after independent review of
  cf293513b877526ab022b92994ae587da15996ce. The frozen-recipient and exact
  schedule-seq corrections are directionally right, but the due fanout still
  publishes an agent inbox frame at the message seq after the newer terminal
  schedule frame. A disconnect may therefore observe a cursor regression,
  contrary to the newly applied ordered-cursor truth. The due loop also catches
  post-commit emit/dispatch failures as if the atomic commit failed: it calls
  failSchedule on an already-sent row and broadcasts the same terminal schedule
  again, while ordinary queued-delivery recovery should own that seam. Qualified
  agent-authored schedules do not preserve an author execution/attribution
  target; the destination-room payload snapshot cannot resolve a foreign agent
  author and the scheduled message may fail or lose qualified attribution.
  Finally, the locked review plan promised real socket cancellation, every
  restart/crash state, target removal/replacement/unavailability, author/role
  variants, and reconnect replay, but cf29351 adds only protocol parsing, direct
  daemon calls, two store cases, and four daemon happy-edge cases; its test
  named socket contract never opens a socket. Correct these S1 defects and
  supply the complete acceptance matrix. Preserve the accepted directive
  grammar, durable SQLite state machine, frozen one-recipient routing, exact
  producing sequences, one bounded timer, correlation contract, redaction, and
  all S2/exclusion boundaries.
assumptions:
  reviewed:
    - id: scheduling-directive-is-bounded-and-canonical
      outcome: unchanged
      reason: The accepted lowercase directive, fixed-offset clock, explicit-offset
        ISO, byte, future, and horizon rules remain unchanged; only missing
        ingress refusal coverage is added.
    - id: scheduled-target-identity-is-frozen-at-creation
      outcome: unchanged
      reason: Recipient identity remains frozen; acceptance must prove removal,
        same-handle replacement, qualified unavailability, and no fallback in
        addition to rename.
    - id: scheduled-message-commit-is-exactly-once
      outcome: unchanged
      reason: The transaction remains authoritative; post-commit publication and
        dispatch failures must never be reclassified as a failed commit or
        duplicate terminal fanout.
    - id: scheduled-state-machine-recovers-from-one-next-due-alarm
      outcome: unchanged
      reason: One timer and durable recovery remain the contract; the omitted
        state/crash matrix and long-delay re-arm evidence are required now.
    - id: scheduled-cancellation-is-authorized-before-claim
      outcome: unchanged
      reason: Correlated author/admin cancellation before claim remains the rule;
        prove it through authenticated sockets, repository-related rooms,
        unrelated rooms, roles, agent ownership, races, and terminal no-ops.
    - id: changelog-is-sync-cursor-v2
      outcome: unchanged
      reason: Agent inbox publication must stop regressing from the terminal schedule
        cursor to the earlier message cursor, and replay must converge from
        every frame boundary.
    - id: changelog-covers-every-visible-entity-v2
      outcome: unchanged
      reason: Real transitions still log exactly once and terminal/no-op paths must
        not invent duplicate live schedule frames.
    - id: scheduled-state-streams-through-room-seq-v2
      outcome: unchanged
      reason: Every ordinary message and inbox effect must publish before its terminal
        schedule linkage with its honest producing cursor.
    - id: qualified-member-target-identity-is-durable
      outcome: unchanged
      reason: Qualified scheduled recipients retain exact worktree/conversation/member
        identity through rename, replacement, unavailability, and restart.
    - id: qualified-destination-refusals-are-atomic
      outcome: unchanged
      reason: Invalid or mixed delayed targets still fail before schedule allocation
        and can never fall back.
    - id: target-worktree-owns-qualified-conversation
      outcome: unchanged
      reason: Scheduled messages and deliveries remain solely in the frozen
        destination conversation while retaining honest source-author
        attribution.
    - id: target-worktree-turn-is-local-and-isolated
      outcome: unchanged
      reason: An authenticated agent acting from one active invocation must schedule
        from that exact execution identity rather than an unresolved origin-room
        row.
    - id: agent-orchestration-is-repository-scoped
      outcome: unchanged
      reason: Scheduled creation by an authenticated agent must reuse the same
        repository-scoped target-conversation authority boundary as an ordinary
        post.
    - id: delivery-payload-snapshotted
      outcome: unchanged
      reason: A scheduled agent delivery still snapshots ordinary immutable context,
        now with a resolvable frozen author scope.
    - id: agent-delivery-lifecycle-streams-v2
      outcome: unchanged
      reason: The initial queued agent inbox projection remains live and
        reconnect-safe, but must be emitted before the terminal schedule cursor.
    - id: delivery-attempt-wal-reconcile
      outcome: unchanged
      reason: Once the atomic schedule commit creates a queued delivery, ordinary
        WAL/boot reconciliation owns interruption before or after dispatch.
    - id: delivery-fifo-has-durable-sequence
      outcome: unchanged
      reason: Scheduled deliveries continue to enter the ordinary durable queue once
        and in order.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: Human role capabilities and the narrower own-schedule agent rule remain
        intact and require the omitted authenticated matrix.
    - id: management-frames-correlate-one-result
      outcome: unchanged
      reason: A valid cancel request returns exactly one success or error carrying its
        request ref.
    - id: redaction-before-fanout
      outcome: unchanged
      reason: Schedule acceptance, live, hydration, cancel result, and failure
        projections continue through the sole redaction boundary.
    - id: unix-socket-same-protocol
      outcome: unchanged
      reason: The tested cancellation and schedule frames must be identical on local
        and remote WebSocket paths.
    - id: sync-cursor-commits-after-hydration
      outcome: unchanged
      reason: Cold and warm schedule hydration still completes at the authoritative
        snapshot cursor after redacted entity projections.
    - id: agent-sync-hydrates-only-own-queued-inbox
      outcome: unchanged
      reason: Agent queued-delivery hydration remains recipient-scoped while live
        scheduled ordering becomes monotonic.
anchors:
