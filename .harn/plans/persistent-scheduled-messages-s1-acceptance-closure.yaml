    scheduled-directive-parser:
      action: change
      reason: Keep one captured creation clock and close any integration boundary
        defect exposed by the full matrix.
    scheduled-directive-regression:
      action: change
      reason: Prove canonical examples plus all malformed, size, time, and ingress
        payload refusals.
    scheduled-directive-documentation:
      action: change
      reason: Reconcile the precise cancellation room scope and scheduled attribution
        wording with tested behavior.
  scheduled-target-identity-is-frozen-at-creation:
    scheduled-target-resolution:
      action: change
      reason: Freeze enough source-author scope for qualified agent-authored delivery
        without re-resolving the recipient.
    scheduled-target-regression:
      action: change
      reason: Add human/agent authors, human/agent recipients, removal, replacement,
        worktree lifecycle, restart, and attribution cases.
  scheduled-message-commit-is-exactly-once:
    atomic-scheduled-message-commit:
      action: change
      reason: Separate committed truth from fallible post-commit fanout/dispatch and
        preserve exact author attribution.
    exactly-once-schedule-regression:
      action: change
      reason: Inject every pre/post commit and dispatch interruption and prove one
        linked message and delivery across reopen.
  scheduled-state-machine-recovers-from-one-next-due-alarm:
    durable-schedule-store:
      action: change
      reason: Persist any missing frozen author scope while retaining idempotent
        pending/sending/terminal transitions.
    one-next-due-alarm:
      action: change
      reason: Make re-arm and error handling finally-safe without duplicating terminal
        publication.
    schedule-recovery-regression:
      action: change
      reason: Cover pending, sending, sent, failed, cancelled, simultaneous rows,
        long-delay wake, shutdown, and restart seams.
  scheduled-cancellation-is-authorized-before-claim:
    cancel-schedule-protocol:
      action: change
      reason: Retain required bounded refs and exercise exact success/error
        correlation.
    cancel-schedule-transaction:
      action: change
      reason: Make and document one explicit origin/destination repository-room
        authorization rule and reject unrelated rooms.
    cancel-schedule-race-regression:
      action: change
      reason: Replace direct helper-only checks with real authenticated socket role,
        ownership, room, race, and terminal cases.
  changelog-is-sync-cursor-v2:
    ordered-live-entity-fanout:
      action: change
      reason: Emit the agent queued inbox projection before the newer terminal
        schedule cursor and never regress live seq.
    ordered-live-entity-regression:
      action: change
      reason: Include every message, inbox, member, and schedule frame and reconnect
        after every boundary.
  changelog-covers-every-visible-entity-v2:
    schedule-change-accounting-regression:
      action: change
      reason: Prove exact change rows and absence of duplicate terminal/no-op live
        frames under post-commit failures.
  scheduled-state-streams-through-room-seq-v2:
    schedule-protocol-schema-v2:
      action: change
      reason: Add only the bounded durable author coordinate needed for honest
        qualified scheduled attribution, if required.
    schedule-change-log-storage-v2:
      action: change
      reason: Persist and hydrate the complete schedule while preserving exact
        mutation sequences.
    schedule-sync-and-fanout-v2:
      action: change
      reason: Order agent and human inbox projections before terminal schedule fanout
        and keep all projections redacted.
    schedule-sync-regression-v2:
      action: change
      reason: Prove cold/warm/live/reconnect schedule and linked-message convergence
        for human and agent clients.
  agent-delivery-lifecycle-streams-v2:
    delivery-created-emit:
      action: change
      reason: Reuse ordinary queued delivery semantics while honoring the schedule
        commit's ordered publication boundary.
  agent-orchestration-is-repository-scoped:
    repository-scoped-agent-authorization:
      action: change
      reason: Route scheduled creation through the exact target-conversation identity
        authorized for the authenticated agent.
  target-worktree-turn-is-local-and-isolated:
    qualified-local-turn-orchestration:
      action: change
      reason: Preserve the scheduled author source coordinate across qualified
        delivery and later agent turns.
  delivery-payload-snapshotted:
    daemon-payload-snapshot:
      action: change
      reason: Resolve the frozen scheduled author in its source conversation and
        retain authorTarget in immutable payload context.
  roles-gate-human-acts-not-agents:
    role-matrix-integration:
      action: change
      reason: Exercise cancellation through authenticated owner/admin/member/observer
        and agent sockets.
  management-frames-correlate-one-result:
    management-correlation-server:
      action: change
      reason: Prove each cancellation success or failure emits exactly one frame with
        the submitted ref.
  redaction-before-fanout:
    redacted-frame-emit:
      action: keep
      reason: Scheduled live fanout and direct results must continue through the
        unchanged projector.
