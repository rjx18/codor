id: persistent-scheduled-messages-s1-final-proof
title: Prove the complete S1 authorization, recovery, and replay matrix
notes: >
  Final S1 acceptance proof after independent review of
  b7df32a0a03d52d124f2505175fd24f098de2cde. The runtime corrections for frozen
  attribution, ordered agent inbox fanout, and duplicate terminal schedule
  publication are present, but the committed evidence does not match the locked
  acceptance plan or Lane C S1 requirements. The socket role test named
  owner/admin/member/observer exercises only a member cancelling its own
  schedule and an observer denial; it does not exercise owner/admin authority,
  agent own/other cancellation, origin versus destination administration, or a
  cancellation/claim race. The only daemon restart case begins in sending and
  does not cover pending, sent, failed, cancelled, or the queued delivery left
  by a post-commit dispatch interruption. The reconnect case disconnects before
  due processing and therefore does not reconnect from every message/inbox/
  terminal-schedule frame boundary. Target coverage proves rename and removal
  but not same-handle replacement or worktree unregistered/removed/missing/
  locked behavior. Qualified agent-author coverage calls a daemon method by a
  type cast rather than authenticated ingress. Close these proof gaps, fix only
  defects the missing tests expose, and retain all accepted S1 behavior and S2
  exclusions.
