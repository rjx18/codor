verification: >
  Lock clean on exact base b7df32a0a03d52d124f2505175fd24f098de2cde. First
  record the current proof failures: the role test has no owner/admin path, no
  agent cancellation or claim race exists, only sending is restarted, the
  dispatch-failure test never recovers or dispatches its queued row, the
  reconnect test disconnects before every due frame, qualified author ingress is
  a direct cast, and replacement/worktree-state cases are absent. Add
  deterministic red-first tests where the new cases expose behavior defects,
  then make the smallest S1-only correction. The required green matrix is
  literal: authenticated socket cancellation by author member, owner, origin
  admin, destination admin, and own agent succeeds; nonauthor member, observer,
  unrelated-room/repository admin, and other agent fail; all success/errors echo
  one exact ref; cancellation before claim wins with no message, claim before
  cancellation returns sending/sent and exactly one message;
  pending/sending/sent/failed/cancelled rows survive reopen and repeated daemon
  boot without illegal transitions or duplicate change/live frames; a
  post-commit dispatch interruption leaves one sent link and one queued
  delivery, is observable, and boot reconciliation dispatches it exactly once;
  tied due rows and the sole timer remain ordered, unrefed, bounded to 24 hours,
  re-armed, and cleared on close; local rename delivers the same id, same-handle
  replacement fails, and qualified locked targets remain usable while
  missing/unregistered/removed targets fail explicitly without fallback; an
  authenticated agent schedules a qualified target with exact durable
  author/recipient coordinates; capture ordered message/human-or-agent
  inbox/terminal schedule frames and reconnect from every received cursor, plus
  cold and warm human and recipient-agent hydration, proving redaction, no gaps,
  no duplicates, and exact target-room ownership. Run protocol tests/build,
  isolated switchboard tests/build, recursive workspace build, serialized
  workspace tests, Harn working/staged/apply checks, and git diff --check
  without mutating shared host links. Make one final-proof commit and finish
  clean. Do not integrate Q1, start S2, alter browser/CLI/cards/ composer
  behavior, add recurrence/cron/edit/bulk/scripts/external queues, mutate shared
  node_modules, delegate, poll peers, push, merge, deploy, publish, release, or
  update the host. Tag the local orchestrator once on a genuine blocker or
  completion with exact red/green evidence, commit, Harn result, and clean
  status, then stop.
