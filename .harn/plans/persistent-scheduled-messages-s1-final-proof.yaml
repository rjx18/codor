    - id: delivery-attempt-wal-reconcile
      outcome: unchanged
      reason: Boot reconciliation owns a queued or interrupted delivery after the
        schedule transaction has committed.
    - id: roles-gate-human-acts-not-agents
      outcome: unchanged
      reason: Owner/admin/member/observer capabilities and the narrower agent-own rule
        require actual socket proof.
    - id: management-frames-correlate-one-result
      outcome: unchanged
      reason: Every authorized or refused cancellation must produce exactly one
        success or error carrying its submitted ref.
    - id: redaction-before-fanout
      outcome: unchanged
      reason: All live, replay, and cancellation projections remain redacted during
        the expanded matrix.
    - id: unix-socket-same-protocol
      outcome: unchanged
      reason: The same schedule/cancellation frames and correlation rules must be
        proven on the local socket transport.
    - id: sync-cursor-commits-after-hydration
      outcome: unchanged
      reason: Each replay finishes at the authoritative snapshot cursor after all
        requested rows are projected.
    - id: agent-sync-hydrates-only-own-queued-inbox
      outcome: unchanged
      reason: Agent reconnect proof must see only its own scheduled queued delivery.
