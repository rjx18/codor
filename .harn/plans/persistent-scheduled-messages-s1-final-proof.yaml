    - id: target-worktree-owns-qualified-conversation
      outcome: unchanged
      reason: Authenticated qualified schedules and all replay remain solely in the
        selected target conversation.
    - id: target-worktree-turn-is-local-and-isolated
      outcome: unchanged
      reason: The scheduled delivery starts and recovers through the exact
        target-local runtime.
    - id: target-owned-qualified-execution-requires-usable-checkout
      outcome: unchanged
      reason: Every registered worktree lifecycle and availability state must either
        deliver to the exact stable target or fail explicitly without fallback.
    - id: agent-delivery-lifecycle-streams-v2
      outcome: unchanged
      reason: Scheduled queued agent inbox state remains live and boot-recoverable
