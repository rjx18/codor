verification: >
  Lock clean on exact base 273ee3a9c2c277dd714e149b151fcc3e13bf70ba before
  source edits. Red-first on that commit: (1) rename a frozen local target while
  a different configured default exists and assert the current code sends to the
  wrong id; (2) trace two same-instant due rows and assert current claimed
  frames share the newest seq and terminal schedule precedes its older message,
  then simulate reconnect from every received cursor and show the gap; (3) prove
  a cancel act without ref parses and an admin in an unrelated room can cancel a
  globally found id; (4) prove the current tests omit/allow the required
  restart, worktree, redaction, and race failures. Record those expected
  failures before implementation. Then implement the smallest contained
  corrections and the complete original S1 verification matrix: directive
  position/malformed prefixes, ordered s/m/h/d, case rule,
  `[send_in=2h30m]@sol`, `[send_at=8:30PM]@sol`, Z/offset ISO, leap/day and
  DST-adjacent fixed offsets, UTF-8 byte/directive limits, strict future and
  365-day horizon, text-only refusal; human/agent authors, local and qualified
  exact targets and attribution, rename/removal/replacement/worktree
  unavailability, no fallback or group expansion; simultaneous due rows;
  cancellation/claim and role/room authorization;
  pending/sending/sent/failed/cancelled reopen and boot; injected failures
  around claim/atomic commit/dispatch; one timer/re-arm/shutdown; exact one
  message/delivery/link; producing seq, ordered live frames, cold/warm
  hydration, reconnect replay, redaction, and local-socket protocol parity. Run
  protocol test/build, switchboard test/build, recursive workspace build, and
  serialized workspace tests; run Harn working/staged/apply checks and git diff
  --check; make one review-fix commit and finish clean. Do not mutate the shared
  host checkout or its user-owned node_modules symlinks to manufacture a gate;
  use a worktree-local or temporary isolated resolver, or report the exact
  external link failure separately after all S1-focused gates are proven. Do not
  implement S2/Q1/UI/cards/composer/CLI presentation, recurrence, cron, editing,
  bulk operations, scripts, queues, unrelated cleanup, delegation, peer polling,
  push, merge, deploy, publish, release, or host update. Tag the local
  orchestrator once on a genuine blocker or completion with exact red and green
  evidence, commit, Harn result, and clean status, then stop.
