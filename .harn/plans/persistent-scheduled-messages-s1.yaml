verification: >
  Lock clean before source edits. Red-first: add focused protocol/parser, store,
  daemon, server, and authorization regressions and record their failure on base
  2d5cbbcbd4c40196eb774df252b652ce02c26c74 for the absent
  scheduler/state-machine reason. Use deterministic injected clocks/timers and
  reopen real temporary SQLite databases. Prove directive position and
  malformed-prefix behavior; `[send_in=2h30m]@sol`, `[send_at=8:30PM]@sol`,
  explicit Z/offset ISO, leap/day and DST-adjacent host-offset cases; strict
  future/365-day, directive/body and text-only bounds; local and qualified
  target snapshots; human and agent authorship; author/admin cancellation and
  refusal; simultaneous due rows; cancellation/claim races; restart in pending,
  claimed, sent, failed, and cancelled states; crash boundaries around the
  atomic due commit and dispatch; target rename/removal/replacement/worktree
  unavailability; redacted live and hydrated schedule frames; and exactly one
  ordinary message/delivery set. Run `pnpm --filter @codor/protocol test`, `pnpm
  --filter @codor/protocol build`, `pnpm --filter @codor/switchboard test`, and
  `pnpm --filter @codor/switchboard build`, then the complete serialized
  workspace tests and recursive build because protocol, store schema, routing,
  and boot lifecycle change. Run harn find --changed, harn check, harn apply,
  staged Harn checks, and git diff --check; create one implementation commit and
  finish with a clean worktree. Stop and tag the local orchestrator once on a
  genuine scope/Harn blocker or on completion with the commit, changed files,
  exact red/green evidence, Harn results, and clean status. Do not implement S2,
  Q1, UI/cards/composer/CLI presentation, recurrence/cron/edit/bulk/script/queue
  features, delegate internally, poll peers, push, merge, deploy, publish,
  release, update a host, or start another phase.
