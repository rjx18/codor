verification: >
  Lock clean with dirty_at_lock false on exact base
  fb4f21fefaa9e0325f2f48449319529d54b6f42d. First record the contained red
  evidence: a pending qualified send does not resolve when only its source room
  error count advances; a visible retained pending card allows cancellation with
  no current room-live evidence, the closed connector emits no frame, and the UI
  remains Cancelling; a same-ref error clears pending but renders no exact
  alert; two same-tick cancellation calls are not protected by the rendered
  state; Room 32 and Room 40 contain no scheduled case; Room 42 lacks
  same-instant, disconnect/reconnect, keyboard, dual-theme/full Axe, and
  cancellation-race proof; the CLI suite never submits a scheduled request
  through --url. Add deterministic unit/browser/CLI regressions before the
  smallest client-only correction. Green unit evidence must prove
  destination/self schedule and ordinary echo acknowledgement are unchanged,
  source-room qualified refusals preserve exact raw text for both branches,
  per-ref error text cannot cross schedules, offline/current-generation-not-live
  Cancel is disabled, one synchronous request carries one exact id ref, a
  matching error renders inline and re-enables retry, and authoritative
  cancelled/sending/sent results win. The direct Room 42 journey must prove
  explicit same-instant ordering and named local zone, retained card across
  disconnect/reconnect with disabled mutation, keyboard cancellation,
  cancellation/claim one-winner truth, one delivered message with no sent card,
  390px 44px/no-overflow, and full scheduled-surface Axe in explicit light and
  dark modes. Room 32 must create a pending schedule through the hosted relay,
  retain it disabled across host-generation loss, resume/settle it after fresh
  server evidence, and keep all routed traffic from leaking to the SPA origin.
  Room 40 must submit a raw-whitespace qualified schedule from the root, clear
  only on authoritative target acknowledgement, and show it only in the selected
  target child. CLI must submit one scheduled post over a real remote WebSocket
  URL and exit with the stable scheduled line. Run focused
  composer/store/connector/card/transcript and CLI tests, then full protocol,
  web-next, CLI, and switchboard tests/builds; run direct Room 2, Room 5, Room
  32, Room 40, and Room 42 specs; run recursive workspace build and serialized
  tests using isolated dependency resolution without changing shared host links.
  Run Harn working check, apply, staged check, find --changed, git diff --check,
  create exactly one review-fix commit with applied truth, and finish clean. Do
  not change protocol or server scheduling/authorization, polling,
  recurrence/cron/edit/reschedule/bulk/script/attachment/reply/voice/wait
  scheduling, offline queues, history architecture, deployment, release, or any
  unrelated behavior; do not mutate shared node_modules/host links, delegate,
  poll/remind peers, push, merge, deploy, publish, or release. Tag the local
  orchestrator once on genuine blocker or completion with exact red evidence,
  green counts, Harn result, commit, and clean status, then stop.
