verification: >
  Lock clean with dirty_at_lock false on exact base
  52cc30c54961d19cc11bfeee8be95b7e04edfd5e. Before implementation, add and run
  literal regressions that fail on the accepted base because the browser store
  ignores schedule frames, the composer never clears from an accepted schedule,
  codor post waits forever after the schedule frame, no cards exist, and browser
  cancel acts carry no required ref. Use an injected fixed instant and zones to
  record friendly `[send_at=8:30PM]@viewer ...` becoming the same explicit
  offset-bearing request from browser and CLI; prove half-hour,
  positive/negative offset and next-day cases while send_in, explicit ISO,
  malformed directive-like input, and `example [send_at=8:30PM]` retain their S1
  behavior. Then make the smallest S2-only implementation. The green unit matrix
  must prove: cold, warm, live, qualified and cancel-result schedule upserts in
  the correct room and at the correct cursor; Pending, Sending, Failed and
  Cancelled cards with stable due/created/id ordering and exact local/qualified
  labels; sent suppression both before and after its linked message is in the
  bounded transcript; viewer-local date/time/zone and bounded preview;
  author/owner/admin Cancel only, member/observer hidden, one exact schedule-id
  ref, disabled in flight, server result wins a claim race, and error restores
  an actionable control; scheduled composer clear only for a new matching
  destination/self/clean-body row and only if the raw draft is unchanged, with
  edit, other author, old id, qualified room, refusal and all existing Q1
  ordinary cases preserved; CLI ordinary output unchanged, scheduled output
  exits once, pre-existing/foreign rows cannot acknowledge, qualified acceptance
  follows the target-owned frame, transport errors are explicit, and scheduled
  --wait is refused rather than weakened. The direct schedule Playwright journey
  must cover immediate card, offset display, same-instant order,
  reload/reconnect, cancel-before-claim, due reconciliation into exactly one
  ordinary message, 390px no-overflow/44px target, keyboard, light/dark and Axe;
  the hosted relay journey must retain and update a pending card across a
  host-generation reconnect without direct-origin leakage; the native worktree
  journey must submit and render only in the selected qualified conversation and
  preserve Q1 raw-draft behavior. Run focused protocol,
  store/connector/composer/card/transcript and CLI tests first; then complete
  protocol, CLI, and web-next tests/builds; run the direct Room 2 Q1 regression,
  Room 5 mobile gate, Room 32 hosted relay, Room 40 native worktree, and new
  Room 42 schedule Playwright specs in isolated harnesses; run the packed
  installed CLI gate; run recursive workspace build and serialized workspace
  tests if dependency resolution is isolated from shared host links. Run Harn
  working check, apply, staged check, git diff --check, create exactly one S2
  implementation commit containing applied plan/truth, and finish clean. Do not
  change the S1 server scheduler/state machine or authorization, add a polling
  API, recurrence/cron/edit/reschedule/bulk/script/attachment/reply/voice/wait
  scheduling, offline queue, history redesign, raw colors, or unrelated UI; do
  not mutate shared node_modules or host links, delegate, poll/remind peers,
  push, merge, deploy, publish, release, or update the host. Tag the local
  orchestrator once on genuine blocker or completion with exact red evidence,
  green counts, Harn result, commit, and clean status, then stop.
