id: prose-event-semantics-p2-presentation-parity
title: P2 preserve explicit prose boundaries through live and historical transcripts
notes: >
  Implement only Lane E phase P2 from the accepted parallel reliability program.
  The exact accepted Lane A dependency head
  3164948cd83bb31e3c20fd2ecc8920e060abb41d is already integrated, including H1
  7c8c95e7474f4acf22eb1483a382f86861a888ac, H2
  aaaad27fb60d02fc3c8b68d67cee769e32c13a76, and its accepted correction. The
  clean combined base is merge commit 297c263b88b71db82d8f034c6a7665c87150c452.

  Carry P1's additive text_block through the existing continuation projector,
  shared live/history run presenter, server transcript unitizer, and H2
  combined-head lifecycle. A text_delta is an incomplete fragment and
  concatenates only with compatible deltas in the same output-owned prose run;
  timestamps and activity in another permanent output row do not create a
  boundary. A text_block is one already-complete native prose block and must
  remain its own visible paragraph/unit. Transitions to or from a block, and
  consecutive blocks, preserve an explicit paragraph boundary in projected
  message bodies without prefixing an empty output row or treating a row
  allocation itself as prose syntax.

  Keep native/raw text aggregation distinct from visible paragraph joining
  wherever terminal final_text deduplication requires it. A completed block must
  count as streamed prose for allocation and fallback suppression, while modern
  projected message bodies must compare against the same visible joined form
  that the browser renders. Preserve old text_delta journals without migration;
  malformed payload fallback; reasoning suppression; tool pairing; compaction;
  first-contributing-event timestamps; permanent output ownership; stable unit
  keys and anchors; H2 authoritative order and reader offset; the
  twenty-visible-unit page budget; continuation interleaving; pins, search, and
  permalinks; and the ban on cold finalized /runs/:id reads. Do not alter
  protocol/adapters, native classification, page shape/cursors, H2 merge policy,
  transport, styling, or unrelated transcript behavior.
assumptions:
  create:
    - id: explicit-prose-boundaries-survive-transcript-lifecycle
      title: Explicit prose event boundaries survive every transcript lifecycle
      statement: >
        Every transcript consumer must concatenate compatible text_delta
        fragments exactly while presenting each text_block as one complete
        visible paragraph, preserving a paragraph boundary at every transition
        to or from a block and between consecutive blocks; time gaps and events
        owned by another permanent output row never invent a prose boundary,
        final-text fallback compares the appropriate raw or visible projection
        without duplication, and the same stable units, anchors, order, and text
        must survive live display, settlement, combined-head reconciliation,
        bounded paging, room switching, and reload for old delta-only journals,
        block-native journals, and mixed text/tool evidence.
      reason: >
        P1 records whether native prose is a fragment or a complete block, but
        the current projector, unitizer, and presenter recognize only
        text_delta, so completed blocks degrade to generic tool rows or vanish
        from projected bodies and history.
      depends_on:
        - native-prose-completeness-is-explicit
        - continuation-writer-follows-journaled-output-ownership
        - normalized-run-items-presented-live
        - historical-transcript-pages-match-output-scoped-rendering
        - finalized-browser-history-is-combined-page-owned
        - combined-head-adopts-authoritative-overlap-order
        - combined-head-preserves-reader-unit-offset
        - live-runs-settle-beside-paged-history-once
  reviewed:
    - id: native-prose-completeness-is-explicit
      outcome: unchanged
      reason: >
        P2 consumes P1's native-path classification without changing protocol,
        adapters, schemas, or any classification seam.
    - id: continuation-writer-follows-journaled-output-ownership
      outcome: unchanged
      reason: >
        Text blocks use the same transactionally allocated permanent output ids;
        projection changes only prose joining and terminal deduplication.
    - id: normalized-run-items-presented-live
      outcome: unchanged
      reason: >
        The shared presenter continues safe parsing, exact journal order, tool
        pairing, and live/journal index reconciliation while distinguishing a
        complete prose block from compatible fragments.
    - id: prose-blocks-carry-first-delta-timestamps
      outcome: unchanged
      reason: >
        A coalesced delta row retains its first fragment timestamp and a
        complete block row retains its own timestamp; no timing heuristic
        controls prose boundaries.
    - id: historical-transcript-pages-match-output-scoped-rendering
      outcome: unchanged
      reason: >
        The server continues counting exactly what the browser renders, now with
        each complete native block as an indivisible prose unit and compatible
        deltas coalesced per permanent output.
    - id: transcript-history-cursors-cover-complete-established-order
      outcome: unchanged
      reason: >
        The immutable ceiling, twenty-unit budget, cursor boundary, and complete
        established order remain unchanged while the corrected visible units
        participate in them.
    - id: finalized-browser-history-is-combined-page-owned
      outcome: unchanged
      reason: >
        Finalized blocks are rendered only from combined-page units and their
        indexed excerpts, never by fetching a cold full journal.
    - id: combined-head-adopts-authoritative-overlap-order
      outcome: unchanged
      reason: >
        H2's stable-key overlap splice is type-agnostic and remains
        authoritative; P2 proves block units retain exact server order across
        the lifecycle.
    - id: combined-head-preserves-reader-unit-offset
      outcome: unchanged
      reason: >
        Separate block units expose stable intra-message anchors that continue
        using H2's single pre-paint offset owner.
    - id: live-runs-settle-beside-paged-history-once
      outcome: unchanged
      reason: >
        Live block evidence remains uncapped and hands off exactly once to
        immutable indexed page units without a terminal journal fetch.
    - id: transcript-targets-walk-combined-pages
      outcome: unchanged
      reason: >
        Search, pin, inbox, and permalink navigation continue walking stable
        message/output targets through bounded pages; prose event type does not
        change target identity.
    - id: paged-history-live-message-reconciliation
      outcome: unchanged
      reason: >
        Newer live pin/deletion records still reconcile by message sequence
        without changing page-owned block-unit membership or order.
    - id: run-evidence-search-is-bounded-and-redacted
      outcome: unchanged
      reason: >
        Run search remains deliberately limited to projected tool titles and
        outputs; adding visible prose blocks neither widens nor leaks its scope.
    - id: permalink-ids-stable
      outcome: unchanged
      reason: >
        Message and output ids remain the public anchor identity while stable
        intra-message unit keys derive from unchanged journal indices.
    - id: pins-are-durable-owner-admin-markers
      outcome: unchanged
      reason: >
        Paragraph presentation does not change pin authority, durable state, or
        message identity.
