verification: >
  Before product edits, add focused unit regressions for one canonical journal
  containing compatible deltas, consecutive complete blocks, transitions in both
  directions, a same-output tool pair, an event on another permanent output, and
  a terminal final_text. Record failures on the clean combined base:
  continuation projection omits block text, the presenter exposes blocks as
  generic tool rows, and server history either omits them or counts the wrong
  stable units. Add browser lifecycle coverage before its product fix and record
  a semantic assertion failure rather than a fixture, timeout, or infrastructure
  failure.

  Green unit coverage must prove: deltas concatenate exactly despite timestamps
  or other-output activity; every block/transition is a distinct visible prose
  row and stable unit with first-event timestamp and exact event indices;
  projected bodies retain paragraph boundaries without a leading empty-row
  delimiter; raw/visible terminal comparison adds a true residual once and never
  duplicates complete prose; tools, reasoning, compaction, malformed payloads,
  output ownership, and result ids remain unchanged; twenty means twenty
  rendered units; H2 authoritative merge keeps exact stable-key order and reader
  anchors; and old delta-only journals still render identically.

  The Room 23 production-style journey must run equivalent delta-native and
  block-native fixtures with mixed prose/tool evidence and compare exact visible
  text, unit keys, permanent row order, and absence of duplicates while live,
  after settlement/head handoff, after a deliberate older-page fetch, after an
  in-document room switch away/back, and after reload. Assert no cold finalized
  /runs/:id request and retain permalink/target, pin sequence, and reader-offset
  checks already owned by H2. Run focused continuation/history/presenter/
  Transcript/transcript-history units, the complete switchboard suite, all web
  units, recursive pnpm -r build, and the complete isolated Room 23 Playwright
  suite. Run harn find --changed, harn find --plan, harn check, staged Harn
  find/check, git diff --check, and the shared pre-commit hook flow; create
  exactly one implementation commit consuming this plan. Stop for independent
  review without starting any other phase, pushing, merging, deploying,
  publishing, releasing, or updating a host.
