anchors:
  reconnect-safe-post-dispatch-preserves-draft:
    runtime-post-dispatch-result:
      action: change
      reason: >
        Return a truthful accepted/rejected result from direct WebSocket post
        dispatch, including a send-time close race.
    connector-post-dispatch-result:
      action: change
      reason: >
        Preserve the same boolean result for hosted and multiplexed room
        connector post dispatch without changing reconnect behavior.
    cached-connector-rejection:
      action: change
      reason: >
        Keep disconnected cached session shells explicitly rejecting post
        dispatch while preserving their existing read-only semantics.
    composer-rejection-unlocks-draft:
      action: change
      reason: >
        Release the pending latch and retain draft-owned reply/attachment state
        when transport rejects the post, with actionable retry guidance.
    post-dispatch-unit-regression:
      action: change
      reason: >
        Prove unavailable direct and hosted socket sends report false and do not
        emit a queued or phantom frame.
    composer-rejection-regression:
      action: change
      reason: >
        Prove a rejected dispatch preserves an exact raw draft and becomes
        retryable rather than remaining locked.
    reconnect-first-post-browser-regression:
      action: change
      reason: >
        Prove the first explicit post after hosted reconnect is accepted and
        echoed without refresh, while retaining the existing no-queue boundary.
verification: >
  Run focused ws/connector/Composer/session units, the hosted relay recovery
  browser journey, all web-next units, the production/PWA build, Harn find/plan
