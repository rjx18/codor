id: relay-onboard-p7-browser-failover
title: relay-onboard P7 - browser alias failover, codor pair TUI card, relay
  pair body fix
anchors:
  terminal-pairing-qr-matches-plain-url:
    pair-qr-command:
      action: change
      reason: On a TTY, codor pair renders the SAME bordered pairing card as setup's
        final step (renderPairingCard reuse, Richard msg 516) with a doors-aware
        instruction line; the QR still encodes exactly the printed pairing URL.
        Non-TTY output keeps the existing plain lines verbatim, so piped/test
        output is unchanged.
  pairing-code-enrollment-surfaces:
    pair-code-command:
      action: change
      reason: Nested inside the pair command body being edited; the code still
        surfaces on every path - inside the card on TTY, as the plain `code:`
        line otherwise.
  continuation-writer-follows-journaled-output-ownership:
    continuation-cli-format:
      action: change
      reason: Top-of-file import of renderPairingCard may attribute to an early
        top-level anchor (known harn import-attribution quirk); continuation
        output behavior is untouched.
  human-facing-surfaces-call-rooms-channels:
    cli-channel-terminology:
      action: change
      reason: The CliContext interface gains an isTTY override next to this anchor's
        region and the import shifts attribute here (harn attribution quirk); no
        user-facing terminology changes - channels stay channels.
