      action: change
      reason: New shared Keepalive helper (create) anchored in
        packages/tunnel/src/keepalive.ts.
  pairing-room-lifecycle:
    pairing-room-behavior:
      action: change
      reason: Arm the codor-ping auto-response on PairingRoom, mirroring SessionRelay,
        so the pairing host's keepalive is answered without waking the object.
  relay-link-lifecycle:
