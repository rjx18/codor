    permalink-target-markup:
      action: change
      reason: Mark all extra historical/live targets as row-relative, layout-neutral
        anchors.
    permalink-target-layout:
      action: change
      reason: Remove target spans from flex flow without changing their row-relative
        jump position.
    permalink-target-renderer-regression:
      action: change
      reason: Cover target identity and alignment inputs for grouped/ungrouped,
        tombstone, and tool rows.
    permalink-target-browser-regression:
      action: change
      reason: Reproduce the 12px displacement and verify aligned columns, fragment
        links, and accessibility on desktop/mobile.
  permalink-ids-stable:
    permalink-target-browser-regression:
      action: change
      reason: Extend fragment coverage to extra live and historical target ids without
        changing id allocation.
verification: >
  Check and clean-lock this plan from the exact clean
  7cc14cd6c6ec5ed552361384ac68b997fe68744f base before editing. Reproduce the
  Capri extra-anchor displacement through the actual renderer. Run focused
  Transcript/run-timeline units, all web-next units, the production/PWA build,
  and isolated desktop/mobile browser checks covering multiple historical and
  live anchors, grouped and ungrouped rows, tombstones, merged tool output,
