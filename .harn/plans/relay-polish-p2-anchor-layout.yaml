id: relay-polish-p2-anchor-layout
title: Keep invisible transcript permalink targets out of flex row layout
notes: >
  Implement the contained Phase 2 renderer correction on the exact integrated
  base 7cc14cd6c6ec5ed552361384ac68b997fe68744f. Historical and live transcript
  rows may carry additional permanent #N targets for output and lifecycle-root
  identities, but those invisible targets must not become flex items. Keep their
  ids and row-relative jump positions, all existing prose/tool/tombstone
  rendering and grouping, and every server/history/storage boundary unchanged.
assumptions:
  create:
    - id: transcript-permalink-targets-are-layout-neutral
      title: Invisible transcript permalink targets do not participate in row layout
      statement: >
        Every invisible historical or live permalink target retains its
        permanent room-local id and resolves to the same rendered row, but has
        no flex-flow footprint. A target for an output, lifecycle root, grouped
        or ungrouped row, tombstone, or merged tool presentation therefore
        leaves avatar, header, and text columns aligned while preserving desktop
        and mobile fragment jumps. Finalized combined-history membership, live
        grouping, tool evidence, tombstone placement, and the existing scroll
        owner remain unchanged.
      reason: >
        Additional target spans are currently direct children of flex transcript
        articles. aria-hidden does not remove them from layout, so each extra
        span contributes the row gap and displaces the visible columns by 12px.
        The correction belongs at the target markup/layout seam, not in history
        unitization, grouping, or a fixture-specific geometry override.
      depends_on:
        - permalink-ids-stable
        - transcript-targets-walk-combined-pages
        - tool-only-evidence-batches-across-invisible-output-boundaries
        - visible-transcript-grouping-ignores-hidden-boundaries
        - finalized-browser-history-is-combined-page-owned
  reviewed:
    - id: permalink-ids-stable
      outcome: unchanged
      reason: Permanent room-local ids and fragment link behavior remain unchanged.
    - id: transcript-targets-walk-combined-pages
      outcome: unchanged
      reason: Explicit target walking, page membership, and jump orchestration are
        untouched.
    - id: tool-only-evidence-batches-across-invisible-output-boundaries
      outcome: unchanged
      reason: Tool grouping and associated evidence remain exactly as rendered today.
    - id: visible-transcript-grouping-ignores-hidden-boundaries
      outcome: unchanged
      reason: Grouped/ungrouped presentation state is not changed by target layout.
    - id: finalized-browser-history-is-combined-page-owned
      outcome: unchanged
      reason: Finalized transcript membership and ordering remain page-owned.
    - id: deleted-messages-purge-rows-and-files
      outcome: unchanged
      reason: Tombstone identity and placement remain intact.
    - id: transcript-tail-follow-has-one-prepaint-owner
      outcome: unchanged
      reason: Existing transcript scroll and older-page anchoring remain the sole
        geometry owner.
files:
