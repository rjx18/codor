id: relay-polish-p4-history-ownership-cache
title: Bind history operations and coalesce hosted background work
notes: >
  Phase 4 only at 03e831de. Capture source store, room, token, transport and
  generation for an entire operation; abort/retire obsolete generations.
  Preserve foreground view retirement, all subscriptions, complete evidence,
  authoritative deletion order and 20/40-slot bounds. Prune history-owned maps
  to retained units. Reuse valid cached overlap before fetching a predecessor.
  Debounce snapshot construction/serialization using the latest valid connected
  state; dispose/forget cancels and drains pending work. Ignore unchanged
  connection and summary inputs. Filter live-only continuations from immutable
  warming and bound coalesced background work across rooms/computers to two
  jobs, allowing selected-room requests immediate priority. No authentication
  policy, reconnect escalation, wire schemas, durable outbox or backend changes.
assumptions:
  create:
    - id: history-operations-retain-session-ownership
      title: History operations retain their session and generation
      statement: >
        Every history head, predecessor, older request and explicit walk
        captures its concrete store, room, token and fetch transport once.
        Replacing or disposing its tunnel generation aborts pending requests and
        prevents old results, failures or target walks from committing or
        issuing further work. A computer switch alone cannot reroute an owned
        background request.
      reason: Global transport changes must never cross computer ownership.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
    - id: history-background-work-is-coalesced-and-retained-data-bounded
      title: History background work and retained data follow visible ownership
      statement: >
        Discarded history units release unreferenced historical bodies and
        events; retained older units and live evidence keep their owners. Cached
        overlap avoids an unnecessary predecessor within the two-page bound.
        Only relevant changed room evidence schedules immutable warmups, with at
        most two concurrent background jobs and one latest trailing intent per
        room. Snapshot preparation runs after debounce on the latest valid owned
        state and cannot resurrect forgotten computers. Unchanged connection and
        summary inputs do not publish redundant updates.
      reason: Bound avoidable CPU, network and retained memory while preserving
        subscriptions.
      depends_on:
        - combined-head-reconciliation-is-two-page-bounded
  reviewed:
