  reviewed:
    - id: relay-read-renewal-retains-original-owner
      outcome: unchanged
      reason: Retain head coalescing across the permitted retry.
    - id: history-operations-retain-owner-across-renewal
      outcome: unchanged
      reason: Retire only genuinely obsolete ownership and settle its flags safely.
    - id: hosted-app-keeps-all-paired-computers-live
      outcome: unchanged
      reason: Attribute diagnostics to the captured session.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: Pass the existing public computer identifier into diagnostics.
    - id: app-liveness-recovery-is-stream-first
      outcome: unchanged
      reason: Keep recovery policy while identifying each event's owner.
    - id: hosted-bootstrap-requests-are-abortable-and-generation-bounded
      outcome: unchanged
      reason: Add only ownership metadata to HTTP diagnostics.
