id: relay-polish-p5-review-renewal-ownership
title: Keep renewed heads coalesced and attribute recovery diagnostics
notes: >
  Review correction at e2d464a7. Successful same-generation credential renewal
  must keep the authoritative head request registered while it retries. Genuine
  generation retirement and revocation still clear obsolete requests. Release
  flags owned by an abandoned operation without clearing a newer operation.
  Capture non-secret computer/room/generation diagnostics and seed/assert a real
  large archive with tool evidence in the sustained hosted browser journey.
  Preserve one bounded read retry and zero mutation retries. No Worker/P6/P7.
