id: relay-polish-p5-transport-recovery
title: Preserve relay authentication and bound stream recovery
notes: >
  Phase 5 only on 119f5c5f. Preserve app 4401/4403 close semantics across the
  existing mux reset representation. Coalesce owned credential renewal, retain
  expiry and retry GET/HEAD at most once after renewal while migrating only that
  read to the new credential within its original tunnel generation. Never replay
  writes. Integrate with P4 retirement so old responses cannot commit and fresh
  reads do not strand. Use current app traffic as liveness, repair app streams
  before escalating an unresponsive connected tunnel, and reset backoff only on
  server evidence. Bound HTTP duration and clear cancelled buffers, make message
  reassembly linear, honor send-window backpressure and yield bulk HTTP batches.
  Keep bounded diagnostics free of queries, plaintext messages and credentials.
  Worker, wire format and acknowledged posts unchanged.
assumptions:
  retire:
    - id: history-operations-retain-session-ownership
      reason: Permit one authenticated read retry while keeping the original computer
        and generation.
    - id: hosted-foreground-watchdog-defers-while-http-active
      reason: An unsettled HTTP request is not liveness proof; every request now has a
        bounded lifetime.
  create:
    - id: history-operations-retain-owner-across-renewal
      title: History keeps its owner while renewing read credentials
      statement: >
        Every head, predecessor, older request and explicit walk captures its
        concrete store, room and transport. Each read attempt captures a token;
        one idempotent retry may adopt freshly renewed credentials only within
        the original computer and tunnel generation. Replacing or disposing that
        generation aborts pending work and prevents stale responses or failures
        from committing or restarting. Switching computers cannot reroute owned
        background requests.
      reason: Make credential renewal explicit without weakening P4 ownership.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
    - id: app-liveness-recovery-is-stream-first
      title: App recovery trusts traffic and repairs streams before tunnels
      statement: >
        Valid current-generation application traffic satisfies liveness despite
        a delayed rooms reply. Pending HTTP alone cannot indefinitely suppress
        recovery. A connected tunnel first repairs the app stream, then
        escalates persistent silence to tunnel recovery; auth, upgrade and
        manual parks remain terminal to automatic recovery. Retry backoff resets
        only after server evidence. Periodic probes remain refresh-neutral.
      reason: Separate evidence of delayed reconciliation from a dead transport.
      depends_on:
        - foreground-watchdog-probes-are-refresh-neutral
    - id: relay-read-renewal-retains-original-owner
      title: Credential renewal preserves the originating read owner
      statement: >
        Managed credentials retain expiry and renewal coalesces per computer.
        Only idempotent GET/HEAD reads may retry once after credential renewal,
        within their original non-disposed tunnel generation. P4 retirement
        cannot strand the refreshed read or permit old-credential results to
        commit; writes are never automatically replayed.
      reason: Close-code fidelity and renewal must compose with request retirement.
      depends_on:
        - history-operations-retain-owner-across-renewal
        - paired-browser-challenge-session
