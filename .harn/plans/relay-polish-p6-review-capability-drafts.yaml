id: relay-polish-p6-review-capability-drafts
title: Recover unknown post capabilities and preserve cached startup compositions
notes: One contained P6 correction on ddc0e629b030d5cb6e6ea5a26cd4205227a0eaf2.
  Preserve reviewed server receipt transactions and accepted P7/P5 teardown
  code. Distinguish unknown capability from verified unsupported; bounded
  coalesced owned reads with renewal, no unsafe replay; explicit local waiting
  release only after checking delivery. Preserve composition across same-session
  cached/live connector handover. Remove all permitted seal-error exceptions and
  prove zero-error direct/hosted installed daemon restarts. Full web suite,
  affected regressions, compatibility matrix, production/PWA build and locally
  packed installed proof. Use the established mechanical draft-plan checkpoint
  if needed for a clean lock.
assumptions:
  retire:
    - id: composer-drafts-stay-in-memory-with-source-owner
      reason: Replace connection-instance ownership with stable in-memory
        computer-session ownership.
  create:
    - id: composer-memory-survives-session-connector-handover
      title: Composition memory survives cached-to-live session handover
      statement: A computer session gives its cached and live connectors the same
        nonpersistent composition owner. Body, edited-empty state, reply,
        uploaded attachment selection, completed voice metadata and pending
        result state stay scoped to that owner and room across connector
        replacement. Other computer sessions, forgotten pairings and page
        reloads cannot inherit the memory. No draft or outbox is written to
        persistent storage.
      reason: Correct the connection-instance ownership that loses drafts on cached
        startup.
      depends_on:
        - hosted-computer-sessions-keep-state-isolated
        - composer-acknowledgement-preserves-owned-raw-drafts
        - pending-submission-retries-only-through-ready-owner
    - id: post-capability-recovery-is-owned-and-bounded
      title: Unknown post capability retries through its ready owner
      statement: Timeouts, transport errors and failed compatibility responses leave
        post capability unknown, distinct from verified supported or
        unsupported. One bounded abortable compatibility check per owning socket
        generation uses that session's credential renewal, coalesces concurrent
        intent, and retries unknown results with bounded backoff while the
        connection is healthy. Generation retirement and
        auth/manual/upgrade/disposal parks cancel the checks. Only verified
        support permits replay of the original immutable pending ID;
        verification never replaces a healthy connection or sends legacy
        retries.
      reason: A transient read failure must not permanently strand a pending
        submission.
      depends_on:
        - pending-submission-retries-only-through-ready-owner
        - relay-read-renewal-retains-original-owner
        - hosted-app-streams-follow-tunnel-generations
    - id: unsupported-submissions-can-stop-local-wait
      title: Unsupported pending submissions can release local waiting explicitly
      statement: A verified unsupported replacement exposes an explicit
        originating-submission control to stop waiting after the user confirms
        checking delivery. It releases only that local pending latch, preserves
        the editable composition, warns that delivery remains uncertain and does
        not claim server cancellation. It sends no post or cancellation, never
        automatically retries through legacy semantics, and ignores late results
        for the released ID.
      reason: Actual downgrade needs a usable recovery path without duplicate legacy
        sends.
      depends_on:
        - post-capability-recovery-is-owned-and-bounded
        - composer-acknowledgement-preserves-owned-raw-drafts
