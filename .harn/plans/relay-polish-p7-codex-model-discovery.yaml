    adapter-refresh-client:
      action: remove
      reason: Update the client marker only.
  adapter-refresh-rediscovers-installed-models:
    adapter-refresh-runtime:
      action: change
      reason: Background rediscovery for installed adapters.
    adapter-refresh-rest:
      action: change
