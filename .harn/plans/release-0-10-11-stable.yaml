id: release-0-10-11-stable
title: Advance the accepted main tree to immutable stable release 0.10.11
notes: >
  Release-only change after the complete combined tree passed local and GitHub
  verification. Advance every non-legacy common-version manifest, the companion
  VS Code extension manifest, ACP client identity, and the exact release-audit
  expectation from 0.10.10 to 0.10.11. Do not change runtime behavior, package
  composition, install behavior, workflow policy, or release permissions. The
  commit must land on main and pass CI before a signed v0.10.11 tag is pushed;
  the existing tag workflow then runs the complete release gate, publishes the
  exact TGZ to npm with provenance/latest, and creates the GitHub Release with
  TGZ, VSIX, and checksums.
assumptions:
  retire: []
  create: []
  reviewed:
    - id: installed-or-published-release-artifacts-are-version-immutable
      outcome: unchanged
      reason: 0.10.10 is already published, so the accepted new bytes receive the
        unique 0.10.11 identity.
    - id: release-candidate-requires-publishable-install-tarball
      outcome: unchanged
      reason: The existing exact-candidate, packed-proof, signed-tag, and
        publishable-TGZ gates remain authoritative.
    - id: github-tags-publish-one-immutable-alpha-or-stable-release
      outcome: unchanged
      reason: The existing main-contained signed-tag workflow remains the only
        publisher and uses npm OIDC provenance.
    - id: public-package-bundles-complete-codor-runtime
      outcome: unchanged
      reason: Only the common package version advances; artifact discovery and bundled
        runtime composition are unchanged.
    - id: public-npx-install-is-primary-install
      outcome: unchanged
      reason: The operator command remains npx @richhardry/codor install and resolves
        the new latest version after publication.
    - id: vscode-copilot-bridge-is-manual-local-and-credential-private
      outcome: unchanged
      reason: The companion VSIX remains manual, loopback-only, and
        credential-private; only its release identity advances.
    - id: acp-v1-events-and-capabilities-are-negotiated
      outcome: unchanged
      reason: ACP behavior and negotiation are unchanged; clientInfo reports the
        common 0.10.11 release identity.
    - id: workspace-gates-cover-all-buildable-projects
      outcome: unchanged
      reason: Existing recursive build and serialized tests remain mandatory in main
        CI and the tag release gate.
anchors:
  installed-or-published-release-artifacts-are-version-immutable:
    replaceable-preinstall-release-audit:
      action: change
      reason: Advance the exact immutable candidate version expected by the release
        audit to 0.10.11.
  acp-v1-events-and-capabilities-are-negotiated:
    acp-adapter-runtime:
      action: change
      reason: Advance only the ACP initialize clientInfo version to 0.10.11.
files:
  - package.json
  - packages/adapters/acp/package.json
  - packages/adapters/acp/src/adapter.ts
  - packages/adapters/antigravity/package.json
  - packages/adapters/claude-code/package.json
  - packages/adapters/codex/package.json
  - packages/adapters/copilot/package.json
  - packages/adapters/copilot/vscode-extension/package.json
  - packages/adapters/cursor/package.json
  - packages/adapters/gemini/package.json
  - packages/adapters/opencode/package.json
  - packages/bridges/core/package.json
  - packages/bridges/slack/package.json
  - packages/bridges/telegram/package.json
  - packages/cli/package.json
  - packages/protocol/package.json
  - packages/switchboard/package.json
  - packages/web-next/package.json
  - relay/package.json
  - scripts/release-audit.mjs
  - website/package.json
verification: >
  Verify every tracked non-legacy package manifest is exactly 0.10.11 and the
  three explicit legacy manifests remain exempt. Run recursive workspace build,
  ACP tests, release and license audits, artifact build/inspection, Harn checks,
  and git diff checks. Push the version commit to main, require main CI green,
  create and push signed tag v0.10.11, require the complete release workflow
  green, then verify npm latest, GitHub Release assets/checksums, and the public
  npx install metadata. No direct npm publish or mutable artifact replacement.
applied:
