  - packages/bridges/telegram/package.json
  - packages/cli/package.json
  - packages/protocol/package.json
  - packages/switchboard/package.json
  - packages/web-next/package.json
  - relay/package.json
  - scripts/release-audit.mjs
  - website/package.json
verification: >
  Verify every tracked non-legacy package manifest is exactly 0.10.12 and the
  explicit legacy manifests remain exempt. Run recursive build, release and
  license audits, artifact build and inspection, Harn checks, and diff checks.
  Push the version commit to origin/alpha, require alpha CI green, create and
  push signed tag v0.10.12, require the release workflow green, then verify npm
  alpha, GitHub prerelease assets and checksums, and public npx alpha metadata.
  Do not update npm latest or push this commit to main as part of the alpha
  test.
