id: release-0-10-12-alpha
title: Publish the accepted updater and relay improvements as alpha 0.10.12
notes: >
  Advance the accepted local main tree from 0.10.11 to the unique 0.10.12
  release identity for an alpha-only publication. Change no runtime behavior,
  package composition, install behavior, workflow policy, or release
  permissions. Push the release commit only to the curated alpha branch; after
  alpha CI passes, push the signed v0.10.12 tag so the existing release workflow
  publishes npm dist-tag alpha and a GitHub prerelease without moving latest.
assumptions:
  retire: []
  create: []
  reviewed:
    - id: installed-or-published-release-artifacts-are-version-immutable
      outcome: unchanged
      reason: >
        Published 0.10.11 bytes remain immutable, so this accepted alpha
        receives the unused 0.10.12 identity.
    - id: release-candidate-requires-publishable-install-tarball
      outcome: unchanged
      reason: >
        The existing exact-candidate and packed-install proofs remain
        authoritative before publication.
    - id: github-tags-publish-one-immutable-alpha-or-stable-release
      outcome: unchanged
      reason: >
        The existing alpha-contained signed-tag workflow remains the only
        publisher and uses npm OIDC provenance with dist-tag alpha.
    - id: public-package-bundles-complete-codor-runtime
      outcome: unchanged
      reason: >
        Only the common version advances; artifact discovery and bundled runtime
        composition are unchanged.
    - id: public-npx-install-is-primary-install
      outcome: unchanged
      reason: >
        The operator can bootstrap this test build through the public npm alpha
        dist-tag after publication.
    - id: vscode-copilot-bridge-is-manual-local-and-credential-private
      outcome: unchanged
      reason: >
        The companion VSIX remains manual and credential-private; only its
        release identity advances.
    - id: acp-v1-events-and-capabilities-are-negotiated
      outcome: unchanged
      reason: >
        ACP behavior is unchanged; clientInfo reports the common 0.10.12 release
        identity.
    - id: workspace-gates-cover-all-buildable-projects
      outcome: unchanged
      reason: >
        Existing recursive build/test coverage remains mandatory in alpha CI and
        the tag release gate.
anchors:
  installed-or-published-release-artifacts-are-version-immutable:
    replaceable-preinstall-release-audit:
      action: change
      reason: Advance the exact immutable candidate version to 0.10.12.
  acp-v1-events-and-capabilities-are-negotiated:
    acp-adapter-runtime:
      action: change
      reason: Advance only the ACP initialize clientInfo version to 0.10.12.
