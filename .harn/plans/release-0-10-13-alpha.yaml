verification: >
  Verify every tracked non-legacy package manifest is exactly 0.10.13 and the
  explicit legacy manifests remain exempt. Run recursive build, serialized
  workspace tests, the complete browser suite, release and license audits, relay
  deployment-decision tests, artifact build and inspection, focused packed
  worktree proof, Harn checks, and diff checks. Push only to origin/alpha,
  require alpha CI green, create and push signed tag v0.10.13, require the
  release workflow green, then verify npm alpha, GitHub prerelease
  assets/checksums, public npx alpha metadata, update this XPS, and run a
  disposable installed-CLI worktree journey. Do not move npm latest or push this
  release commit to main.
