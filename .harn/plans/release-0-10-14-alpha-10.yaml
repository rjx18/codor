verification: >
  Require 19 common manifests at 0.10.14-alpha.10 and the three legacy
  exceptions unchanged. Inspect version-only code/fixture changes and retained
  alpha test fixes; run release/license audits and ordinary Harn/diff checks.
  Commit one real release merge with parents
  03481a33f87f8b16b8a35522084e37ebf7c9c168 and
  12aa3f983baaa758932e16f60a2ccd2979b0a54c. Push only alpha by fast-forward. Do
  not rerun accepted local tests/builds for version metadata. Check CI only
  after twenty minutes; require alpha CI success before signing/pushing
