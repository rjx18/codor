verification: >
  Verify every tracked non-legacy package manifest is exactly 0.10.14-alpha.2
  and the explicit legacy manifests remain exempt. Run recursive build,
  serialized workspace tests, complete browser suite, release/license audits,
  deployment decision tests, artifact build and inspection, and packed npx
  proof. Run Harn and diff checks. Push only to origin/alpha, require alpha CI
  green, create and push signed tag v0.10.14-alpha.2, require the release
  workflow green, then verify npm alpha, GitHub prerelease assets and checksums,
  public npx metadata, and install the exact alpha on this machine. Do not move
  npm latest, push main, or deploy production.
