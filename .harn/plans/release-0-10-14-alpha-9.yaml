id: release-0-10-14-alpha-9
title: Prepare accepted message UI and reconnect improvements as alpha 0.10.14-alpha.9
notes: >
  Release-only preparation from exact accepted main
  f4bb10842676e7ddeba2548ec6176c388aeefe36. Preserve curated alpha history by a
  real merge of exact origin/alpha 0b0eec43fb903eb797fb8f3e384e7073ae7840fe as
  the second parent, followed within this same locked merge by the
  0.10.14-alpha.9 identity update. Preserve existing alpha-only Room38/Room42
  theme-settling test corrections. The eight historical alpha plan records newly
  imported by that merge stay reachable through its exact second parent; omit
  them from this resulting tree so this plan is the sole Harn transition.
  Existing main assumption truth remains untouched. Change only versioned
  manifests, matching ACP clientInfo, CLI fixture identities and exact-version
  release audit. No product, workflow, credential or real-host change. npm
  latest stays 0.10.11. Main CI owns Pages deployment; its checked decision
  skips the unchanged relay Worker. Alpha CI and the signed tag's existing OIDC
  release gate remain mandatory publishers. Reuse the passed combined source
  gates; do not repeat the full local browser suite for version substitutions.
  Inspect/build the distributable and run relevant version fixtures and audits;
  CI performs its unchanged full gates.
