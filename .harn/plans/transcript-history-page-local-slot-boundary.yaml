  - .harn/plans/transcript-history-page-local-slot-boundary.yaml
  - packages/protocol/src/transcript-history.ts
  - packages/protocol/src/transcript-history.spec.ts
  - packages/switchboard/src/transcript-history.ts
  - packages/switchboard/src/transcript-history.spec.ts
  - packages/switchboard/src/transcript-history-index.spec.ts
  - packages/switchboard/src/server.spec.ts
anchors:
  historical-transcript-pages-budget-text-slots:
    transcript-history-text-slot-protocol:
      action: change
      reason: >
        Select the newest window by the slot cost of the returned projection,
        retaining only leading evidence whose selected family contains text.
    transcript-history-text-slot-regression:
      action: change
      reason: >
        Reproduce the old prose and tool family followed by twenty messages,
        prove the head stays at twenty page-local slots, and prove the
        predecessor owns the complete displaced evidence without cursor gaps.
    transcript-history-text-slot-page-builder:
      action: change
      reason: >
        Apply the shared page-local selector to bounded indexed candidates just
        as the legacy builder already does, and encode the returned boundary.
  indexed-transcript-pages-read-only-current-selected-evidence:
    indexed-transcript-page-regression:
      action: change
      reason: >
        Prove indexed and legacy head/predecessor parity with bounded reads and
        no backfill or journal scan fallback at the page-local boundary.
    indexed-transcript-page-query:
      action: change
      reason: >
        Trim the already-bounded indexed candidate rows with the shared protocol
        selector before projecting messages, evidence, and the cursor.
