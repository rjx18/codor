id: transcript-history-reliability-p2-browser-pages
title: Transcript history reliability phase 2 - bounded browser history
notes: >
  Browser integration only, after accepted Phase 1 at a83dc563. Make the
  authenticated combined transcript page the sole cold source for finalized
  history in the mounted transcript. Fetch only the active room's first page;
  keep complete message context, ordered unit descriptors, indexed excerpts,
  opaque cursor, exhaustion, and request state inside that room's injected
  ClientStore so same-named rooms on concurrent computers cannot share data or
  credentials. The server's unit order and unit-owned journal indices are
  authoritative: never regroup across page boundaries.

  A page-hydrated finalized family must not call GET /runs/:id. Mutable runs
  keep their existing full redacted journal recovery plus indexed live buffer
  and are not limited to twenty historical units. When a run observed live
  settles with complete local evidence, preserve the evidence already painted,
  freeze/reconcile it by lifecycle root, permanent output id, and journal index,
  and accept the visible settled tail once without a terminal full-journal
  request or duplicate page unit. If a disconnect or background gap means the
  terminal evidence is not complete locally, reconcile through a deduplicated,
  retryable combined-history head refresh, then follow its opaque cursor only
  far enough to overlap the already loaded range. Merge that head and bridge
  without discarding older pages or ever fetching a finalized /runs/:id. Here
  "unbounded live" means outside the twenty-history-unit page cap; preserve the
  existing bounded live event buffer and authoritative mutable-journal recovery.

  The initial immutable page contains at most twenty visible units. One
  deliberate top reach may request exactly one preceding opaque cursor and must
  give every rendered unit a stable DOM identity and keep the first pre-existing
  visible unit at the same viewport offset, including when the prepended units
  extend the same message/output article. A still intersecting sentinel or
  height changes may not drain more pages. Search, pin, inbox, and #N targets
  walk combined pages sequentially until the target has a materialized unit or
  history is exhausted. A message target is materialized by its ordinary unit
  or by a journal unit whose permanent output id matches it; a lifecycle-root
  target may use the oldest currently materialized unit owned by that root's
  visible family as its existing #root anchor. A complete message supplied only
  as context for another selected unit is not a successful reveal. Then retain
  current fragment, focus/highlight, and scroll behavior. Direct mode uses the
  same API through relayFetch; hosted stores remain isolated and warm switching
  remains in place.

  A failed first-page or head-refresh request stays retryable and must not be
  cached as an honestly empty or exhausted room. Existing rendered history
  remains mounted across a failed refresh.

  Add deterministic unit and Playwright coverage for a huge intra-run page, page
  boundaries, continuations/interleaving, an intra-message unit anchor and
  one-request latching, context-only navigation records, live settlement,
  disconnect-finalize-reconnect head reconciliation, retryable failures,
  same-room computer isolation, and direct mode. Instrument cold browser
  traffic: one initial combined-page request, no finalized /runs/:id request,
  bounded page bytes and units, with mutable-run requests reported separately.
  Preserve search, pins, permalinks, attachments, room support, read state, and
  live fanout. No inactive-channel cold snapshots, server/protocol changes,
  startup optimization, persistent index, unrelated UI redesign, or Phase 3
  relay recovery.
assumptions:
  create:
    - id: finalized-browser-history-is-combined-page-owned
      title: Cold finalized browser history comes only from combined pages
      statement: >
        Once the mounted room hydrates, its cold finalized transcript must
        render only the combined page's ordered units, complete projected
        message context, and unit-owned indexed excerpts, never cold WebSocket
        rows or a full /runs/:id fetch; first-page and cursor request state must
        live inside that room's injected client store so direct mode uses the
        same API and same-named rooms on concurrent hosted computers cannot
        share history, cursors, tokens, or evidence, because the server page is
        the bounded, redacted authority for immutable transcript history; a
        failed first-page request remains retryable and does not establish an
        empty or exhausted room.
      reason: >
        Merging the new endpoint beside the old finalized journal path would
        preserve the request storm and allow cross-computer room-local ids to
        select the wrong evidence.
      depends_on:
        - historical-transcript-pages-match-output-scoped-rendering
        - hosted-computer-sessions-keep-state-isolated
        - redaction-before-fanout
        - run-journals-own-evidence-across-output-messages
    - id: transcript-history-prepends-one-deliberate-page
      title: One deliberate top reach prepends one bounded history page
      statement: >
        The mounted transcript must request only its active room's first page,
        expose at most twenty immutable units initially, deduplicate requests by
        room and opaque cursor, and allow one deliberate top reach to prepend
        exactly one preceding page while giving each rendered unit a stable DOM
        identity and holding the first pre-existing visible unit at the same
        viewport offset, even when old and new units extend the same permanent
        message/output article; the request latch must remain closed while the
        sentinel stays intersecting or row heights settle, and reopen only after
        the operator leaves and deliberately reaches the top again, so one
        gesture cannot auto-drain history.
      reason: >
        A cursor may end inside one huge run, so message counts and an
        always-live top sentinel cannot enforce the operator's twenty-unit
        loading boundary.
      depends_on:
        - finalized-browser-history-is-combined-page-owned
        - permalink-ids-stable
    - id: live-runs-settle-beside-paged-history-once
      title: Live runs remain uncapped and settle into paged history once
      statement: >
        A mutable run must continue rendering its recovered full redacted
        journal and indexed live stream without the twenty-unit history cap, and
        when an observed run becomes terminal the browser must preserve and
        freeze the evidence already rendered, reconcile any combined-page
        excerpt by root, permanent output id, and journal index, and render its
        settled tail at most once without issuing a terminal /runs/:id fetch or
        duplicating, dropping, or reordering the live evidence.
      reason: >
        Replacing a long live turn with only the newest immutable page loses
        work, while retaining both sources without indexed reconciliation
        duplicates it.
      depends_on:
        - finalized-browser-history-is-combined-page-owned
        - run-events-merge-by-journal-index
        - live-run-event-cache-bounded
        - continuation-writer-follows-journaled-output-ownership
        - missed-terminal-history-refreshes-through-combined-head
    - id: missed-terminal-history-refreshes-through-combined-head
      title: Missed terminal evidence reconciles through a retryable combined head
      statement: >
        When resume or live-state reconciliation finds that a formerly mutable
        run finalized without complete locally preserved indexed and terminal
        evidence, the active room must deduplicate one combined-history head
        refresh, merge its units into the mounted range without discarding older
        loaded pages, and follow the returned opaque cursor only until overlap or
        exhaustion bridges any gap; it must never fetch finalized /runs/:id,
        concurrent resume/head signals must share the same work, and a failed
        head or bridge request must preserve rendered history and remain
        retryable rather than marking the room empty or exhausted.
      reason: >
        A tab can miss the settlement frames while asleep, so locally freezing
        an incomplete mutable cache loses terminal evidence, while re-reading
        the full journal restores the unbounded request path Phase 2 removes.
      depends_on:
        - finalized-browser-history-is-combined-page-owned
        - run-events-merge-by-journal-index
        - client-syncs-by-seq
    - id: transcript-targets-walk-combined-pages
      title: Transcript targets resolve through bounded combined pages
      statement: >
        Search results, pinned messages, inbox rows, and #N permalinks outside
        the mounted immutable page must walk the room's combined opaque cursors
        in order only until the target has a materialized renderable unit or
        history is exhausted. An ordinary unit materializes its message id; a
        journal unit materializes its permanent output message id; and a
        lifecycle-root target may resolve to the oldest currently materialized
        unit in that root's visible family, which carries the existing #root
        anchor. A complete message present only as attribution context for
        another unit must not stop the walk. Concurrent walks must deduplicate
        and success must preserve the exact fragment, focus/highlight, and
        centered scroll behavior, because bounded history must not turn existing
        navigation into dead links or load the entire archive speculatively.
      reason: >
        Target metadata can name a permanent message outside the first twenty
        visible units, but the old integer message endpoint is no longer the
        finalized transcript source.
      depends_on:
        - finalized-browser-history-is-combined-page-owned
        - transcript-history-prepends-one-deliberate-page
        - permalink-ids-stable
  reviewed:
    - id: history-cursor-tracks-only-the-contiguous-tail
      outcome: unchanged
      reason: >
        The legacy runtime/state.ts and runtime/ws.ts integer-cursor hydration
        path remains unchanged and anchored; the mounted app's parallel
        combined-page state exclusively owns finalized transcript rendering.
    - id: historical-transcript-pages-match-output-scoped-rendering
      outcome: unchanged
      reason: The browser consumes Phase 1's exact room-bound unit contract without
        changing it.
    - id: addressed-cold-hydration-is-strict-and-legacy-safe
      outcome: unchanged
      reason: >
        Addressed WebSocket hydration remains bounded metadata/support and warm
        live sync; it simply stops owning cold finalized transcript rendering.
    - id: client-syncs-by-seq
      outcome: unchanged
      reason: Live frames still upsert by permanent id and reconnect by seq.
    - id: permalink-ids-stable
      outcome: unchanged
      reason: Combined units, live overlays, and target walks retain permanent
        room-local ids.
    - id: continuation-writer-follows-journaled-output-ownership
      outcome: unchanged
      reason: Permanent output ids remain authoritative across excerpts and live
        settlement.
    - id: run-journals-own-evidence-across-output-messages
      outcome: unchanged
      reason: One lifecycle-root journal still owns raw evidence for all continuation
        rows.
    - id: run-events-merge-by-journal-index
      outcome: unchanged
      reason: Page excerpts and live buffers reconcile only by their durable indices.
    - id: live-run-event-cache-bounded
      outcome: unchanged
      reason: >
        Live runs are uncapped by history units but retain the existing
        500-event buffer plus authoritative mutable-journal recovery.
    - id: web-compaction-markers-upgrade-in-place
      outcome: unchanged
      reason: Indexed page units and live evidence preserve one upgraded marker.
    - id: transcript-diffs-use-immutable-run-evidence
      outcome: unchanged
      reason: Diff dialogs consume the selected immutable excerpt and never live
        working-tree state.
    - id: run-failure-evidence-is-surfaced
      outcome: unchanged
      reason: Visible failure error/status remains one settled tail under both page
        and live ownership.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: Each injected store owns its own room pages, cursors, requests, and
        token.
    - id: hosted-app-keeps-all-paired-computers-live
      outcome: unchanged
      reason: Managed resume reconciliation remains scoped to the active entry and
        does not stop or disturb other warm sessions.
    - id: hosted-computer-switching-reuses-warm-session
      outcome: unchanged
      reason: Switching reveals the warm store's existing history without reload or
        new handshake.
    - id: redaction-before-fanout
      outcome: unchanged
      reason: The browser stores and renders only the server's projected REST/live
        evidence.
    - id: pins-are-durable-owner-admin-markers
      outcome: unchanged
      reason: Pin authority and durability stay unchanged; only target reveal uses
        combined pages.
    - id: the-inbox-opens-what-needs-you
      outcome: unchanged
      reason: Inbox rows retain their exact permanent targets and highlight behavior.
    - id: empty-and-offline-are-shown-not-blank
      outcome: unchanged
      reason: >
        Initial page loading remains behind the existing honest skeleton/empty
        surfaces, while failed first/head requests remain errors eligible for
        retry rather than false empty/exhausted results.
    - id: settings-navigation-reuses-live-session
      outcome: unchanged
      reason: Direct-mode resume adds head reconciliation without replacing the
        mounted connector or changing settings navigation.
