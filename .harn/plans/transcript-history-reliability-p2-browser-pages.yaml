anchors:
  finalized-browser-history-is-combined-page-owned:
    combined-history-api-client:
      action: change
      reason: Fetch and validate one authenticated room-bound combined page through
        relayFetch.
    combined-history-store:
      action: change
      reason: Keep messages, units, excerpts, cursors, and request state in each
        injected room store.
    combined-history-materializer:
      action: change
      reason: Materialize exactly the server-ordered units without regrouping across
        pages.
    combined-history-finalized-fetch-guard:
      action: change
      reason: Full journal reads remain mutable-only after combined page hydration.
    combined-history-rendering:
      action: change
      reason: Render page-owned finalized units plus mutable/live overlays only.
    combined-history-browser-regression:
      action: change
      reason: Prove one bounded cold page, no finalized run fetch, isolation, and
        direct mode.
  transcript-history-prepends-one-deliberate-page:
    deliberate-history-page-controller:
      action: change
      reason: Deduplicate first/older requests and merge one opaque cursor atomically.
    deliberate-history-top-reach:
      action: change
      reason: Latch one request per deliberate reach and restore the stable visible
        anchor.
    deliberate-history-top-reach-regression:
      action: change
      reason: Prove intra-run boundaries, one-request latching, and pixel-stable
        prepends.
  live-runs-settle-beside-paged-history-once:
    live-history-settlement-cache:
      action: change
      reason: Preserve mutable journal/live evidence at settlement without a terminal
        fetch.
    live-history-settlement-renderer:
      action: change
      reason: Reconcile preserved evidence and immutable excerpts once by durable
        identity.
    live-history-settlement-regression:
      action: change
      reason: Prove an uncapped live run settles without loss, duplication, or /runs
        refetch.
  missed-terminal-history-refreshes-through-combined-head:
    combined-history-head-refresh:
      action: change
      reason: Deduplicate retryable active-room head reconciliation and preserve
        mounted older pages.
    combined-history-gap-bridge:
      action: change
      reason: Follow the refreshed head cursor only to overlap/exhaustion and merge by
        stable unit identity.
    combined-history-resume:
      action: change
      reason: Reconcile finalized head evidence before refreshing journals that remain
        mutable in direct and managed active sessions.
    combined-history-head-regression:
      action: change
      reason: Prove disconnect-finalize-reconnect, gap bridging, request deduplication,
        retry after failure, and zero finalized run fetches.
  transcript-targets-walk-combined-pages:
    combined-history-target-reveal:
      action: change
      reason: Search, pin, inbox, and permalink targets share the bounded page walker.
    combined-history-target-regression:
      action: change
      reason: Prove target walks stop on success/exhaustion and keep focus, hash, and
        scroll behavior.
  continuation-writer-follows-journaled-output-ownership:
    continuation-web-rendering:
      action: change
      reason: Existing continuation rendering consumes page-owned excerpts and
        reconciled live evidence.
  web-compaction-markers-upgrade-in-place:
    web-compaction-timeline-wiring:
      action: change
      reason: Existing compaction rendering receives explicit page-unit boundaries and
        live reconciliation.
  hosted-app-keeps-all-paired-computers-live:
    computer-session-lifecycle:
      action: change
      reason: Keep managed resume head reconciliation inside the existing warm-session
        lifecycle.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Resume the active entry with its own store and token without touching
        inactive sessions.
  settings-navigation-reuses-live-session:
    mounted-settings-route:
      action: change
      reason: Add direct-mode head reconciliation to the existing connector resume hook
        without remounting it.
