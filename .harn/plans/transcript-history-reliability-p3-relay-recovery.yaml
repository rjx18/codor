      action: change
      reason: Replace first-connect truth with current-generation waiters and stale
        rejection.
    tunnel-state-subscribers:
      action: change
      reason: Publish each generation transition to independent listeners.
    idempotent-tunnel-recovery:
      action: change
      reason: Coalesce connection attempts, retry timers, and foreground acceleration.
    tunnel-generation-regression:
      action: change
      reason: Prove current readiness, stale callbacks, subscribers, and one handshake.
  hosted-app-streams-follow-tunnel-generations:
    generation-gated-app-connector:
      action: change
      reason: Gate app creation and retry on the owning connected tunnel generation.
    generation-gated-connector-regression:
      action: change
      reason: Prove both race orders, exact app-open counts, parks, and direct
        behavior.
    generation-aware-computer-session:
      action: change
      reason: Validate bootstrap generation and give each connector its own tunnel
        gate.
    generation-aware-session-regression:
      action: change
      reason: Prove independent entries and stale bootstrap work cannot mount
        connectors.
    coordinated-recovery-browser-regression:
      action: change
      reason: Prove foreground and host-return recovery without reload or duplicate
        handshakes.
    independent-computer-recovery-regression:
      action: change
      reason: Prove one computer recovers without reopening or closing another.
  relay-app-socket-readiness-requires-server-evidence:
    relay-app-socket-readiness:
      action: change
      reason: Preserve frame-based readiness inside the generation-gated open path.
    relay-app-socket-readiness-unit-regression:
      action: change
      reason: Retain server-evidence admission while adding tunnel ordering coverage.
    relay-app-socket-readiness-browser-regression:
      action: change
      reason: Keep real hosted recovery gated by a replacement server frame.
  hosted-app-keeps-all-paired-computers-live:
    computer-session-lifecycle:
      action: change
      reason: Subscribe each entry independently and keep recovery alive until
        disposal.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Thread each entry's own tunnel generation into its connector and
        bootstrap.
  hosted-offline-recovery-offers-other-computers:
    multi-computer-recovery-regression:
      action: change
      reason: Extend the warm-computer journey with independent coordinated recovery.
