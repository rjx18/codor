id: unified-loading-pill-p3
title: Prioritize one existing room loading pill
notes: >
  Replace the reconnect-only floating indicator with one compact, accessible
  status pill. Its state is a pure projection of the current connection,
  active-room hydration/readiness, and existing transcript-history loadingHead
  and loadingCursor flags. Priority is Reconnecting, Loading channel, Syncing
  messages, then Loading older messages. The phase must not add a loading state
  machine, request path, timer, recovery owner, or socket behavior.
assumptions:
  retire: []
  create:
    - id: prioritized-room-loading-pill-uses-existing-readiness
      title: One room loading pill projects existing readiness in fixed priority
      statement: >
        The web client exposes at most one top floating room-status pill whose
        visible state is derived without new local loading state or requests:
        Reconnecting has priority whenever the current connection is not online
        and the retained room is in the existing readable reconnect boundary;
        otherwise an unhydrated or not-currently-ready active room reports
        Loading channel, an existing transcript-history loadingHead reports
        Syncing messages, and an existing loadingCursor reports Loading older
        messages. The first true state wins, lower-priority work never flashes
        concurrently, the pill remains accessible and compact, and direct/hosted
        store isolation plus existing recovery and mutation admission semantics
        remain unchanged.
      reason: >
        Operators currently see only Reconnecting even while a live room is
        hydrating or deliberately loading history. The needed signals already
        exist in connection state, roomLive/hydrated state, and the combined
        history controller, so a pure prioritized projection is sufficient and
        avoids inventing another lifecycle owner.
      depends_on:
        - readable-reconnecting-room-never-admits-mutation
        - hosted-app-streams-follow-tunnel-generations
        - hosted-computer-sessions-keep-state-isolated
        - finalized-browser-history-is-combined-page-owned
        - transcript-history-prepends-one-deliberate-page
        - selected-room-activation-reconciles-destination-history
        - relay-app-socket-readiness-requires-server-evidence
  reviewed:
    - id: readable-reconnecting-room-never-admits-mutation
      outcome: unchanged
      reason: >
        Reconnecting remains the existing read-only presentation boundary; this
        phase only changes its pill text/priority and does not admit mutation
        before current server readiness.
    - id: hosted-app-streams-follow-tunnel-generations
      outcome: unchanged
      reason: >
        The pill reads connection state and never opens, retries, or replaces a
        tunnel or app socket.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: >
        Hydration, readiness, and history flags are read from the active
        injected client store, preserving managed-computer isolation.
    - id: finalized-browser-history-is-combined-page-owned
      outcome: unchanged
      reason: >
        Existing combined-history requests and page ownership remain the only
        finalized transcript path; the indicator observes their state only.
    - id: transcript-history-prepends-one-deliberate-page
      outcome: unchanged
      reason: >
        Loading older messages is projected from the existing cursor request
        flag without changing the deliberate paging latch or scroll owner.
    - id: selected-room-activation-reconciles-destination-history
      outcome: unchanged
      reason: >
        Room activation and destination-owned history reconciliation remain
        responsible for readiness and requests.
    - id: relay-app-socket-readiness-requires-server-evidence
      outcome: unchanged
      reason: >
        Current-generation server evidence still controls connected/readiness;
        the pill does not reinterpret WebSocket OPEN as live.
files:
  - .harn/plans/unified-loading-pill-p3.yaml
  - packages/web-next/src/surfaces/RecoveryOverlay.tsx
  - packages/web-next/src/surfaces/RecoveryOverlay.spec.tsx
  - packages/web-next/tests/room36-smooth-startup.e2e.spec.ts
anchors:
  prioritized-room-loading-pill-uses-existing-readiness:
    loading-pill-state-projection:
      action: change
      reason: >
        Project connection, active-room readiness, and existing history flags
        into one fixed-priority loading state without adding a state machine.
    loading-pill-render:
      action: change
      reason: >
        Render one compact accessible top pill with the selected state while
        retaining the existing reconnect/read-only surface boundary.
    loading-pill-unit-regression:
      action: change
      reason: >
        Prove every state and priority ordering through the pure selector,
        including simultaneous readiness/history signals.
    loading-pill-browser-regression:
      action: change
      reason: >
        Prove the real hosted surface exposes the loading indicator during
        history synchronization and retains reconnect behavior without a second
        pill or transport side effect.
verification: >
  Run the focused RecoveryOverlay/store/history units, the Room 36 hosted
  startup/reconnect browser regression (including every loading state and the
  priority order), all web-next units, the production/PWA build, Harn find/plan
  check/clean-lock/check/apply/staged validation, git diff --check, and a final
  clean-tree check. Do not change connector, relay, protocol, daemon, history
  request, scroll, cache, release, or deployment behavior.
