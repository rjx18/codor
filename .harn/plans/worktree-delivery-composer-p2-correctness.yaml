id: worktree-delivery-composer-p2-correctness
title: Message-owned held retry, exact-mention send, cache revalidation, and
  visual tool batching
notes: >
  Implement only Phase 2 of the approved worktree delivery/composer polish plan.
  Move ordinary held-delivery recovery from the global banner onto the exact
  originating human message and expose only evidence-preserving release_hold
  there. On desktop, an exact trailing local or qualified mention sends on the
  first Enter while partial tokens retain autocomplete and mobile Enter remains
  a newline. Treat a persisted last-good combined-history head as readable but
  stale until the authenticated current computer and tunnel generation
  successfully revalidate it; deduplicate/retry current-store head requests and
  retain newer live rows throughout. In browser presentation only, merge
  adjacent tool-only evidence belonging to one run root across permanent output
  rows and loaded-page boundaries, preserve every unit/message anchor, and stop
  at any visible prose, message, compaction, settled status, or different root.
  Server unitization, delivery persistence/actions, routing, relay/tunnel
  generations, and protocol shapes remain unchanged.
assumptions:
  create:
    - id: held-delivery-recovery-stays-on-origin-message
      title: Held delivery recovery stays on the originating message
      statement: >
        Each held agent delivery must remain projected on its originating human
        message after live updates and reload, with a compact per-recipient
        error affordance whose only ordinary retry action is release_hold;
        retrying one recipient preserves that attempt's root, journal, and
        accounting, never creates a fresh redelivery, and the affordance clears
        only when that delivery leaves held state while unrelated held
        recipients remain independently actionable.
      reason: The global banner disconnects recovery from the failed instruction and
        presents evidence-preserving release and fresh redelivery as equivalent.
      depends_on:
        - agent-delivery-lifecycle-streams-v2
        - held-recovery-runs-are-inactive-until-release
    - id: exact-trailing-mentions-send-before-completion
      title: Exact trailing mentions send before autocomplete completion
      statement: >
        On desktop, when the live textarea caret is at the end of an exact
        registered local @handle or complete qualified ~selector:@handle token,
        the first unmodified Enter must submit that unchanged draft; partial or
        ambiguous tokens retain keyboard completion, mobile Enter remains a
        newline, parser/server refusal preserves the draft, and successful
        submission clears only after its own echoed message.
      reason: The completion popover currently consumes Enter even after the typed
        token already exactly names its intended recipient.
      depends_on:
        - composer-enter-uses-live-draft-state
        - qualified-completion-lists-registered-targets-only
        - echo-driven-composer-clearing
    - id: cached-transcript-head-stays-stale-until-revalidated
      title: A persisted transcript head stays stale until authenticated revalidation
      statement: >
        A hosted last-good transcript projection may render read-only while
        disconnected but must remain marked as requiring head revalidation until
        the owning computer's current authenticated tunnel generation
        successfully refreshes the combined-history head; readiness and resume
        signals deduplicate the correct source-store/token request, failures
        stay retryable, and reconciliation retains newer live rows and
        previously rendered evidence without importing another computer's
        same-named room.
      reason: Hydrating the cache as initialized lets normal ensure logic accept an
        old head, while the one fire-and-forget replacement refresh can fail or
        race.
      depends_on:
        - hosted-last-good-room-cache-is-bounded-read-only-projection
        - missed-terminal-history-refreshes-through-combined-head
        - hosted-computer-sessions-keep-state-isolated
        - hosted-app-streams-follow-tunnel-generations
    - id: tool-only-evidence-batches-across-invisible-output-boundaries
      title: Tool-only evidence batches across invisible output boundaries
      statement: >
        Browser presentation must coalesce adjacent tool-only units from the
        same run root into one aggregate even when they cross permanent output
        rows or a loaded-page boundary, while retaining every stable unit,
        output-message, root, permalink, search, and scroll anchor and stopping
        at any visibly rendered prose, ordinary message, compaction marker,
        settled tail/status, or different run root; immutable server unitization
        and evidence ownership remain output-scoped.
      reason: Invisible output-row boundaries currently produce repeated adjacent tool
        cards even though the evidence model is correctly output-scoped.
      depends_on:
        - historical-transcript-pages-match-output-scoped-rendering
        - finalized-browser-history-is-combined-page-owned
        - live-runs-settle-beside-paged-history-once
  reviewed:
    - id: agent-delivery-lifecycle-streams-v2
      outcome: unchanged
      reason: Existing live queued/delivering/consumed/held transitions remain the
        source of truth; only the held browser projection moves onto its
        message.
    - id: held-recovery-runs-are-inactive-until-release
      outcome: unchanged
      reason: Inline retry invokes the existing release_hold act and neither revives
        nor creates work through any other path.
    - id: active-turn-steering-is-ordered-and-durable
      outcome: unchanged
      reason: Existing steered and delivered ticks remain unchanged beside the added
        held affordance.
    - id: composer-enter-uses-live-draft-state
      outcome: fixed
      reason: Keydown still reads the live value/caret but now distinguishes a
        complete exact token from a partial completion query before consuming
        Enter.
    - id: qualified-completion-lists-registered-targets-only
      outcome: unchanged
      reason: The same bounded catalog defines exact qualified tokens and suggestions;
        routing and refusal behavior do not change.
    - id: hosted-last-good-room-cache-is-bounded-read-only-projection
      outcome: fixed
      reason: Persisted content stays bounded, isolated, and readable, but is no
        longer mistaken for a successfully authenticated current head.
    - id: hosted-explicit-room-survives-cached-bootstrap
      outcome: unchanged
      reason: Explicit room intent, cached bootstrap selection, and authoritative live
        room discovery remain unchanged.
    - id: readable-reconnecting-room-never-admits-mutation
      outcome: unchanged
      reason: Cached/retained rows remain readable while all mutations stay blocked
        until current server evidence restores readiness.
    - id: missed-terminal-history-refreshes-through-combined-head
      outcome: fixed
      reason: Its retryable deduplicated head controller now also owns explicit
        stale-cache revalidation without any finalized journal fallback.
    - id: finalized-browser-history-is-combined-page-owned
      outcome: unchanged
      reason: Revalidated combined pages remain the sole finalized-history authority
        in direct and hosted stores.
    - id: hosted-computer-sessions-keep-state-isolated
      outcome: unchanged
      reason: Every revalidation captures one concrete source store and that
        computer's current token across awaits.
    - id: hosted-app-streams-follow-tunnel-generations
      outcome: unchanged
      reason: Existing current-generation readiness/resume callbacks trigger recovery;
        socket creation and relay generation logic do not change.
    - id: historical-transcript-pages-match-output-scoped-rendering
      outcome: unchanged
      reason: Server units remain output-scoped and unchanged; only adjacent browser
        presentation is coalesced.
    - id: live-runs-settle-beside-paged-history-once
      outcome: unchanged
      reason: Live evidence, settlement reconciliation, and no-finalized-journal-fetch
        guarantees remain intact while applying the same visual separator rule.
