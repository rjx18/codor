    combined-history-resume:
      action: change
      reason: Trigger retry from current connector readiness/resume with the owning
        token.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Bind stale-cache refresh lifecycle to the owning entry store and token.
    captured-history-source-regression:
      action: change
      reason: Keep unresolved A revalidation out of same-named B after a switch.
  hosted-app-streams-follow-tunnel-generations:
    generation-aware-computer-session:
      action: change
      reason: Reuse only current-generation connector readiness/resume signals.
  cached-transcript-head-stays-stale-until-revalidated:
    cached-history-revalidation-state:
      action: change
      reason: Record whether an initialized rendered head still requires
        authentication.
    cached-history-revalidation-lifecycle:
      action: change
      reason: Retry through current computer readiness/resume and clear only on
        success.
    cached-history-revalidation-regression:
      action: change
      reason: Cover hard-refresh stale head, delayed readiness, failure/retry, and
        isolation.
  historical-transcript-pages-match-output-scoped-rendering:
    output-scoped-history-unitization-regression:
      action: keep
      reason: Server output-scoped page composition stays unchanged.
  finalized-browser-history-is-combined-page-owned:
