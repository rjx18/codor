      action: change
      reason: Preserve settlement identity while applying the same separator rule.
  tool-only-evidence-batches-across-invisible-output-boundaries:
    cross-output-tool-batch-presentation:
      action: change
      reason: Own adjacency classification and aggregate rendering across output rows.
    cross-output-tool-batch-regression:
