id: worktree-orchestration-correctness-p1-selector-collisions
title: Make lossy branch selectors collision-safe
notes: >
  Final contained Phase 1 review correction only. Preserve clean short branch
  selectors exactly, but append a deterministic short digest whenever deriving
  the bounded selector lowercases, normalizes, or truncates the full branch.
  Exact branch selection remains authoritative. Prove slash-versus-dash, case,
  and long-prefix branches produce distinct selectors and coexist in one
  registered repository. Update only the installed packed proof's derived
  shorthand; no UI, relay, migration, routing, authorization, or Phase 2 work.
assumptions:
  reviewed:
    - id: readable-branch-conversations-own-worktree-identity
      outcome: unchanged
      reason: The existing truth already requires a digest for lossy or truncated
        selectors; this correction makes the helper and regressions fulfill it.
    - id: registered-worktree-identities-are-durable
      outcome: unchanged
      reason: Distinct valid branches must continue to register as distinct durable
        records without changing repository or worktree identity semantics.
    - id: packed-management-workflow-persists-target-owned-worktree-turn
      outcome: unchanged
      reason: The installed journey remains target-owned and now addresses the child
        through the corrected derived shorthand.
    - id: worktree-discovery-never-registers-candidates
      outcome: unchanged
      reason: Discovery remains read-only and registration-neutral; the selector
        expectation merely crosses its enclosing protocol regression.
    - id: repository-primary-identity-is-git-derived
      outcome: unchanged
      reason: Git repository and primary identity are unchanged by selector formatting.
    - id: branch-worktree-creation-registers-only-its-result
      outcome: unchanged
      reason: Creation remains collision-safe and registers only its observed result.
    - id: worktree-git-execution-is-argument-safe
      outcome: unchanged
      reason: Git argv and safety boundaries remain unchanged while expectations follow
        the corrected selector.
    - id: worktree-removal-is-clean-and-branch-preserving
      outcome: unchanged
      reason: Removal and branch preservation remain unchanged.
    - id: qualified-member-target-identity-is-durable
      outcome: unchanged
      reason: Durable qualified identities are unchanged; projected selector snapshots
        now carry the collision-safe value.
    - id: target-worktree-owns-qualified-conversation
      outcome: unchanged
      reason: Target-owned routing is unchanged; test messages address returned aliases.
    - id: qualified-destination-refusals-are-atomic
      outcome: unchanged
      reason: Atomic refusal behavior is unchanged; fixtures address valid derived aliases.
    - id: delivery-attempt-wal-reconcile
      outcome: unchanged
      reason: Delivery recovery remains unchanged across selector fixture updates.
    - id: child-members-own-isolated-runtime
      outcome: unchanged
      reason: Child runtime isolation and teardown remain unchanged.
    - id: agent-orchestration-is-repository-scoped
      outcome: unchanged
      reason: Repository-scoped authorization is unchanged; response expectations use the
        corrected selector.
    - id: qualified-completion-lists-registered-targets-only
      outcome: unchanged
      reason: Catalog membership is unchanged; aliases reflect collision-safe derivation.
    - id: structured-worktree-cli-targets-branches-and-child-rooms
      outcome: unchanged
      reason: Exact branch and derived shorthand CLI selection remains unchanged.
    - id: qualified-cli-wait-follows-target-owned-conversation
      outcome: unchanged
      reason: Qualified waits remain target-owned while using the returned shorthand.
    - id: main-and-direct-conversations-stay-compatible
      outcome: unchanged
      reason: Main and direct behavior remains unchanged by child selector formatting.
    - id: operator-launches-serve-web-next
      outcome: unchanged
      reason: The CLI regression imports the selector helper inside a monolithic fixture;
        every service and current-web-client path remains unchanged.
