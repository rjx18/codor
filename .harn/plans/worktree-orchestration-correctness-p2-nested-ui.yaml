verification: Before editing, run harn find for every reviewed assumption and
  harn find --file for every declared source file. Run harn plan check and lock
  this plan from the clean 323c4ae base. Add focused summary and WorktreeGroup
  units, the two-child Room 40 browser regressions, the existing WorktreeGroup
  Axe coverage, the web-next unit suite, and the web-next production build. Run
  harn find --changed, harn check, harn apply, harn check --staged, git diff
  --check, and verify the final worktree is clean. Stage only this plan, the
  seven declared files, and generated assumption truth; create exactly one
  implementation commit. Do not push, deploy, release, or alter relay/database
  behavior.
